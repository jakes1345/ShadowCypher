name = "shadowcypher-api"
main = "src/index.ts"
compatibility_date = "2026-04-26"
compatibility_flags = ["nodejs_compat"]

# Custom domain api.shadowcypher.site is bound MANUALLY in the Cloudflare dashboard
# (Workers & Pages → shadowcypher-api → Settings → Triggers → Custom Domains)
# because the domain is in a different Cloudflare account than the one wrangler is logged into.
workers_dev = true

# Public-safe vars (committed to git). Secrets go via `wrangler secret put`.
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://shadowcypher.site,https://www.shadowcypher.site,https://dev.shadowcypher.site,http://localhost:8081"
