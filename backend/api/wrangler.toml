name = "shadowcypher-api"
main = "src/index.ts"
compatibility_date = "2026-04-26"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

routes = [{ pattern = "api.shadowcypher.site", custom_domain = true }]

# Public-safe vars (committed to git). Secrets go via `wrangler secret put`.
#
# Secrets to configure (run once):
#   wrangler secret put RESEND_API_KEY          # re_... from resend.com/api-keys
#   wrangler secret put SUPABASE_WEBHOOK_SECRET # any random string; set same in Supabase webhook header
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://shadowcypher.site,https://www.shadowcypher.site,https://dev.shadowcypher.site,http://localhost:8081"
SITE_URL = "https://shadowcypher.site"
RESEND_FROM_EMAIL = "ShadowCypher <noreply@shadowcypher.site>"
AGENT_VERSION = "0.3.0"
AGENT_SHA256 = "6590fee3f95e24a9a14a968feb598327eeb2daece83654fffe5e7cf974e13d4f"

[[kv_namespaces]]
binding = "SHADOW_OTA"
id = "d16349c7f8194a6f9247a20a962f60d1"
preview_id = "806c715c0dbd4e8aadd072a75e87bbc6"

[triggers]
crons = ["0 * * * *"]
