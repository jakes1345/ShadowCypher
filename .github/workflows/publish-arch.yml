name: Publish arch repository

# Builds the ten [shadowos] packages with packaging/arch/build-repo.sh.
#
# On a pull request that is all it does: a change that breaks a package fails
# the check before it reaches main. On main the packages and the database are
# also signed, checked against the key shadowos-keyring ships, and published.
# A package that fails to build, or a repository that fails a check, stops the
# run before the publish job.
#
# The build compares every package with the published one. Unchanged packages
# keep their published file; changed ones get the next release number, which
# is what makes pacman offer them as an upgrade. The run's summary lists which
# is which, on pull requests too.
on:
  push:
    branches: [main]
    paths:
      - 'packaging/arch/**'
      - 'shadowcypher-qt/**'
      - 'shadowscript/missions/**'
      - 'shadowos/profile/airootfs/**'
      - 'www/arch/**'
      - '.github/workflows/publish-arch.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packaging/arch/**'
      - 'shadowcypher-qt/**'
      - 'shadowscript/missions/**'
      - 'shadowos/profile/airootfs/**'
      - 'www/arch/**'
      - '.github/workflows/publish-arch.yml'
  workflow_dispatch:

# Publishing runs one at a time and is never cancelled halfway. Pull-request
# builds only keep the newest run per branch.
concurrency:
  group: arch-repo-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# bash with pipefail in both jobs. The container job would otherwise run its
# steps with sh, where a failure on the left of a pipe goes unnoticed.
defaults:
  run:
    shell: bash

env:
  KEY_ID: 3ACC49288AC4F3BCBE1CDE98D9F1D18F1313F083
  # The release whose assets are the repository. www/_redirects names it too.
  RELEASE_TAG: arch-repo

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}

    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git
          # makepkg refuses to run as root. It installs the build dependencies
          # the PKGBUILDs ask for through sudo.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      # Only main is signed and published. Pull requests and manual runs on
      # other branches build the same packages unsigned.
      - name: Decide whether this run publishes
        id: mode
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # install.sh hands users www/arch/shadowos.gpg; the keyring package
      # ships its own copy. They have to be the same key.
      - name: Check the served key is the packaged key
        run: cmp packaging/arch/shadowos-keyring/shadowos.gpg www/arch/shadowos.gpg

      - name: Import signing key
        if: steps.mode.outputs.publish == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::APT_SIGNING_KEY is not set; cannot sign packages"
            exit 1
          fi
          install -d -m 700 -o builder -g builder /home/builder/.gnupg
          echo "$APT_SIGNING_KEY" | base64 -d |
            sudo -u builder env GNUPGHOME=/home/builder/.gnupg gpg --batch --import
          echo "${KEY_ID}:6:" |
            sudo -u builder env GNUPGHOME=/home/builder/.gnupg gpg --batch --import-ownertrust
          sudo -u builder env GNUPGHOME=/home/builder/.gnupg \
            gpg --list-secret-keys --keyid-format=long "$KEY_ID"

      - name: Build packages and repository
        env:
          PACKAGER: "ShadowCypher <admin@shadowcypher.site>"
          SIGN_KEY: ${{ steps.mode.outputs.publish == 'true' && env.KEY_ID || '' }}
          # The release itself, not the shadowcypher.site address that
          # redirects to it: one thing fewer between the build and the truth.
          PUBLISHED_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}
        run: |
          install -d -o builder -g builder "$RUNNER_TEMP/build"
          sudo -u builder env PACKAGER="$PACKAGER" SIGN_KEY="$SIGN_KEY" \
            PUBLISHED_URL="$PUBLISHED_URL" SUMMARY="$RUNNER_TEMP/build/versions.md" \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" GNUPGHOME=/home/builder/.gnupg \
            packaging/arch/build-repo.sh "$RUNNER_TEMP/build/repo"

      - name: Summarise
        run: cat "$RUNNER_TEMP/build/versions.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload repository
        if: steps.mode.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shadowos-repo
          path: ${{ runner.temp }}/build/repo/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # The repository is the set of assets on one rolling GitHub release. It
  # cannot live in git: main is protected, and shadowos-branding alone is over
  # GitHub's 100 MB file limit. Users never see this address; pacman is pointed
  # at https://shadowcypher.site/arch/shadowos/x86_64, which www/_redirects
  # sends here.
  publish:
    name: Publish to the release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # create the release and replace its assets
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/arch

      - uses: actions/download-artifact@v4
        with:
          name: shadowos-repo
          path: ${{ runner.temp }}/repo

      # Uploads the new package versions, then the database, then removes the
      # versions it replaced. Unchanged packages are left alone.
      - name: Publish
        run: packaging/arch/publish-release.sh "$RUNNER_TEMP/repo" "$RELEASE_TAG"

      - name: Check what users will download
        working-directory: ${{ runner.temp }}/repo
        run: |
          # The release itself, then the address pacman is given.
          for base in "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG" \
                      "https://shadowcypher.site/arch/shadowos/x86_64"; do
            for f in shadowos.db shadowos.db.sig; do
              if ! curl -fsSL --retry 6 --retry-delay 20 --retry-all-errors -o "$RUNNER_TEMP/$f" "$base/$f"; then
                echo "::error title=Published repository is not reachable::could not download $base/$f (the release assets were uploaded; if this is the shadowcypher.site address, check the /arch/ rule in www/_redirects)"
                exit 1
              fi
              if ! cmp -s "$f" "$RUNNER_TEMP/$f"; then
                echo "::error title=Published repository is stale::$base/$f is not the file this run published"
                exit 1
              fi
            done
          done

      # The user's path, start to finish, on a stock Arch system: install.sh
      # from the site, then pacman downloads every package through the
      # redirect and verifies it against the key install.sh imported.
      - name: Install from the published repository
        run: |
          expected=$(ls "$RUNNER_TEMP"/repo/*.pkg.tar.zst | wc -l)
          docker run --rm -e EXPECTED="$expected" archlinux:latest bash -euo pipefail -c '
            pacman-key --init
            curl -fsSL https://shadowcypher.site/arch/install.sh | bash
            mapfile -t pkgs < <(pacman -Slq shadowos)
            if [ "${#pkgs[@]}" -ne "$EXPECTED" ]; then
              echo "::error title=Published repository is incomplete::[shadowos] lists ${#pkgs[@]} packages, this run built $EXPECTED"
              exit 1
            fi
            pacman -Sw --noconfirm --nodeps --nodeps "${pkgs[@]}"
          '
          echo "The $RELEASE_TAG release holds $expected packages; a stock Arch container installed the repository from shadowcypher.site and verified all of them." >> "$GITHUB_STEP_SUMMARY"
