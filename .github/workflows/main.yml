name: ShadowCypher CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  native-runtime:
    name: Qt6/C++ desktop and runtime
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Qt6 build dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-websockets-dev libssl-dev
    - name: Build desktop and native runtime
      run: |
        cmake -S shadowcypher-qt -B "$RUNNER_TEMP/shadowcypher-native" -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
        cmake --build "$RUNNER_TEMP/shadowcypher-native" --parallel 2
    - name: Test native runtime
      run: ctest --test-dir "$RUNNER_TEMP/shadowcypher-native" --output-on-failure

  workers-api:
    name: Workers API — typecheck & tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/api/package-lock.json

    - name: Install dependencies
      working-directory: backend/api
      run: npm ci

    - name: TypeScript typecheck
      working-directory: backend/api
      run: npm run typecheck

    - name: Run unit tests
      working-directory: backend/api
      run: npm test
