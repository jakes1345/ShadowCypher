name: ShadowCypher Enterprise CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-assurance:
    name: Enterprise QA Sweep
    runs-on: ubuntu-latest
    
    steps:
    - name: Payload Checkout
      uses: actions/checkout@v4

    - name: Initialize Apex Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov ruff mypy

    - name: Static Analysis (Ruff)
      run: ruff check .

    - name: Type Integrity Check (Mypy)
      run: mypy shadowcypher/ --ignore-missing-imports

    - name: Security Audit (Bandit)
      run: |
        pip install bandit
        bandit -r shadowcypher/ -ll

    - name: Execution Suite (Pytest)
      run: |
        pytest shadowcypher/tests/ --cov=shadowcypher --cov-report=xml

    - name: Upload Telemetry
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
