name: ShadowCypher Enterprise CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-assurance:
    name: Enterprise QA Sweep
    runs-on: ubuntu-latest

    steps:
    - name: Payload Checkout
      uses: actions/checkout@v4

    - name: Initialize Apex Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies (GTK3 Armory)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev gir1.2-gtk-3.0 python3-gi python3-gi-cairo libcairo2-dev pkg-config xvfb libgirepository1.0-dev build-essential gobject-introspection python3-cairo

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff mypy bandit types-requests

    - name: Import Sanity Check
      run: |
        xvfb-run --auto-servernum python -c "
        import shadowcypher
        from shadowcypher.core.config import config
        from shadowcypher.core.bus import bus
        from shadowcypher.core.logger import logger
        from shadowcypher.core.platform import platform_engine
        from shadowcypher.ai.engine import AIEngine
        from shadowcypher.ai.orchestrator import AIOrchestrator
        from shadowcypher.ai.providers import ProviderRegistry
        print('All core imports OK')
        "

    - name: Static Analysis (Ruff)
      run: ruff check shadowcypher/ --select=E,F --ignore=E402,E501,F401 --exit-zero

    - name: Type Check (Mypy) — Core only
      run: |
        mypy shadowcypher/core/config.py shadowcypher/core/bus.py shadowcypher/core/platform.py shadowcypher/core/logger.py --ignore-missing-imports --no-error-summary || true

    - name: Security Audit (Bandit) — High severity only
      run: bandit -r shadowcypher/ -ll --skip B101,B404,B603,B607,B608 --exit-zero

    - name: Module Load Test
      run: |
        xvfb-run --auto-servernum python -c "
        import importlib, sys
        modules = [
            'shadowcypher.modules.recon',
            'shadowcypher.modules.network',
            'shadowcypher.modules.credentials',
            'shadowcypher.modules.exploit',
            'shadowcypher.modules.forensics',
            'shadowcypher.modules.osint',
            'shadowcypher.modules.wireless',
            'shadowcypher.modules.firewall',
            'shadowcypher.modules.layer7',
            'shadowcypher.modules.phishing',
            'shadowcypher.modules.c2',
            'shadowcypher.modules.exfiltration',
            'shadowcypher.modules.privesc',
            'shadowcypher.modules.payload_factory',
        ]
        failed = []
        for mod in modules:
            try:
                importlib.import_module(mod)
            except Exception as e:
                failed.append(f'{mod}: {e}')
        if failed:
            print('FAILED IMPORTS:')
            for f in failed:
                print(f'  {f}')
            sys.exit(1)
        print(f'All {len(modules)} modules loaded OK')
        "
