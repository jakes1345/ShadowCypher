name: ShadowCypher Enterprise CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-assurance:
    name: Enterprise QA Sweep
    runs-on: ubuntu-latest
    
    steps:
    - name: Payload Checkout
      uses: actions/checkout@v4

    - name: Initialize Apex Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies (GTK3 Armory)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev gir1.2-gtk-3.0 python3-gi python3-gi-cairo libcairo2-dev pkg-config xvfb libgirepository1.0-dev build-essential gobject-introspection python3-gi python3-cairo

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov ruff mypy bandit

    - name: Static Analysis (Ruff)
      run: ruff check . || true # Allow warnings in synthesis engine

    - name: Type Integrity Check (Mypy)
      run: mypy shadowcypher/ --ignore-missing-imports

    - name: Security Audit (Bandit)
      run: |
        pip install bandit
        bandit -r shadowcypher/ -ll

    - name: Execution Suite (Pytest - Headless Armory)
      run: |
        xvfb-run --auto-servernum pytest shadowcypher/tests/ --cov=shadowcypher --cov-report=xml

    - name: Upload Telemetry
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
