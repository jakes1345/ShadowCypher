name: Upload Releases to CDN

on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get release artifacts from GitHub
        run: |
          # Get release ID from tag
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} --jq .id)
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV

          # List assets in the release
          echo "Release assets:"
          gh api repos/${{ github.repository }}/releases/${{ env.RELEASE_ID }}/assets --jq '.[] | .name'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifacts in release
        run: |
          RELEASE_ID=${{ env.RELEASE_ID }}
          assets=$(gh api repos/${{ github.repository }}/releases/${{ env.RELEASE_ID }}/assets --jq '.[] | .name')

          echo "Checking for required release files..."

          # Check for critical files
          if echo "$assets" | grep -q "shadowos.*\.iso$" && \
             echo "$assets" | grep -q "SHA256SUMS" && \
             echo "$assets" | grep -q "shadowos_release.pub"; then
            echo "✓ All required release files present"
          else
            echo "✗ Missing required release files"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: CDN sync ready
        run: |
          echo "✓ Release artifacts verified and ready for CDN sync"
          echo "Next: Configure CDN sync (S3, Backblaze B2, or similar)"
          echo "Artifacts are available in GitHub Release: ${{ github.server_url }}/${{ github.repository }}/releases/${{ github.ref_name }}"
