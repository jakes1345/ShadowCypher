name: Upload Releases to R2

on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Download release artifacts from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} --jq .id)
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV

          mkdir -p ./release-artifacts
          gh api repos/${{ github.repository }}/releases/$RELEASE_ID/assets \
            --jq '.[] | [.url, .name] | @tsv' | while IFS=$'\t' read asset_url asset_name; do
            echo "Downloading $asset_name..."
            gh api "$asset_url" \
              -H "Accept: application/octet-stream" \
              > "./release-artifacts/$asset_name"
          done

          echo "=== Downloaded ==="
          ls -lh ./release-artifacts/

      - name: Verify required artifacts
        run: |
          cd ./release-artifacts
          if ls shadowos-*.iso 1>/dev/null 2>&1 && [ -f SHA256SUMS ]; then
            echo "✓ Required files present"
          else
            echo "✗ Missing shadowos-*.iso or SHA256SUMS"
            ls -lh
            exit 1
          fi

      - name: Upload artifacts to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          BUCKET="shadowcypher-files"

          mime_for() {
            case "$1" in
              *.iso)    echo "application/x-iso9660-image" ;;
              *.apk)    echo "application/vnd.android.package-archive" ;;
              *.tar.gz) echo "application/gzip" ;;
              *.deb)    echo "application/vnd.debian.binary-package" ;;
              *.rpm)    echo "application/x-rpm" ;;
              *.asc)    echo "text/plain" ;;
              SHA256SUMS|*.txt) echo "text/plain" ;;
              *)        echo "application/octet-stream" ;;
            esac
          }

          for f in ./release-artifacts/*; do
            name=$(basename "$f")
            mime=$(mime_for "$name")
            echo "→ uploading $name ($mime)"

            # Upload under versioned path
            wrangler r2 object put "$BUCKET/releases/$VERSION/$name" \
              --file="$f" \
              --content-type="$mime"

            # Mirror to /latest/
            wrangler r2 object put "$BUCKET/releases/latest/$name" \
              --file="$f" \
              --content-type="$mime"
          done

      - name: Update release manifest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          BUCKET="shadowcypher-files"
          TAG="${VERSION#v}"

          # Find the ISO name for the manifest URL
          ISO_NAME=$(ls ./release-artifacts/shadowos-*.iso 2>/dev/null | head -1 | xargs basename || echo "")
          SHA256=$(grep "$ISO_NAME" ./release-artifacts/SHA256SUMS 2>/dev/null | awk '{print $1}' || echo "")

          cat > /tmp/manifest.json << EOF
          {
            "version": "$TAG",
            "iso_url": "https://releases.shadowcypher.site/$VERSION/$ISO_NAME",
            "sha256": "$SHA256",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          cat /tmp/manifest.json
          wrangler r2 object put "$BUCKET/releases/manifest.json" \
            --file=/tmp/manifest.json \
            --content-type="application/json"

          echo "✓ Manifest updated → releases.shadowcypher.site/manifest.json"

      - name: Summary
        run: |
          VERSION="${{ github.ref_name }}"
          echo "### ✓ Release uploaded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Index:** https://releases.shadowcypher.site/$VERSION/" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest:** https://releases.shadowcypher.site/latest/" >> $GITHUB_STEP_SUMMARY
          echo "- **Manifest:** https://releases.shadowcypher.site/manifest.json" >> $GITHUB_STEP_SUMMARY
