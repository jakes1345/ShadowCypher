name: Upload Releases to CDN

on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get release artifacts from GitHub
        run: |
          # Get release ID from tag
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} --jq .id)
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV

          # List assets in the release
          echo "Release assets:"
          gh api repos/${{ github.repository }}/releases/${{ env.RELEASE_ID }}/assets --jq '.[] | .name'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifacts in release
        run: |
          RELEASE_ID=${{ env.RELEASE_ID }}
          assets=$(gh api repos/${{ github.repository }}/releases/${{ env.RELEASE_ID }}/assets --jq '.[] | .name')

          echo "Checking for required release files..."

          # Check for critical files
          if echo "$assets" | grep -q "shadowos.*\.iso$" && \
             echo "$assets" | grep -q "SHA256SUMS" && \
             echo "$assets" | grep -q "shadowos_release.pub"; then
            echo "✓ All required release files present"
          else
            echo "✗ Missing required release files"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release artifacts
        run: |
          mkdir -p ./release-artifacts
          RELEASE_ID=${{ env.RELEASE_ID }}

          # Download all assets from the release
          gh api repos/${{ github.repository }}/releases/${{ env.RELEASE_ID }}/assets \
            --jq '.[] | .url' | while read asset_url; do
            gh api "$asset_url" > ./release-artifacts/$(basename "$asset_url")
          done

          echo "Downloaded artifacts:"
          ls -lh ./release-artifacts/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to releases.shadowcypher.site
        run: |
          VERSION=${{ github.ref_name }}
          RELEASE_DIR="releases/v${VERSION#v}"

          # Load SSH key into agent
          mkdir -p $HOME/.ssh
          eval $(ssh-agent -s)
          echo "${{ secrets.RELEASE_SERVER_SSH_KEY }}" | ssh-add -
          ssh-keyscan -H ${{ secrets.RELEASE_SERVER_HOST }} >> $HOME/.ssh/known_hosts 2>/dev/null

          # Upload artifacts via SCP
          scp -r ./release-artifacts/* \
            ${{ secrets.RELEASE_SERVER_USER }}@${{ secrets.RELEASE_SERVER_HOST }}:$RELEASE_DIR/

          echo "✓ Artifacts uploaded to releases.shadowcypher.site/v${VERSION#v}/"
        if: success()
