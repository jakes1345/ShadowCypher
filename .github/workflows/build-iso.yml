name: ShadowOS ISO Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # upload release assets

jobs:
  build-iso:
    name: Build ShadowOS ISO
    runs-on: ubuntu-latest
    timeout-minutes: 180   # archiso + ~175 packages takes ~60-90 min on cold cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /tmp/pacman-cache
          key: shadowos-pkgs-${{ hashFiles('shadowos/profile/packages.x86_64') }}
          restore-keys: shadowos-pkgs-

      - name: Prepare directories
        run: mkdir -p /tmp/pacman-cache /tmp/iso-out

      - name: Resolve build version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-$(date +%Y.%m.%d)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate ShadowOS configuration
        run: bash shadowos/validate.sh

      - name: Build ISO inside Arch Linux container
        run: |
          docker run --rm --privileged \
            --volume "${{ github.workspace }}:/build" \
            --volume "/tmp/pacman-cache:/var/cache/pacman/pkg" \
            --volume "/tmp/iso-out:/iso-out" \
            archlinux:latest \
            bash -ex -c '
              pacman-key --init
              pacman-key --populate archlinux

              # Refresh DB and install build deps
              pacman -Sy --noconfirm --needed archiso git rsync

              # Run the ShadowOS build script
              cd /build/shadowos
              bash build.sh

              # Export ISO to shared output directory
              cp out/*.iso /iso-out/
            '

      - name: Generate checksums
        run: |
          cd /tmp/iso-out
          sha256sum *.iso > SHA256SUMS
          echo "=== Build output ==="
          ls -lh
          cat SHA256SUMS

      - name: Sign ISO (optional — skipped if secret not set)
        env:
          SHADOWOS_SIGNING_KEY: ${{ secrets.SHADOWOS_SIGNING_KEY }}
          SHADOWOS_SIGNING_KEY_ID: ${{ secrets.SHADOWOS_SIGNING_KEY_ID }}
        run: |
          [[ -z "$SHADOWOS_SIGNING_KEY" ]] && { echo "No signing key — skipping GPG sign"; exit 0; }
          echo "$SHADOWOS_SIGNING_KEY" | gpg --batch --import
          cd /tmp/iso-out
          for iso in *.iso; do
            gpg --batch --yes --armor --detach-sign \
              --local-user "$SHADOWOS_SIGNING_KEY_ID" "$iso"
          done
          gpg --batch --yes --armor --detach-sign \
            --local-user "$SHADOWOS_SIGNING_KEY_ID" SHA256SUMS
          ls -lh *.asc

      - name: Rename ISO to include version
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          cd /tmp/iso-out
          for f in shadowos-*.iso; do
            mv "$f" "${f%.iso}-${TAG}.iso"
          done
          sha256sum *.iso > SHA256SUMS
          ls -lh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowos-${{ steps.version.outputs.tag }}
          path: |
            /tmp/iso-out/*.iso
            /tmp/iso-out/*.asc
            /tmp/iso-out/SHA256SUMS
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          for f in /tmp/iso-out/*.iso /tmp/iso-out/*.asc /tmp/iso-out/SHA256SUMS; do
            [[ -f "$f" ]] || continue
            echo "Uploading $(basename "$f") → release $TAG"
            gh release upload "$TAG" "$f" --clobber
          done
          echo "✓ Assets attached to release $TAG"
