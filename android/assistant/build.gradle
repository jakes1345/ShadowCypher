apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Vosk offline STT model repository
repositories {
    maven { url 'https://alphacephei.com/maven/' }
    mavenCentral()
}

android {
    namespace = "site.shadowcypher.assistant"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "site.shadowcypher.assistant"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.4"
    }

    signingConfigs {
        release {
            storeFile file("../shadowcypher.keystore")
            storePassword System.getenv("KEYSTORE_PASS")
            keyAlias "shadowcypher"
            keyPassword System.getenv("KEY_PASS")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    kotlinOptions { jvmTarget = "21" }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"

    // Coroutines (wake word + Vosk async)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Vosk offline STT — model downloaded on first use (~40 MB)
    implementation "com.alphacephei:vosk-android:0.3.47"

    // ONNX Runtime — wake word inference
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.19.2"
}
