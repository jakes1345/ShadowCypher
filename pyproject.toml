[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowcypher"
version = "2.2.0"
description = "Enterprise Offensive Security & Autonomous Intelligence Suite"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ShadowCypher Team"}
]
keywords = ["security", "pentesting", "red-team", "offensive-security", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "PyGObject>=3.42.0,<3.50.0",
    "pycairo>=1.20.0",
    "psutil>=5.8.0",
    "requests>=2.31.0",
    "python-dotenv>=0.19.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "beautifulsoup4>=4.12.0",
    "cryptography>=41.0.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
# Premium/full install with all optional backends
full = [
    "litellm>=1.0.0",
    "huggingface-hub<1.0",
    "llama-cpp-python>=0.2.0",
    "paramiko>=3.0.0",
    "impacket>=0.11.0",
    "scapy>=2.5.0",
    "mitmproxy>=10.0.0",
]
# AI orchestration only
ai = [
    "litellm>=1.0.0",
    "huggingface-hub<1.0",
    "llama-cpp-python>=0.2.0",
]
# Development and testing
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "types-requests>=2.31.0",
]

[project.scripts]
shadowcypher = "shadowcypher.app:main"

[project.urls]
Homepage = "https://github.com/jakes1345/ShadowCypher"
Repository = "https://github.com/jakes1345/ShadowCypher"
Issues = "https://github.com/jakes1345/ShadowCypher/issues"

[tool.setuptools.packages.find]
include = ["shadowcypher*"]
exclude = ["ai_engine*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "S", "B"]
ignore = [
    # Subprocess / exec — intentional throughout this security tool
    "S603", "S607",
    # GTK pattern: gi.require_version() must precede gi.repository imports
    "E402",
    # Cosmetic style — pre-existing across the codebase, not our concern
    "E501",  # line-too-long
    "E701",  # multiple-statements-on-one-line-colon
    "E702",  # multiple-statements-on-one-line-semicolon
    "E731",  # lambda-assignment
    "W191",  # tab-indentation (pre-existing in UI files)
    # Security rules that are intentional for an offensive/network security tool
    "S104",  # hardcoded-bind-all-interfaces: servers/listeners need 0.0.0.0
    "S108",  # hardcoded-temp-file: /tmp usage is intentional in scan modules
    "S110",  # try-except-pass: intentional resilience in plugin/driver code
    "S112",  # try-except-continue: intentional resilience
    "S103",  # bad-file-permissions: intentional for key/cert files
    "S105",  # hardcoded-password-string: test fixtures and config defaults
    "S311",  # non-cryptographic random: intentional for network ops, not crypto
    "S310",  # url-open: intentional — this is a network security tool
    "S321",  # ftp-lib: intentional for network protocol support
    "S324",  # hashlib-insecure-hash: MD5/SHA1 used for fingerprinting, not auth
    "S501",  # request-with-no-cert-validation: intentional in pentest contexts
    "S507",  # ssh-no-host-key-verification: intentional for target scanning
    "S113",  # request-without-timeout: intentional for long-running scan sessions
    # Bugbear rules that are intentional patterns in this codebase
    "B008",  # function-call-in-default-argument: FastAPI Depends() / intentional
    "B023",  # function-uses-loop-variable: intentional callback captures
    # Additional security-tool rules
    "S101",  # assert: used for runtime invariant checks in operational code
    "S106",  # hardcoded-password-func-arg: config defaults and test fixtures
    "S307",  # suspicious-eval-usage: intentional in payload/script execution
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "S104", "S108"]  # assert/0.0.0.0/tmp are normal in test data
