[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowcypher"
version = "3.0.0-APEX"
description = "Apex Predator Security Suite — High-Performance Autonomous Offensive Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.42.0",
    "pycairo>=1.20.0",
    "psutil>=5.8.0",
    "requests>=2.26.0",
    "python-dotenv>=0.19.0",
    "aiohttp>=3.8.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "beautifulsoup4>=4.10.0",
    "ollama>=0.1.0",
    "cryptography>=41.0.0",
    "impacket>=0.10.0",
    "scapy>=2.5.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
ai_heavy = [
    "llama-cpp-python>=0.3.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
]

[project.scripts]
shadowcypher = "shadowcypher.app:main"

[tool.setuptools.packages.find]
include = ["shadowcypher*"]
