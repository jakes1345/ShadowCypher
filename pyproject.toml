[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowcypher"
version = "2.0.0"
description = "Offensive Security Operations Platform — Native GTK Desktop Application"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jack"},
]
keywords = [
    "security", "pentest", "offensive", "nmap", "hydra",
    "hashcat", "aircrack", "forensics", "firewall", "osint",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "PyGObject>=3.42.0",
    "pycairo>=1.20.0",
]

[project.optional-dependencies]
ai = [
    "llama-cpp-python>=0.3.0",
    "huggingface-hub>=0.20.0",
]

[project.scripts]
shadowcypher = "shadowcypher.app:main"

[project.urls]
Repository = "https://github.com/jack/ShadowCypher"

[tool.setuptools.packages.find]
include = ["shadowcypher*"]
