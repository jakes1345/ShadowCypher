[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowcypher"
version = "4.1.0"
description = "Enterprise Offensive Security & Autonomous Intelligence Suite"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ShadowCypher Team"}
]
keywords = ["security", "pentesting", "red-team", "offensive-security", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "PyGObject>=3.42.0,<3.50.0",
    "pycairo>=1.20.0",
    "psutil>=5.8.0",
    "requests>=2.31.0",
    "python-dotenv>=0.19.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "beautifulsoup4>=4.12.0",
    "cryptography>=41.0.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "litellm>=1.0.0",
    "huggingface-hub<1.0",
    "paramiko>=3.0.0",
    "scapy>=2.5.0",
    "mitmproxy>=10.0.0",
]

[project.optional-dependencies]
# Premium/full install with all optional backends
full = [
    "litellm>=1.0.0",
    "huggingface-hub<1.0",
    "llama-cpp-python>=0.2.0",
    "paramiko>=3.0.0",
    "impacket>=0.11.0",
    "scapy>=2.5.0",
    "mitmproxy>=10.0.0",
]
# AI orchestration only
ai = [
    "litellm>=1.0.0",
    "huggingface-hub<1.0",
    "llama-cpp-python>=0.2.0",
]
# Development and testing
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "types-requests>=2.31.0",
]

[project.scripts]
shadowcypher = "shadowcypher.app:main"

[project.urls]
Homepage = "https://github.com/jakes1345/ShadowCypher"
Repository = "https://github.com/jakes1345/ShadowCypher"
Issues = "https://github.com/jakes1345/ShadowCypher/issues"

[tool.setuptools.packages.find]
include = ["shadowcypher*"]
exclude = ["ai_engine*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "S", "B"]
ignore = ["S603", "S607"]  # subprocess calls are intentional in a security tool
