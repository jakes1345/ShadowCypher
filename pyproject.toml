[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowcypher"
version = "3.0.0"
description = "Enterprise Offensive Security & Autonomous Intelligence Suite"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ShadowCypher Team"}
]
keywords = ["security", "pentesting", "red-team", "offensive-security", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "PyGObject>=3.42.0,<3.50.0",
    "pycairo>=1.20.0",
    "psutil>=5.8.0",
    "requests>=2.31.0",
    "python-dotenv>=0.19.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "beautifulsoup4>=4.12.0",
    "cryptography>=41.0.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
# Premium/full install with all optional backends
full = [
    "litellm>=1.0.0",
    "huggingface-hub<1.0",
    "llama-cpp-python>=0.2.0",
    "paramiko>=3.0.0",
    "impacket>=0.11.0",
    "scapy>=2.5.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]
# AI orchestration only
ai = [
    "litellm>=1.0.0",
    "huggingface-hub<1.0",
    "llama-cpp-python>=0.2.0",
]
# Development and testing
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "types-requests>=2.31.0",
]

[project.scripts]
shadowcypher = "shadowcypher.app:main"

[project.urls]
Homepage = "https://github.com/jakes1345/ShadowCypher"
Repository = "https://github.com/jakes1345/ShadowCypher"
Issues = "https://github.com/jakes1345/ShadowCypher/issues"

[tool.setuptools.packages.find]
include = ["shadowcypher*"]
exclude = ["ai_engine*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "S", "B"]
ignore = [
    # Subprocess / URL / degradation — intentional in a security tool
    "S603", "S607",  # subprocess with user-controlled args
    "S310",          # urllib.request.urlopen — all calls target https:// external APIs
    "S110",          # try-except-pass — MCP helpers degrade gracefully by design
    "S112",          # try-except-continue — same rationale as S110
    # Import ordering
    "E402",          # gi.require_version must precede gi.repository imports
    # Style — not enforced (matches prior CI behaviour)
    "E501",          # line too long
    "W191",          # tabs in indentation (legacy files)
    "W291",          # trailing whitespace
    "W293",          # whitespace on blank lines
    # FastAPI pattern — Depends() in function-default IS the intended usage
    "B008",
    # Closures over non-loop locals flagged as loop-var closures (false positive)
    "B023",
    # zip() without strict= — not worth the noise in this codebase
    "B905",
    # Pseudo-random — used for AI model simulation/evolution, not crypto
    "S311",
    # Temporary files — /tmp is intentional for a desktop security tool
    "S108",
    # Binding all interfaces — intentional for local server / self-host mode
    "S104",
    # MD5 / SHA1 — used for non-cryptographic caching and deduplication
    "S324",
    # Assert — used in internal guards and test helpers
    "S101",
    # chmod 755 — intentional for tool scripts
    "S103",
    # token_type / variable names that look like passwords but aren't
    "S105", "S106",
    # requests verify=False — intentional for a security research tool
    "S501",
    # FTP / auto-trust host keys / missing timeout — intentional in pentest modules
    "S321", "S507", "S113",
]
