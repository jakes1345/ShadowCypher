<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 720">
  <!-- GHOST VERSUS - two ghosts facing off, VS in the middle, energy collision -->
  <defs>
    <linearGradient id="cyaGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="purpGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ff3060"/>
    </linearGradient>
    <linearGradient id="vsGrad10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="eg10" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="zg10" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vsBoom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="aura10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Collision energy in center -->
  <ellipse cx="410" cy="340" rx="80" ry="120" fill="#ffffff" opacity="0.08" filter="url(#aura10)"/>
  <ellipse cx="410" cy="340" rx="50" ry="80" fill="#00d4ff" opacity="0.1" filter="url(#aura10)"/>

  <!-- LEFT GHOST - cyan team, facing RIGHT (mirrored) -->
  <g transform="translate(20, 55) scale(0.72)">
    <!-- Body facing right: flip via transform -->
    <g transform="scale(-1,1) translate(-470, 0)">
      <path d="M 300,62 C 388,60 458,118 466,196 C 474,268 458,316 438,338 C 466,352 488,388 488,428 C 488,482 472,530 455,572 C 440,612 422,638 418,666 C 414,688 404,706 384,714 C 368,722 350,726 336,720 C 326,730 312,736 300,736 C 288,736 274,730 264,720 C 250,726 232,722 216,714 C 196,706 186,688 182,666 C 178,638 160,612 145,572 C 128,530 112,482 112,428 C 112,388 134,352 162,338 C 142,316 126,268 134,196 C 142,118 212,60 300,62 Z"
            fill="#0a0a1e"/>
      <path d="M 300,62 C 388,60 458,118 466,196 C 474,268 458,316 438,338 C 466,352 488,388 488,428 C 488,482 472,530 455,572 C 440,612 422,638 418,666 C 414,688 404,706 384,714 C 368,722 350,726 336,720 C 326,730 312,736 300,736 C 288,736 274,730 264,720 C 250,726 232,722 216,714 C 196,706 186,688 182,666 C 178,638 160,612 145,572 C 128,530 112,482 112,428 C 112,388 134,352 162,338 C 142,316 126,268 134,196 C 142,118 212,60 300,62 Z"
            fill="none" stroke="url(#cyaGrad10)" stroke-width="3.5" filter="url(#eg10)"/>
      <path d="M 218,132 C 206,132 186,150 184,184 C 182,226 196,278 220,296 L 380,296 C 404,278 418,226 416,184 C 414,150 394,132 382,132 Z"
            fill="#040408"/>
      <!-- AGGRESSIVE eyes (angled inward = determined face) -->
      <path d="M 198,228 L 296,216 L 298,248 L 198,260 Z" fill="#00d4ff" filter="url(#eg10)"/>
      <path d="M 204,234 L 292,224 L 293,242 L 204,252 Z" fill="white" opacity="0.6"/>
      <path d="M 302,216 L 400,228 L 400,260 L 302,248 Z" fill="#00d4ff" filter="url(#eg10)"/>
      <path d="M 307,224 L 396,234 L 396,252 L 307,242 Z" fill="white" opacity="0.6"/>
      <!-- Angry brow lines -->
      <path d="M 192,210 L 224,196" fill="none" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" filter="url(#zg10)"/>
      <path d="M 376,196 L 408,210" fill="none" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" filter="url(#zg10)"/>
      <!-- Feet -->
      <ellipse cx="242" cy="718" rx="52" ry="24" fill="#0c0c1e" stroke="#00d4ff" stroke-width="2.5"/>
      <ellipse cx="358" cy="718" rx="52" ry="24" fill="#0c0c1e" stroke="#00d4ff" stroke-width="2.5"/>
      <!-- Arms - forward arm reaching toward center -->
      <ellipse cx="494" cy="420" rx="36" ry="56" fill="#0c0c1e" stroke="#00d4ff" stroke-width="2.5" transform="rotate(20,494,420)"/>
      <ellipse cx="106" cy="420" rx="36" ry="56" fill="#0c0c1e" stroke="#00d4ff" stroke-width="2.5" transform="rotate(-15,106,420)"/>
    </g>
    <!-- ZAP from left ghost toward center -->
    <path d="M 420,340 L 460,370 L 440,370 L 480,408" fill="none" stroke="#00d4ff" stroke-width="5" stroke-linecap="round" filter="url(#eg10)"/>
  </g>

  <!-- RIGHT GHOST - purple/red team, facing LEFT (default) -->
  <g transform="translate(350, 55) scale(0.72)">
    <path d="M 300,62 C 388,60 458,118 466,196 C 474,268 458,316 438,338 C 466,352 488,388 488,428 C 488,482 472,530 455,572 C 440,612 422,638 418,666 C 414,688 404,706 384,714 C 368,722 350,726 336,720 C 326,730 312,736 300,736 C 288,736 274,730 264,720 C 250,726 232,722 216,714 C 196,706 186,688 182,666 C 178,638 160,612 145,572 C 128,530 112,482 112,428 C 112,388 134,352 162,338 C 142,316 126,268 134,196 C 142,118 212,60 300,62 Z"
          fill="#100818"/>
    <path d="M 300,62 C 388,60 458,118 466,196 C 474,268 458,316 438,338 C 466,352 488,388 488,428 C 488,482 472,530 455,572 C 440,612 422,638 418,666 C 414,688 404,706 384,714 C 368,722 350,726 336,720 C 326,730 312,736 300,736 C 288,736 274,730 264,720 C 250,726 232,722 216,714 C 196,706 186,688 182,666 C 178,638 160,612 145,572 C 128,530 112,482 112,428 C 112,388 134,352 162,338 C 142,316 126,268 134,196 C 142,118 212,60 300,62 Z"
          fill="none" stroke="url(#purpGrad10)" stroke-width="3.5" filter="url(#eg10)"/>
    <path d="M 218,132 C 206,132 186,150 184,184 C 182,226 196,278 220,296 L 380,296 C 404,278 418,226 416,184 C 414,150 394,132 382,132 Z"
          fill="#060210"/>
    <!-- RAGE eyes purple/red -->
    <path d="M 198,228 L 296,216 L 298,248 L 198,260 Z" fill="#ff3060" filter="url(#eg10)"/>
    <path d="M 204,234 L 292,224 L 293,242 L 204,252 Z" fill="white" opacity="0.6"/>
    <path d="M 302,216 L 400,228 L 400,260 L 302,248 Z" fill="#ff3060" filter="url(#eg10)"/>
    <path d="M 307,224 L 396,234 L 396,252 L 307,242 Z" fill="white" opacity="0.6"/>
    <!-- Angry brows -->
    <path d="M 192,210 L 224,196" fill="none" stroke="#ff3060" stroke-width="3" stroke-linecap="round" filter="url(#zg10)"/>
    <path d="M 376,196 L 408,210" fill="none" stroke="#ff3060" stroke-width="3" stroke-linecap="round" filter="url(#zg10)"/>
    <!-- Feet -->
    <ellipse cx="242" cy="718" rx="52" ry="24" fill="#10081e" stroke="#a855f7" stroke-width="2.5"/>
    <ellipse cx="358" cy="718" rx="52" ry="24" fill="#10081e" stroke="#a855f7" stroke-width="2.5"/>
    <!-- Arms -->
    <ellipse cx="494" cy="420" rx="36" ry="56" fill="#10081e" stroke="#a855f7" stroke-width="2.5" transform="rotate(15,494,420)"/>
    <ellipse cx="106" cy="420" rx="36" ry="56" fill="#10081e" stroke="#a855f7" stroke-width="2.5" transform="rotate(-20,106,420)"/>
    <!-- ZAP from right ghost toward center -->
    <path d="M 60,340 L 22,370 L 42,370 L 0,408" fill="none" stroke="#a855f7" stroke-width="5" stroke-linecap="round" filter="url(#eg10)"/>
  </g>

  <!-- CENTER COLLISION SPARKS -->
  <circle cx="408" cy="280" r="6" fill="#ffffff" filter="url(#vsBoom)" opacity="0.9"/>
  <circle cx="396" cy="316" r="4" fill="#00d4ff" filter="url(#vsBoom)" opacity="0.8"/>
  <circle cx="420" cy="308" r="4" fill="#ff3060" filter="url(#vsBoom)" opacity="0.8"/>
  <circle cx="404" cy="350" r="5" fill="#ffffff" filter="url(#vsBoom)" opacity="0.7"/>
  <circle cx="414" cy="386" r="3" fill="#a855f7" filter="url(#vsBoom)" opacity="0.7"/>
  <!-- Spark lines -->
  <path d="M 385,298 L 365,278" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" filter="url(#zg10)" opacity="0.8"/>
  <path d="M 432,302 L 454,280" fill="none" stroke="#ff3060" stroke-width="2.5" stroke-linecap="round" filter="url(#zg10)" opacity="0.8"/>
  <path d="M 388,354 L 368,375" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" filter="url(#zg10)" opacity="0.7"/>
  <path d="M 430,358 L 452,377" fill="none" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" filter="url(#zg10)" opacity="0.7"/>

  <!-- VS TEXT - dead center, big and bold -->
  <text x="410" y="352" text-anchor="middle" font-family="Impact, monospace" font-size="72" font-weight="900"
        fill="white" filter="url(#vsBoom)" opacity="0.9" letter-spacing="-2">VS</text>
  <text x="410" y="352" text-anchor="middle" font-family="Impact, monospace" font-size="72" font-weight="900"
        fill="url(#vsGrad10)" letter-spacing="-2">VS</text>

  <!-- WORDMARK -->
  <text x="410" y="680" text-anchor="middle" font-family="monospace" font-size="44" font-weight="bold"
        fill="white" letter-spacing="3">SHADOWCYPHER</text>
  <text x="410" y="714" text-anchor="middle" font-family="monospace" font-size="12"
        fill="url(#cyaGrad10)" letter-spacing="7" opacity="0.65">GHOST VERSUS</text>
</svg>
