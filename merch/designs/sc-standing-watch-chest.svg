<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <filter id="cityGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08081a"/>
      <stop offset="100%" stop-color="#0d0d2e"/>
    </linearGradient>
    <linearGradient id="cityGlow2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="url(#skyGrad)"/>

  <!-- City glow haze from below — atmospheric -->
  <ellipse cx="400" cy="560" rx="380" ry="80" fill="url(#cityGlow2)"/>

  <!-- ── CITY SKYLINE (simplified flat silhouette) ── -->
  <g fill="#0f0f2a">
    <!-- Far background buildings (shorter, lighter) -->
    <rect x="0"   y="490" width="45"  height="100"/>
    <rect x="50"  y="470" width="35"  height="120"/>
    <rect x="90"  y="500" width="30"  height="90"/>
    <rect x="125" y="455" width="40"  height="135"/>
    <rect x="170" y="480" width="28"  height="110"/>
    <rect x="200" y="440" width="50"  height="150"/>
    <rect x="255" y="475" width="32"  height="115"/>
    <rect x="290" y="460" width="38"  height="130"/>
    <rect x="330" y="490" width="25"  height="100"/>
    <!-- Gap at center (figure stands here) -->
    <rect x="445" y="490" width="25"  height="100"/>
    <rect x="475" y="462" width="38"  height="128"/>
    <rect x="518" y="475" width="32"  height="115"/>
    <rect x="555" y="440" width="50"  height="150"/>
    <rect x="610" y="480" width="28"  height="110"/>
    <rect x="643" y="455" width="40"  height="135"/>
    <rect x="688" y="500" width="30"  height="90"/>
    <rect x="722" y="470" width="35"  height="120"/>
    <rect x="762" y="490" width="38"  height="100"/>
  </g>

  <!-- Building windows — tiny cyan lights -->
  <g fill="#00d4ff" opacity="0.5" filter="url(#cityGlow)">
    <rect x="56"  y="478" width="4" height="3"/><rect x="64"  y="478" width="4" height="3"/>
    <rect x="56"  y="487" width="4" height="3"/><rect x="64"  y="487" width="4" height="3"/>
    <rect x="131" y="462" width="4" height="3"/><rect x="139" y="462" width="4" height="3"/>
    <rect x="131" y="472" width="4" height="3"/><rect x="147" y="472" width="4" height="3"/>
    <rect x="208" y="448" width="4" height="3"/><rect x="218" y="448" width="4" height="3"/>
    <rect x="228" y="448" width="4" height="3"/><rect x="208" y="458" width="4" height="3"/>
    <rect x="298" y="468" width="4" height="3"/><rect x="306" y="468" width="4" height="3"/>
    <rect x="563" y="448" width="4" height="3"/><rect x="573" y="448" width="4" height="3"/>
    <rect x="583" y="448" width="4" height="3"/><rect x="563" y="458" width="4" height="3"/>
    <rect x="651" y="462" width="4" height="3"/><rect x="659" y="462" width="4" height="3"/>
    <rect x="729" y="477" width="4" height="3"/><rect x="737" y="477" width="4" height="3"/>
  </g>

  <!-- Antenna lights — red blinks -->
  <circle cx="222" cy="438" r="3" fill="#ff3366" opacity="0.8"/>
  <circle cx="578" cy="438" r="3" fill="#ff3366" opacity="0.8"/>
  <circle cx="400" cy="380" r="3" fill="#ff3366" opacity="0.6"/>

  <!-- Rooftop edge line -->
  <rect x="80" y="488" width="270" height="4" fill="#1a1a3a"/>
  <rect x="450" y="488" width="270" height="4" fill="#1a1a3a"/>

  <!-- ── FIGURE: hooded silhouette from behind, standing at rooftop edge ── -->
  <!-- Body/torso — dark, slightly lit from below by city -->
  <path d="
    M 370 488
    C 370 488, 355 380, 358 320
    C 360 285, 375 270, 400 268
    C 425 270, 440 285, 442 320
    C 445 380, 430 488, 430 488
    Z
  " fill="#1a0a2e"/>

  <!-- Hoodie fabric highlight — left shoulder lit by city cyan -->
  <path d="
    M 358 320 C 348 360, 348 420, 355 460 L 370 465 C 362 425, 360 370, 368 330 Z
  " fill="#2a1040" opacity="0.8"/>

  <!-- Hood — large, peaked, from behind -->
  <path d="
    M 400 200
    C 375 200, 340 220, 330 255
    C 320 285, 325 310, 340 325
    C 360 315, 385 308, 400 308
    C 415 308, 440 315, 460 325
    C 475 310, 480 285, 470 255
    C 460 220, 425 200, 400 200
    Z
  " fill="#4c1d95"/>

  <!-- Hood top peak -->
  <path d="M 400 188 C 390 200, 410 200, 400 188 Z" fill="#5b21b6"/>

  <!-- Hood fabric folds — dark lines -->
  <path d="M 400 200 L 395 290" stroke="#2d1060" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 400 200 L 410 295" stroke="#2d1060" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Left arm hanging -->
  <path d="M 365 330 C 355 370, 348 420, 350 460 L 360 462 C 360 425, 366 375, 374 335 Z"
    fill="#3b0f7a"/>
  <!-- Right arm -->
  <path d="M 435 330 C 445 370, 452 420, 450 460 L 440 462 C 440 425, 434 375, 426 335 Z"
    fill="#3b0f7a"/>

  <!-- City glow catching bottom of hoodie -->
  <ellipse cx="400" cy="480" rx="45" ry="8" fill="#00d4ff" opacity="0.08"/>

  <!-- Stars above figure -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="160" cy="80"  r="1.5"/><circle cx="240" cy="55"  r="1"/>
    <circle cx="320" cy="100" r="1"/  ><circle cx="190" cy="130" r="1.5"/>
    <circle cx="580" cy="70"  r="1.5"/><circle cx="640" cy="100" r="1"/>
    <circle cx="520" cy="130" r="1"/  ><circle cx="700" cy="55"  r="1.5"/>
    <circle cx="100" cy="160" r="1"/> <circle cx="760" cy="140" r="1"/>
  </g>

  <!-- Moon -->
  <circle cx="680" cy="120" r="28" fill="#e8e8f0" opacity="0.15"/>
  <circle cx="692" cy="114" r="24" fill="#08081a"/><!-- crescent mask -->

  <!-- ── TEXT ── -->
  <text x="400" y="680" text-anchor="middle"
    font-family="'Arial Black', Impact, sans-serif"
    font-size="58" font-weight="900" letter-spacing="4" fill="#00d4ff">
    HE NEVER SLEEPS
  </text>
  <text x="400" y="730" text-anchor="middle"
    font-family="'Arial Black', Impact, sans-serif"
    font-size="34" font-weight="900" letter-spacing="10" fill="#a855f7">
    SO YOU CAN
  </text>

  <line x1="120" y1="755" x2="680" y2="755" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <text x="400" y="800" text-anchor="middle"
    font-family="'Arial Black', sans-serif" font-size="16" letter-spacing="8"
    fill="#00d4ff" opacity="0.5">SHADOWCYPHER</text>
  <text x="400" y="825" text-anchor="middle"
    font-family="'Courier New', monospace" font-size="10" letter-spacing="3"
    fill="#a855f7" opacity="0.4">CHAPTER 03 · STANDING WATCH</text>
</svg>
