<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700">
  <!-- GHOST FACE - just the bust/head, super close up, intense. For adult streetwear. -->
  <defs>
    <linearGradient id="bg6" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#12122a"/>
      <stop offset="100%" stop-color="#06060e"/>
    </linearGradient>
    <linearGradient id="gg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="eg6" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigAura" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="zg6" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Massive aura glow (the whole frame glows) -->
  <ellipse cx="300" cy="300" rx="280" ry="280" fill="#00d4ff" opacity="0.04" filter="url(#bigAura)"/>
  <ellipse cx="300" cy="300" rx="260" ry="260" fill="#a855f7" opacity="0.05" filter="url(#bigAura)"/>

  <!-- MASSIVE HEAD CLOSEUP -->
  <!-- Outer hood silhouette - fills most of canvas -->
  <path d="
    M 300,35
    C 420,33 510,105 518,200
    C 526,285 505,345 480,372
    C 514,390 540,430 540,475
    C 540,530 516,564 490,580
    L 490,655
    L 110,655
    L 110,580
    C 84,564 60,530 60,475
    C 60,430 86,390 120,372
    C 95,345 74,285 82,200
    C 90,105 180,33 300,35 Z"
    fill="url(#bg6)"/>

  <!-- Glow outline -->
  <path d="
    M 300,35
    C 420,33 510,105 518,200
    C 526,285 505,345 480,372
    C 514,390 540,430 540,475
    C 540,530 516,564 490,580
    L 490,655
    L 110,655
    L 110,580
    C 84,564 60,530 60,475
    C 60,430 86,390 120,372
    C 95,345 74,285 82,200
    C 90,105 180,33 300,35 Z"
    fill="none" stroke="url(#gg6)" stroke-width="3.5" filter="url(#eg6)" opacity="0.85"/>

  <!-- Hood interior dome shadow -->
  <ellipse cx="300" cy="240" rx="188" ry="188" fill="#0a0a1c" opacity="0.7"/>

  <!-- Hood point at top -->
  <path d="M 260,35 C 274,8 326,8 340,35 L 326,62 C 316,50 284,50 274,62 Z"
        fill="#14142e" stroke="url(#gg6)" stroke-width="2.5"/>

  <!-- Face void - huge, filling the head -->
  <path d="M 168,120 C 150,120 128,148 126,200 C 122,265 142,345 175,378 L 425,378 C 458,345 478,265 474,200 C 472,148 450,120 432,120 Z"
        fill="#040408"/>

  <!-- Mask / visor line crossing the face -->
  <path d="M 130,288 L 168,268 L 300,260 L 432,268 L 470,288"
        fill="none" stroke="#a855f7" stroke-width="3" opacity="0.5"/>
  <path d="M 130,288 L 168,268 L 300,260 L 432,268 L 470,288"
        fill="none" stroke="#a855f7" stroke-width="10" opacity="0.1" filter="url(#zg6)"/>

  <!-- EYES - HUGE, dominating the face -->
  <!-- Left eye -->
  <rect x="148" y="296" width="130" height="44" rx="8" fill="#00d4ff" filter="url(#eg6)"/>
  <rect x="158" y="304" width="110" height="20" rx="5" fill="white" opacity="0.6"/>
  <!-- Left eye inner glow detail -->
  <rect x="156" y="298" width="114" height="10" rx="4" fill="white" opacity="0.15"/>

  <!-- Right eye -->
  <rect x="322" y="296" width="130" height="44" rx="8" fill="#00d4ff" filter="url(#eg6)"/>
  <rect x="332" y="304" width="110" height="20" rx="5" fill="white" opacity="0.6"/>
  <rect x="330" y="298" width="114" height="10" rx="4" fill="white" opacity="0.15"/>

  <!-- Nose bridge line -->
  <line x1="300" y1="345" x2="300" y2="375" stroke="#a855f7" stroke-width="2" opacity="0.35" stroke-dasharray="3 3"/>

  <!-- Shoulder/cloak area at bottom of bust -->
  <path d="M 110,580 C 80,580 55,600 45,630 L 45,655 L 555,655 L 555,630 C 545,600 520,580 490,580"
        fill="#0e0e22" stroke="url(#gg6)" stroke-width="2.5"/>

  <!-- Chest SC mark on cloak -->
  <circle cx="300" cy="628" r="22" fill="none" stroke="url(#gg6)" stroke-width="2" opacity="0.5"/>
  <text x="300" y="636" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold"
        fill="url(#gg6)" opacity="0.6">SC</text>

  <!-- ZAP on sides of face -->
  <path d="M 32,230 L 52,260 L 38,260 L 62,300" fill="none" stroke="#00d4ff" stroke-width="5" stroke-linecap="round" filter="url(#eg6)"/>
  <path d="M 22,290 L 44,322 L 28,322 L 52,360" fill="none" stroke="#00d4ff" stroke-width="4" stroke-linecap="round" filter="url(#zg6)" opacity="0.8"/>
  <path d="M 568,230 L 548,260 L 562,260 L 538,300" fill="none" stroke="#a855f7" stroke-width="5" stroke-linecap="round" filter="url(#eg6)"/>
  <path d="M 578,290 L 556,322 L 572,322 L 548,360" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" filter="url(#zg6)" opacity="0.8"/>

  <!-- Floating energy particles -->
  <circle cx="44" cy="200" r="5" fill="#00d4ff" opacity="0.6" filter="url(#zg6)"/>
  <circle cx="556" cy="200" r="5" fill="#a855f7" opacity="0.6" filter="url(#zg6)"/>
  <circle cx="28" cy="175" r="3" fill="#00ff41" opacity="0.5"/>
  <circle cx="572" cy="175" r="3" fill="#00ff41" opacity="0.5"/>
</svg>
