<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 750">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- "GUARDIAN" header -->
  <text x="350" y="60" text-anchor="middle" font-family="monospace" font-size="18"
        fill="#00d4ff" letter-spacing="12" font-weight="bold">GUARDIAN</text>
  <line x1="120" y1="72" x2="280" y2="72" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <line x1="420" y1="72" x2="580" y2="72" stroke="#a855f7" stroke-width="1" opacity="0.5"/>

  <!-- Outer hex ring - double stroke -->
  <polygon points="350,100 560,215 560,445 350,560 140,445 140,215"
           fill="none" stroke="#a855f7" stroke-width="5" opacity="0.6" filter="url(#glow2)"/>
  <polygon points="350,115 545,225 545,435 350,545 155,435 155,225"
           fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.9"/>

  <!-- Hex corner nodes -->
  <circle cx="350" cy="100" r="6" fill="#00d4ff" filter="url(#glow2)"/>
  <circle cx="560" cy="215" r="6" fill="#a855f7" filter="url(#glow2)"/>
  <circle cx="560" cy="445" r="6" fill="#a855f7" filter="url(#glow2)"/>
  <circle cx="350" cy="560" r="6" fill="#00d4ff" filter="url(#glow2)"/>
  <circle cx="140" cy="445" r="6" fill="#00d4ff" filter="url(#glow2)"/>
  <circle cx="140" cy="215" r="6" fill="#a855f7" filter="url(#glow2)"/>

  <!-- Padlock body -->
  <rect x="250" y="305" width="200" height="160" rx="12" fill="none" stroke="white" stroke-width="4"/>
  <!-- Padlock shackle -->
  <path d="M295,305 L295,245 Q295,185 350,185 Q405,185 405,245 L405,305"
        fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="350" cy="375" r="22" fill="none" stroke="#00d4ff" stroke-width="3" filter="url(#glow2)"/>
  <circle cx="350" cy="375" r="10" fill="#00d4ff" opacity="0.7"/>
  <rect x="343" y="385" width="14" height="30" rx="3" fill="#00d4ff" opacity="0.7"/>

  <!-- Circuit lines from hex corners -->
  <line x1="350" y1="560" x2="350" y2="600" stroke="#00ff41" stroke-width="1.5" opacity="0.6" stroke-dasharray="4 3"/>
  <circle cx="280" cy="614" r="5" fill="#00d4ff" opacity="0.8"/>
  <circle cx="350" cy="610" r="7" fill="#00ff41" opacity="0.9" filter="url(#glow2)"/>
  <circle cx="420" cy="614" r="5" fill="#a855f7" opacity="0.8"/>
  <line x1="280" y1="614" x2="420" y2="614" stroke="url(#g2)" stroke-width="1.5" opacity="0.5"/>

  <!-- "BY SHADOWCYPHER" footer -->
  <text x="350" y="680" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold"
        fill="white" letter-spacing="4">SHADOWCYPHER</text>
  <text x="350" y="715" text-anchor="middle" font-family="monospace" font-size="11"
        fill="#a855f7" letter-spacing="8" opacity="0.6">SECURITY PLATFORM</text>
</svg>
