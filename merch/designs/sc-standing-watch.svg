<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 860">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#010510"/>
      <stop offset="100%" stop-color="#06101e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#dde0ff" stop-opacity="1"/>
      <stop offset="45%"  stop-color="#c0c4f0" stop-opacity="0.7"/>
      <stop offset="72%"  stop-color="#8899cc" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8899cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cityAmb" cx="50%" cy="90%" r="65%">
      <stop offset="0%"   stop-color="#ff8822" stop-opacity="0.30"/>
      <stop offset="45%"  stop-color="#ff6600" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bluntGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff5500" stop-opacity="1"/>
      <stop offset="35%"  stop-color="#ff5500" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>

    <!-- ======================================================= -->
    <!-- PULSING PURPLE NEON GLOW FILTER                         -->
    <!-- Two layers: tight inner rim (constant) +                -->
    <!--             breathing outer halo (SMIL animated)        -->
    <!-- ======================================================= -->
    <filter id="pGlow" x="-35%" y="-35%" width="170%" height="170%"
            color-interpolation-filters="sRGB">
      <!-- Outer halo — breathes with the lofi beat -->
      <feGaussianBlur in="SourceAlpha" result="blur2">
        <animate attributeName="stdDeviation"
                 values="10;26;10"
                 dur="2.6s"
                 repeatCount="indefinite"
                 calcMode="spline"
                 keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      </feGaussianBlur>
      <feFlood flood-color="#7711cc" result="outerColor">
        <animate attributeName="flood-opacity"
                 values="0.38;0.88;0.38"
                 dur="2.6s"
                 repeatCount="indefinite"
                 calcMode="spline"
                 keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      </feFlood>
      <feComposite in="outerColor" in2="blur2" operator="in" result="outerGlow"/>

      <!-- Inner rim — bright lavender, constant, tight neon edge -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur1"/>
      <feFlood flood-color="#cc77ff" flood-opacity="0.92" result="innerColor">
        <animate attributeName="flood-opacity"
                 values="0.7;1.0;0.7"
                 dur="2.6s"
                 repeatCount="indefinite"
                 calcMode="spline"
                 keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      </feFlood>
      <feComposite in="innerColor" in2="blur1" operator="in" result="innerGlow"/>

      <!-- Stack: outer halo → inner rim → crisp source on top -->
      <feMerge>
        <feMergeNode in="outerGlow"/>
        <feMergeNode in="innerGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Character body shapes (without blunt/smoke) in defs so we can use twice:
         once with glow filter, once crisp on top -->
    <g id="char">
      <!-- HOOD BACK -->
      <path d="M 280 484 C 272 448 270 406 282 372 C 294 338 320 310 350 304
               C 380 298 408 314 424 344 C 440 374 442 418 430 462 L 422 494 Z"
            fill="#111128"/>
      <!-- HEAD -->
      <circle cx="350" cy="390" r="58" fill="#0d0d20"/>
      <!-- HEADPHONES arc -->
      <path d="M 306 382 C 320 336 382 336 396 382"
            fill="none" stroke="#1e1e3a" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="302" cy="385" rx="12" ry="14" fill="#181832"/>
      <ellipse cx="400" cy="385" rx="12" ry="14" fill="#181832"/>
      <ellipse cx="302" cy="385" rx="7"  ry="8"  fill="#101028"/>
      <ellipse cx="400" cy="385" rx="7"  ry="8"  fill="#101028"/>
      <!-- Headphone cable -->
      <path d="M 400 398 C 404 420 408 440 414 460"
            fill="none" stroke="#1a1a30" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
      <!-- Drawstrings -->
      <line x1="338" y1="446" x2="330" y2="490" stroke="#181830" stroke-width="3" stroke-linecap="round"/>
      <line x1="362" y1="446" x2="368" y2="490" stroke="#181830" stroke-width="3" stroke-linecap="round"/>
      <!-- NECK -->
      <rect x="338" y="446" width="24" height="30" rx="4" fill="#0d0d20"/>
      <!-- TORSO -->
      <path d="M 252 508 C 242 550 238 594 240 646 L 454 646
               C 456 594 452 550 442 508 C 420 492 390 484 350 484
               C 310 484 276 492 252 508 Z"
            fill="#111128"/>
      <!-- Kangaroo pocket line -->
      <path d="M 286 592 Q 350 602 414 592"
            fill="none" stroke="#0e0e22" stroke-width="2.5" opacity="0.6"/>
      <!-- LEFT ARM -->
      <path d="M 246 522 C 232 548 224 580 222 616 C 222 628 234 630 244 626
               C 250 598 258 568 270 540 Z"
            fill="#111128"/>
      <!-- RIGHT ARM (upper) -->
      <path d="M 448 526 C 470 538 494 554 516 568 C 530 576 542 584 552 590"
            fill="none" stroke="#111128" stroke-width="36" stroke-linecap="round"/>
      <!-- RIGHT ARM (forearm) -->
      <path d="M 552 590 C 564 596 578 602 590 607"
            fill="none" stroke="#111128" stroke-width="24" stroke-linecap="round"/>
      <!-- HAND -->
      <circle cx="592" cy="608" r="14" fill="#0f0f24"/>
      <!-- HIPS -->
      <ellipse cx="347" cy="648" rx="110" ry="18" fill="#0f0f22"/>
      <!-- LEFT LEG -->
      <path d="M 290 666 C 284 702 280 740 278 776 C 278 786 290 790 304 788
               C 318 786 322 782 320 772 C 318 742 320 704 326 666 Z"
            fill="#111128"/>
      <!-- RIGHT LEG -->
      <path d="M 366 666 C 368 702 368 740 370 776 C 370 786 382 790 396 788
               C 410 786 412 782 410 772 C 408 742 406 704 402 666 Z"
            fill="#111128"/>
      <!-- SHOES -->
      <path d="M 274 772 C 270 792 286 798 304 796 C 320 794 324 788 320 776 Z"
            fill="#0e0e24"/>
      <path d="M 368 776 C 368 796 384 800 400 798 C 416 796 416 790 410 778 Z"
            fill="#0e0e24"/>
    </g>

    <pattern id="stars" width="90" height="72" patternUnits="userSpaceOnUse">
      <circle cx="8"  cy="10" r="0.9" fill="#fff" opacity="0.75"/>
      <circle cx="32" cy="4"  r="0.6" fill="#fff" opacity="0.58"/>
      <circle cx="54" cy="18" r="1.0" fill="#fff" opacity="0.84"/>
      <circle cx="78" cy="7"  r="0.7" fill="#fff" opacity="0.62"/>
      <circle cx="18" cy="44" r="0.8" fill="#fff" opacity="0.52"/>
      <circle cx="46" cy="50" r="0.9" fill="#fff" opacity="0.72"/>
      <circle cx="68" cy="60" r="0.6" fill="#fff" opacity="0.47"/>
      <circle cx="4"  cy="62" r="0.7" fill="#aabbff" opacity="0.54"/>
      <circle cx="38" cy="30" r="0.5" fill="#fff" opacity="0.65"/>
      <circle cx="84" cy="36" r="0.8" fill="#fff" opacity="0.50"/>
      <circle cx="22" cy="22" r="0.7" fill="#fff" opacity="0.44"/>
    </pattern>
    <linearGradient id="fadeBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#06101e" stop-opacity="0"/>
      <stop offset="38%"  stop-color="#040810" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- SKY -->
  <rect width="680" height="860" fill="url(#sky)"/>
  <rect x="0" y="0" width="680" height="540" fill="url(#stars)"/>

  <!-- MOON -->
  <circle cx="130" cy="108" r="130" fill="url(#moonGlow)"/>
  <circle cx="130" cy="108" r="82"  fill="#dde0ff"/>
  <circle cx="112" cy="94"  r="11"  fill="#c8ccee" opacity="0.52"/>
  <circle cx="148" cy="122" r="7"   fill="#c8ccee" opacity="0.45"/>
  <circle cx="124" cy="130" r="4.5" fill="#c8ccee" opacity="0.40"/>
  <circle cx="158" cy="96"  r="6"   fill="#c8ccee" opacity="0.44"/>

  <!-- CITY SKYLINE -->
  <rect x="0"   y="500" width="48"  height="120" fill="#0a0a18"/>
  <rect x="44"  y="474" width="32"  height="146" fill="#0c0c1c"/>
  <rect x="72"  y="492" width="40"  height="128" fill="#080810"/>
  <rect x="72"  y="442" width="6"   height="52"  fill="#0c0c1c"/>
  <circle cx="75"  cy="440" r="3"   fill="#ff2222" opacity="0.88"/>
  <rect x="108" y="484" width="44"  height="136" fill="#0a0a18"/>
  <rect x="148" y="460" width="38"  height="160" fill="#0c0c1e"/>
  <rect x="182" y="446" width="58"  height="174" fill="#080810"/>
  <rect x="196" y="406" width="20"  height="42"  fill="#0a0a1c"/>
  <rect x="202" y="374" width="8"   height="34"  fill="#0d0d1e"/>
  <circle cx="206" cy="372" r="3.5" fill="#ff2222" opacity="0.9"/>
  <rect x="236" y="476" width="40"  height="144" fill="#090912"/>
  <rect x="272" y="490" width="36"  height="130" fill="#080810"/>
  <rect x="304" y="460" width="52"  height="160" fill="#0b0b1a"/>
  <polygon points="330,460 342,420 354,460" fill="#0d0d1e"/>
  <line x1="342" y1="420" x2="342" y2="394" stroke="#0e0e1e" stroke-width="2"/>
  <circle cx="342" cy="392" r="3.5" fill="#ff2222" opacity="0.86"/>
  <rect x="352" y="474" width="38"  height="146" fill="#08080e"/>
  <rect x="386" y="462" width="48"  height="158" fill="#0c0c1c"/>
  <rect x="430" y="478" width="42"  height="142" fill="#080810"/>
  <rect x="468" y="464" width="50"  height="156" fill="#0b0b1a"/>
  <rect x="514" y="480" width="40"  height="140" fill="#08080e"/>
  <rect x="550" y="466" width="36"  height="154" fill="#090912"/>
  <rect x="550" y="430" width="12"  height="38"  fill="#0c0c1c"/>
  <circle cx="556" cy="428" r="3"   fill="#ff2222" opacity="0.82"/>
  <rect x="582" y="478" width="42"  height="142" fill="#08080e"/>
  <rect x="620" y="492" width="36"  height="128" fill="#0a0a18"/>
  <rect x="652" y="476" width="28"  height="144" fill="#090912"/>

  <!-- CITY AMBIENT GLOW (warm backdrop, makes silhouette readable) -->
  <rect x="0" y="280" width="680" height="580" fill="url(#cityAmb)"/>

  <!-- ======================================================= -->
  <!-- CHARACTER: glow layer first (pGlow filter), then crisp  -->
  <!-- ======================================================= -->
  <use href="#char" filter="url(#pGlow)"/>
  <use href="#char"/>

  <!-- BLUNT stick (separate — stays orange, not purple) -->
  <line x1="596" y1="604" x2="630" y2="620" stroke="#2e1408" stroke-width="6" stroke-linecap="round"/>
  <!-- Ash near ember -->
  <line x1="626" y1="618" x2="634" y2="622" stroke="#666" stroke-width="5" stroke-linecap="round"/>
  <!-- EMBER (the only warm colour — contrast against purple glow) -->
  <circle cx="636" cy="623" r="6"  fill="#ff5500"/>
  <circle cx="636" cy="623" r="18" fill="url(#bluntGlow)"/>
  <circle cx="636" cy="623" r="34" fill="#ff5500" opacity="0.07"/>

  <!-- SMOKE trails -->
  <path d="M 634 617 C 628 602 634 587 629 572 C 624 557 630 542 626 528
           C 622 514 628 500 624 486 C 620 472 626 459 622 445"
        fill="none" stroke="#9aabbf" stroke-width="2.5" stroke-linecap="round" opacity="0.44"/>
  <path d="M 638 615 C 646 600 640 585 648 570 C 656 555 650 542 656 528
           C 662 514 656 500 660 486"
        fill="none" stroke="#9aabbf" stroke-width="1.8" stroke-linecap="round" opacity="0.28"/>
  <path d="M 631 615 C 622 600 626 585 618 570 C 610 555 615 542 607 528
           C 600 515 605 502 598 488"
        fill="none" stroke="#b0c0cc" stroke-width="1.2" stroke-linecap="round" opacity="0.16"/>

  <!-- LEDGE -->
  <rect x="0"   y="648" width="680" height="8"  fill="#1e1e34"/>
  <rect x="0"   y="656" width="680" height="38" fill="#0e0e1e"/>
  <!-- Subtle purple ledge glow (matches character glow, sits on same surface) -->
  <line x1="0" y1="656" x2="680" y2="656" stroke="#9922ff" stroke-width="1" opacity="0.18">
    <animate attributeName="opacity" values="0.10;0.28;0.10" dur="2.6s"
             repeatCount="indefinite" calcMode="spline"
             keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </line>
  <line x1="0" y1="694" x2="680" y2="694" stroke="#080816" stroke-width="2"/>

  <!-- CITY BELOW -->
  <rect x="0" y="694" width="680" height="90" fill="#040410"/>
  <rect x="30"  y="706" width="6" height="4" rx="0.5" fill="#ff9900" opacity="0.35"/>
  <rect x="74"  y="718" width="4" height="3" rx="0.5" fill="#4488ff" opacity="0.30"/>
  <rect x="110" y="708" width="5" height="4" rx="0.5" fill="#ff9900" opacity="0.32"/>
  <rect x="158" y="722" width="4" height="3" rx="0.5" fill="#ff9900" opacity="0.28"/>
  <rect x="196" y="712" width="6" height="4" rx="0.5" fill="#4488ff" opacity="0.30"/>
  <rect x="240" y="726" width="4" height="3" rx="0.5" fill="#ff9900" opacity="0.25"/>
  <rect x="280" y="714" width="5" height="4" rx="0.5" fill="#ff9900" opacity="0.32"/>
  <rect x="324" y="720" width="4" height="3" rx="0.5" fill="#4488ff" opacity="0.28"/>
  <rect x="368" y="710" width="6" height="4" rx="0.5" fill="#ff9900" opacity="0.30"/>
  <rect x="406" y="728" width="4" height="3" rx="0.5" fill="#4488ff" opacity="0.25"/>
  <rect x="448" y="716" width="5" height="4" rx="0.5" fill="#ff9900" opacity="0.32"/>
  <rect x="494" y="706" width="4" height="3" rx="0.5" fill="#ff9900" opacity="0.28"/>
  <rect x="534" y="722" width="6" height="4" rx="0.5" fill="#4488ff" opacity="0.30"/>
  <rect x="578" y="712" width="4" height="3" rx="0.5" fill="#ff9900" opacity="0.25"/>
  <rect x="624" y="724" width="5" height="4" rx="0.5" fill="#ff9900" opacity="0.32"/>
  <rect x="56"  y="736" width="4" height="3" rx="0.5" fill="#4488ff" opacity="0.22"/>
  <rect x="140" y="740" width="5" height="3" rx="0.5" fill="#ff9900" opacity="0.20"/>
  <rect x="320" y="742" width="4" height="3" rx="0.5" fill="#4488ff" opacity="0.20"/>
  <rect x="460" y="752" width="4" height="3" rx="0.5" fill="#ff9900" opacity="0.18"/>
  <rect x="560" y="738" width="5" height="3" rx="0.5" fill="#4488ff" opacity="0.20"/>

  <!-- BOTTOM FADE -->
  <rect x="0" y="700" width="680" height="160" fill="url(#fadeBot)"/>

  <!-- WORDMARK -->
  <text x="340" y="812" font-family="Arial Black, Arial, sans-serif" font-size="34"
        fill="#ffffff" text-anchor="middle" font-weight="900" letter-spacing="7">SHADOWCYPHER</text>
  <line x1="178" y1="826" x2="502" y2="826" stroke="#9933ff" stroke-width="1" opacity="0.55"/>
  <text x="340" y="848" font-family="'Courier New', Courier, monospace" font-size="10"
        fill="#9933ff" text-anchor="middle" letter-spacing="2.5" opacity="0.88">HE NEVER SLEEPS SO YOU CAN</text>
</svg>
