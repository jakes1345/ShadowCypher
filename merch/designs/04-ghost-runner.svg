<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
  <!-- GHOST RUNNER - action pose, running/flying sideways, speed lines -->
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12102a"/>
      <stop offset="100%" stop-color="#08080e"/>
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="eg4" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="zg4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="aura4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Motion trail aura -->
  <ellipse cx="420" cy="340" rx="280" ry="200" fill="#a855f7" opacity="0.05" filter="url(#aura4)"/>

  <!-- SPEED LINES trailing behind character (going right = character moving left-to-right) -->
  <line x1="30" y1="240" x2="270" y2="240" stroke="#00d4ff" stroke-width="3" opacity="0.35"/>
  <line x1="20" y1="260" x2="250" y2="260" stroke="#00d4ff" stroke-width="2" opacity="0.25"/>
  <line x1="40" y1="280" x2="240" y2="280" stroke="#a855f7" stroke-width="2.5" opacity="0.3"/>
  <line x1="15" y1="300" x2="255" y2="300" stroke="#00d4ff" stroke-width="2" opacity="0.2"/>
  <line x1="30" y1="320" x2="248" y2="320" stroke="#a855f7" stroke-width="1.5" opacity="0.2"/>
  <line x1="50" y1="340" x2="245" y2="340" stroke="#00d4ff" stroke-width="1.5" opacity="0.15"/>
  <line x1="30" y1="360" x2="240" y2="360" stroke="#a855f7" stroke-width="1" opacity="0.12"/>
  <line x1="20" y1="380" x2="235" y2="380" stroke="#00d4ff" stroke-width="1" opacity="0.1"/>
  <!-- Longer bold speed lines -->
  <line x1="10" y1="220" x2="230" y2="218" stroke="#00d4ff" stroke-width="4" opacity="0.4" filter="url(#zg4)"/>
  <line x1="5" y1="400" x2="220" y2="398" stroke="#a855f7" stroke-width="3" opacity="0.35" filter="url(#zg4)"/>

  <!-- CHARACTER - leaning forward/running pose, tilted ~20 degrees -->
  <g transform="rotate(-18, 480, 320) translate(30, 0)">

  <!-- Body silhouette - squished/oval for speed -->
  <path d="
    M 468,110
    C 530,108 578,146 582,196
    C 586,240 574,272 556,285
    C 578,298 596,328 596,362
    C 596,404 582,440 566,472
    C 552,502 536,522 532,548
    C 528,566 520,578 506,584
    C 496,589 484,591 476,588
    C 470,594 462,597 468,597
    C 444,597 444,594 450,588
    C 440,591 428,589 418,584
    C 404,578 396,566 392,548
    C 388,522 372,502 358,472
    C 342,440 328,404 328,362
    C 328,328 346,298 368,285
    C 350,272 338,240 342,196
    C 346,146 394,108 468,110 Z"
    fill="url(#bg4)"/>

  <path d="
    M 468,110
    C 530,108 578,146 582,196
    C 586,240 574,272 556,285
    C 578,298 596,328 596,362
    C 596,404 582,440 566,472
    C 552,502 536,522 532,548
    C 528,566 520,578 506,584
    C 496,589 484,591 476,588
    C 470,594 462,597 468,597
    C 444,597 444,594 450,588
    C 440,591 428,589 418,584
    C 404,578 396,566 392,548
    C 388,522 372,502 358,472
    C 342,440 328,404 328,362
    C 328,328 346,298 368,285
    C 350,272 338,240 342,196
    C 346,146 394,108 468,110 Z"
    fill="none" stroke="url(#grad4)" stroke-width="3" filter="url(#eg4)"/>

  <!-- Hood dome -->
  <ellipse cx="468" cy="196" rx="112" ry="100" fill="#181830" opacity="0.5"/>
  <!-- Hood brim -->
  <path d="M 368,278 Q 468,308 568,278" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5"/>

  <!-- Face void -->
  <path d="M 418,142 C 410,142 394,156 392,180 C 390,210 400,244 418,256 L 518,256 C 536,244 546,210 544,180 C 542,156 526,142 518,142 Z"
        fill="#05050a"/>

  <!-- EYES - wide, determined look (leaning forward intensity) -->
  <rect x="402" y="196" width="58" height="22" rx="4" fill="#00d4ff" filter="url(#eg4)"/>
  <rect x="406" y="200" width="48" height="8" rx="2" fill="white" opacity="0.65"/>
  <rect x="474" y="196" width="58" height="22" rx="4" fill="#00d4ff" filter="url(#eg4)"/>
  <rect x="478" y="200" width="48" height="8" rx="2" fill="white" opacity="0.65"/>

  <!-- Arm trailing behind (raised / in motion) -->
  <ellipse cx="304" cy="330" rx="42" ry="32" fill="#10101e" stroke="#a855f7" stroke-width="2.5" transform="rotate(40,304,330)"/>

  <!-- Front arm reaching forward -->
  <ellipse cx="628" cy="305" rx="42" ry="28" fill="#10101e" stroke="#00d4ff" stroke-width="2.5" transform="rotate(-25,628,305)"/>

  <!-- Leg kicking back -->
  <ellipse cx="360" cy="580" rx="36" ry="26" fill="#10101e" stroke="#a855f7" stroke-width="2.5" transform="rotate(35,360,580)"/>
  <!-- Lead leg forward -->
  <ellipse cx="550" cy="568" rx="36" ry="26" fill="#10101e" stroke="#00d4ff" stroke-width="2.5" transform="rotate(-35,550,568)"/>

  </g><!-- end body group -->

  <!-- ZAP trail particles behind character -->
  <circle cx="220" cy="255" r="6" fill="#00d4ff" opacity="0.6" filter="url(#zg4)"/>
  <circle cx="190" cy="290" r="4" fill="#a855f7" opacity="0.5" filter="url(#zg4)"/>
  <circle cx="210" cy="330" r="5" fill="#00d4ff" opacity="0.55" filter="url(#zg4)"/>
  <circle cx="175" cy="360" r="3" fill="#a855f7" opacity="0.45"/>
  <circle cx="200" cy="400" r="4" fill="#00d4ff" opacity="0.4"/>
  <circle cx="165" cy="435" r="3" fill="#a855f7" opacity="0.35"/>
  <circle cx="155" cy="265" r="8" fill="#00ff41" opacity="0.4" filter="url(#zg4)"/>

  <!-- ZAP lightning behind -->
  <path d="M 160,220 L 188,258 L 168,258 L 200,302" fill="none" stroke="#00d4ff" stroke-width="4.5" stroke-linecap="round" filter="url(#zg4)"/>
  <path d="M 140,280 L 168,318 L 148,318 L 180,360" fill="none" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" filter="url(#zg4)" opacity="0.8"/>

  <!-- WORDMARK at bottom -->
  <text x="400" y="660" text-anchor="middle" font-family="monospace" font-size="48" font-weight="bold"
        fill="white" letter-spacing="4">SHADOWCYPHER</text>
  <text x="400" y="695" text-anchor="middle" font-family="monospace" font-size="13"
        fill="url(#grad4)" letter-spacing="8" opacity="0.7">GHOST RUNNER</text>
</svg>
