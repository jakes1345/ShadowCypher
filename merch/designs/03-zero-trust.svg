<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100">
  <defs>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Top accent line -->
  <line x1="60" y1="80" x2="840" y2="80" stroke="url(#g3)" stroke-width="2" opacity="0.6"/>
  <circle cx="60" cy="80" r="4" fill="#00d4ff" opacity="0.8"/>
  <circle cx="840" cy="80" r="4" fill="#a855f7" opacity="0.8"/>

  <!-- ZERO -->
  <text x="450" y="300" text-anchor="middle" font-family="monospace" font-size="210" font-weight="bold"
        fill="white" letter-spacing="-4">ZERO</text>

  <!-- Diagonal slash through ZERO -->
  <line x1="100" y1="110" x2="800" y2="340" stroke="#00d4ff" stroke-width="6" opacity="0.35" filter="url(#glow3)"/>

  <!-- TRUST -->
  <text x="450" y="510" text-anchor="middle" font-family="monospace" font-size="210" font-weight="bold"
        fill="url(#g3)" letter-spacing="-4">TRUST</text>

  <!-- Divider line with text -->
  <line x1="60" y1="560" x2="840" y2="560" stroke="white" stroke-width="1" opacity="0.2"/>

  <!-- NOBODY -->
  <text x="450" y="650" text-anchor="middle" font-family="monospace" font-size="100" font-weight="bold"
        fill="white" letter-spacing="20" opacity="0.9">NOBODY</text>

  <!-- Horizontal rule under NOBODY -->
  <rect x="160" y="678" width="580" height="4" rx="2" fill="url(#g3)" opacity="0.5"/>

  <!-- Sub text -->
  <text x="450" y="760" text-anchor="middle" font-family="monospace" font-size="18"
        fill="white" letter-spacing="6" opacity="0.4">VERIFY EVERYTHING. ASSUME BREACH.</text>

  <!-- Circuit decoration bottom -->
  <line x1="60" y1="840" x2="840" y2="840" stroke="url(#g3)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="200" cy="840" r="4" fill="#00d4ff" opacity="0.7"/>
  <circle cx="450" cy="840" r="6" fill="#00ff41" opacity="0.8" filter="url(#glow3)"/>
  <circle cx="700" cy="840" r="4" fill="#a855f7" opacity="0.7"/>
  <line x1="200" y1="840" x2="200" y2="810" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
  <line x1="450" y1="840" x2="450" y2="800" stroke="#00ff41" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 3"/>
  <line x1="700" y1="840" x2="700" y2="810" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>

  <!-- SC wordmark -->
  <text x="450" y="960" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold"
        fill="url(#g3)" letter-spacing="8">SHADOWCYPHER</text>
  <text x="450" y="1000" text-anchor="middle" font-family="monospace" font-size="12"
        fill="white" letter-spacing="10" opacity="0.35">ENTERPRISE SECURITY</text>

  <!-- Bottom line -->
  <line x1="60" y1="1050" x2="840" y2="1050" stroke="url(#g3)" stroke-width="2" opacity="0.6"/>
  <circle cx="60" cy="1050" r="4" fill="#a855f7" opacity="0.8"/>
  <circle cx="840" cy="1050" r="4" fill="#00d4ff" opacity="0.8"/>
</svg>
