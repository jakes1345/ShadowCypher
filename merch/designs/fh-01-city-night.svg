  <rect x="606" y="525" width="22"  height="105" fill="#0a0820" opacity="0.7"/>
  <rect x="624" y="498" width="30"  height="132" fill="#0e0c28" opacity="0.7"/>
  <rect x="649" y="520" width="20"  height="110" fill="#0a0820" opacity="0.7"/>
  <rect x="665" y="540" width="35"  height="90"  fill="#0a0820" opacity="0.7"/>

  <!-- Building window lights (far buildings) -->
  <rect x="28"  y="525" width="4" height="3" fill="#00d4ff" opacity="0.3"/>
  <rect x="62"  y="518" width="4" height="3" fill="#a855f7" opacity="0.3"/>
  <rect x="98"  y="510" width="4" height="3" fill="#00d4ff" opacity="0.25"/>
  <rect x="132" y="515" width="4" height="3" fill="#a855f7" opacity="0.3"/>
  <rect x="168" y="508" width="4" height="3" fill="#00d4ff" opacity="0.3"/>
  <rect x="210" y="500" width="4" height="3" fill="#a855f7" opacity="0.25"/>
  <rect x="475" y="515" width="4" height="3" fill="#00d4ff" opacity="0.3"/>
  <rect x="512" y="505" width="4" height="3" fill="#a855f7" opacity="0.3"/>
  <rect x="552" y="512" width="4" height="3" fill="#00d4ff" opacity="0.25"/>
  <rect x="592" y="520" width="4" height="3" fill="#a855f7" opacity="0.3"/>
  <rect x="630" y="508" width="4" height="3" fill="#00d4ff" opacity="0.3"/>

  <!-- NEON HORIZON LINE / CITY LIGHT GLOW along bottom of buildings -->
  <rect x="0" y="628" width="700" height="4" fill="#a855f7" opacity="0.12" filter="url(#bigAura)"/>
  <rect x="0" y="625" width="700" height="8" fill="#00d4ff" opacity="0.08" filter="url(#bigAura)"/>

  <!-- FOREGROUND BUILDINGS (brighter, more defined) -->
  <!-- Left fg building -->
  <rect x="0"   y="490" width="88"  height="240" fill="#0c0a1e"/>
  <rect x="0"   y="490" width="88"  height="240" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
  <!-- Left fg windows grid -->
  <rect x="8"   y="500" width="10" height="7" fill="#00d4ff" opacity="0.18"/>
  <rect x="22"  y="500" width="10" height="7" fill="#a855f7" opacity="0.15"/>
  <rect x="36"  y="500" width="10" height="7" fill="#00d4ff" opacity="0.2"/>
  <rect x="50"  y="500" width="10" height="7" fill="#00d4ff" opacity="0.12"/>
  <rect x="64"  y="500" width="10" height="7" fill="#a855f7" opacity="0.18"/>
  <rect x="8"   y="515" width="10" height="7" fill="#a855f7" opacity="0.15"/>
  <rect x="22"  y="515" width="10" height="7" fill="#00d4ff" opacity="0.2"/>
  <rect x="36"  y="515" width="10" height="7" fill="#00d4ff" opacity="0.12"/>
  <rect x="50"  y="515" width="10" height="7" fill="#a855f7" opacity="0.18"/>
  <rect x="64"  y="515" width="10" height="7" fill="#00d4ff" opacity="0.15"/>
  <rect x="8"   y="530" width="10" height="7" fill="#00d4ff" opacity="0.22"/>
  <rect x="22"  y="530" width="10" height="7" fill="#00d4ff" opacity="0.12"/>
  <rect x="50"  y="530" width="10" height="7" fill="#00d4ff" opacity="0.2"/>
  <rect x="64"  y="530" width="10" height="7" fill="#a855f7" opacity="0.18"/>
  <!-- Left rooftop antenna -->
  <line x1="44" y1="490" x2="44" y2="465" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
  <circle cx="44" cy="462" r="3" fill="#00d4ff" opacity="0.5" filter="url(#cityGlow)"/>

