  <rect x="276" y="279" width="88"  height="15" rx="4" fill="white" opacity="0.6"/>
  <rect x="328" y="272" width="104" height="36" rx="6" fill="#00d4ff" filter="url(#eyeGlow)"/>
  <rect x="336" y="279" width="88"  height="15" rx="4" fill="white" opacity="0.6"/>

