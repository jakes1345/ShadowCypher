  <!-- Rain column 1 -->
  <text x="112" y="160" font-family="monospace" font-size="11" fill="#00d4ff" opacity="0.08" filter="url(#rainGlow)">1</text>
  <text x="112" y="175" font-family="monospace" font-size="11" fill="#00d4ff" opacity="0.12">0</text>
  <text x="112" y="190" font-family="monospace" font-size="11" fill="#00d4ff" opacity="0.16">1</text>
  <text x="112" y="205" font-family="monospace" font-size="11" fill="#00d4ff" opacity="0.2">S</text>
  <text x="112" y="220" font-family="monospace" font-size="11" fill="#00ff41" opacity="0.35" filter="url(#rainGlow)">C</text>
  <text x="112" y="235" font-family="monospace" font-size="11" fill="#00d4ff" opacity="0.2">0</text>
  <text x="112" y="250" font-family="monospace" font-size="11" fill="#00d4ff" opacity="0.14">1</text>
  <!-- Rain column 2 -->
  <text x="240" y="140" font-family="monospace" font-size="11" fill="#a855f7" opacity="0.1">0</text>
  <text x="240" y="155" font-family="monospace" font-size="11" fill="#a855f7" opacity="0.15">1</text>
  <text x="240" y="170" font-family="monospace" font-size="11" fill="#a855f7" opacity="0.2">0</text>
  <text x="240" y="185" font-family="monospace" font-size="11" fill="#a855f7" opacity="0.28">S</text>
  <text x="240" y="200" font-family="monospace" font-size="11" fill="#ffffff" opacity="0.4" filter="url(#rainGlow)">C</text>
  <text x="240" y="215" font-family="monospace" font-size="11" fill="#a855f7" opacity="0.22">1</text>
