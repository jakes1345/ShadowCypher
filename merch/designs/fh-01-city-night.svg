  <circle cx="118" cy="22" r="0.8" fill="#00d4ff" opacity="0.6"/>
  <circle cx="195" cy="55" r="1.4" fill="#ffffff" opacity="0.8"/>
  <circle cx="280" cy="18" r="1" fill="#a855f7" opacity="0.7"/>
  <circle cx="352" cy="44" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="430" cy="28" r="0.9" fill="#00d4ff" opacity="0.55"/>
  <circle cx="510" cy="60" r="1.5" fill="#ffffff" opacity="0.75"/>
  <circle cx="590" cy="32" r="1" fill="#a855f7" opacity="0.65"/>
  <circle cx="655" cy="48" r="1.2" fill="#ffffff" opacity="0.7"/>
  <circle cx="68" cy="88" r="0.7" fill="#00d4ff" opacity="0.5"/>
  <circle cx="152" cy="72" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="234" cy="96" r="0.8" fill="#a855f7" opacity="0.55"/>
  <circle cx="318" cy="80" r="1.3" fill="#ffffff" opacity="0.7"/>
