  <rect x="490" y="544" width="28" height="14" rx="2" fill="#0e0e28" stroke="#a855f7" stroke-width="0.5" opacity="0.4"/>
  <rect x="218" y="549" width="12" height="9" rx="1" fill="#0c0c24" opacity="0.5"/>
  <rect x="456" y="549" width="12" height="9" rx="1" fill="#0c0c24" opacity="0.5"/>

  <!-- GHOST CHARACTER - standing centered on rooftop -->
  <!-- Ghost aura (big soft glow behind entire figure) -->
  <ellipse cx="350" cy="380" rx="120" ry="160" fill="#00d4ff" opacity="0.04" filter="url(#bigAura)"/>
  <ellipse cx="350" cy="380" rx="80" ry="120" fill="#a855f7" opacity="0.05" filter="url(#bigAura)"/>

  <!-- Ghost body -->
  <path d="M 350,168 C 418,166 468,208 474,264 C 480,314 468,350 452,368 C 476,380 494,412 494,448 C 494,496 480,538 464,572 C 450,604 434,626 430,652 C 427,672 420,688 404,696 C 390,702 376,706 364,702 C 356,710 344,714 350,714 C 330,714 326,710 336,702 C 322,706 308,702 294,696 C 278,688 271,672 268,652 C 264,626 248,604 234,572 C 218,538 206,496 206,448 C 206,412 224,380 248,368 C 232,350 220,314 226,264 C 232,208 282,166 350,168 Z"
