  <ellipse cx="314" cy="548" rx="44" ry="18" fill="#0f0f24" stroke="#a855f7" stroke-width="2" opacity="0.8"/>
  <ellipse cx="386" cy="548" rx="44" ry="18" fill="#0f0f24" stroke="#a855f7" stroke-width="2" opacity="0.8"/>

