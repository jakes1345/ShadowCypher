  <path d="M 148,330 L 170,362 L 156,362 L 180,400" fill="none" stroke="#00d4ff" stroke-width="4.5" stroke-linecap="round" filter="url(#eyeGlow)"/>
  <path d="M 552,330 L 530,362 L 544,362 L 520,400" fill="none" stroke="#a855f7" stroke-width="4.5" stroke-linecap="round" filter="url(#eyeGlow)"/>

