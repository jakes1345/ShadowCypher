  <rect x="634" y="505" width="10" height="7" fill="#a855f7" opacity="0.2"/>
  <rect x="662" y="505" width="10" height="7" fill="#00d4ff" opacity="0.18"/>
  <rect x="676" y="505" width="10" height="7" fill="#a855f7" opacity="0.15"/>
