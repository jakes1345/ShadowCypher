<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900">
  <!-- FH-01: CITY NIGHT - Ghost standing on rooftop over neon cyber city. Full Freshoodz-style scene. -->
  <defs>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020208"/>
      <stop offset="45%" stop-color="#06042a"/>
      <stop offset="80%" stop-color="#0a0635"/>
      <stop offset="100%" stop-color="#12062a"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ghostFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0c22"/><stop offset="100%" stop-color="#06060e"/>
    </linearGradient>
    <filter id="cityGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ghostGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="eyeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigAura" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="starBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="rainGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <clipPath id="sceneClip">
      <rect x="0" y="0" width="700" height="900"/>
    </clipPath>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="700" height="900" fill="url(#sky1)"/>

  <!-- HORIZON ATMOSPHERIC GLOW -->
  <rect x="0" y="440" width="700" height="300" fill="url(#horizonGlow)"/>

  <!-- STARS scattered in upper sky -->
