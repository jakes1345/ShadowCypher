  <ellipse cx="192" cy="440" rx="28" ry="46" fill="#0e0e22" stroke="#00d4ff" stroke-width="1.5" opacity="0.7" transform="rotate(-8,192,440)"/>
  <ellipse cx="508" cy="440" rx="28" ry="46" fill="#0e0e22" stroke="#a855f7" stroke-width="1.5" opacity="0.7" transform="rotate(8,508,440)"/>

