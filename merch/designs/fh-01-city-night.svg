  <circle cx="175" cy="108" r="1.1" fill="#00d4ff" opacity="0.5"/>
  <circle cx="262" cy="130" r="0.7" fill="#ffffff" opacity="0.6"/>
  <circle cx="345" cy="115" r="1" fill="#a855f7" opacity="0.55"/>
  <circle cx="422" cy="138" r="0.8" fill="#ffffff" opacity="0.5"/>
