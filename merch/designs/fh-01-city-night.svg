  <rect x="634" y="490" width="10" height="7" fill="#00d4ff" opacity="0.15"/>
  <rect x="648" y="490" width="10" height="7" fill="#a855f7" opacity="0.2"/>
  <rect x="662" y="490" width="10" height="7" fill="#00d4ff" opacity="0.12"/>
  <rect x="676" y="490" width="10" height="7" fill="#a855f7" opacity="0.18"/>
