  <circle cx="444" cy="88" r="2.2" fill="#a855f7" opacity="0.45" filter="url(#starBlur)"/>
  <circle cx="600" cy="62" r="1.8" fill="#00d4ff" opacity="0.5" filter="url(#starBlur)"/>
  <circle cx="222" cy="40" r="1.6" fill="#ffffff" opacity="0.8" filter="url(#starBlur)"/>

