  <text x="460" y="165" font-family="monospace" font-size="11" fill="#00d4ff" opacity="0.14">0</text>
  <text x="460" y="180" font-family="monospace" font-size="11" fill="#00d4ff" opacity="0.2">S</text>
  <text x="460" y="195" font-family="monospace" font-size="11" fill="#00ff41" opacity="0.38" filter="url(#rainGlow)">C</text>
