  <!-- Rain column 4 -->
  <text x="590" y="130" font-family="monospace" font-size="11" fill="#a855f7" opacity="0.12">0</text>
  <text x="590" y="145" font-family="monospace" font-size="11" fill="#a855f7" opacity="0.18">1</text>
  <text x="590" y="160" font-family="monospace" font-size="11" fill="#a855f7" opacity="0.25">0</text>
  <text x="590" y="175" font-family="monospace" font-size="11" fill="#ffffff" opacity="0.42" filter="url(#rainGlow)">S</text>
  <text x="590" y="190" font-family="monospace" font-size="11" fill="#a855f7" opacity="0.22">C</text>

