<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850">
  <!-- GHOST RAGE - same character but ANGRY eyes, leaning forward, more intense -->
  <defs>
    <linearGradient id="bg3" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#14102a"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </linearGradient>
    <linearGradient id="rageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3060"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="eyeRage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4080"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>
    <filter id="rageGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="aura3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="zap3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Red/purple aura = RAGE -->
  <ellipse cx="350" cy="430" rx="240" ry="320" fill="#ff2050" opacity="0.06" filter="url(#aura3)"/>
  <ellipse cx="350" cy="240" rx="150" ry="180" fill="#a855f7" opacity="0.06" filter="url(#aura3)"/>

  <!-- CHARACTER - slightly tilted/leaning (transformed) -->
  <g transform="rotate(-5, 350, 430)">

  <!-- Main body silhouette - same fat ghost shape -->
  <path d="
    M 350,75
    C 430,73 492,124 498,192
    C 504,252 490,295 472,314
    C 504,328 528,366 528,408
    C 528,460 512,508 494,548
    C 478,586 460,616 455,652
    C 451,676 441,696 420,706
    C 404,714 386,718 370,713
    C 360,724 345,729 350,729
    C 325,729 320,724 330,713
    C 314,718 296,714 280,706
    C 259,696 249,676 245,652
    C 240,616 222,586 206,548
    C 188,508 172,460 172,408
    C 172,366 196,328 228,314
    C 210,295 196,252 202,192
    C 208,124 270,73 350,75 Z"
    fill="url(#bg3)"/>

  <!-- Glow outline - RAGE color (red/purple instead of cyan/purple) -->
  <path d="
    M 350,75
    C 430,73 492,124 498,192
    C 504,252 490,295 472,314
    C 504,328 528,366 528,408
    C 528,460 512,508 494,548
    C 478,586 460,616 455,652
    C 451,676 441,696 420,706
    C 404,714 386,718 370,713
    C 360,724 345,729 350,729
    C 325,729 320,724 330,713
    C 314,718 296,714 280,706
    C 259,696 249,676 245,652
    C 240,616 222,586 206,548
    C 188,508 172,460 172,408
    C 172,366 196,328 228,314
    C 210,295 196,252 202,192
    C 208,124 270,73 350,75 Z"
    fill="none" stroke="url(#rageGrad)" stroke-width="3.5" filter="url(#rageGlow)" opacity="0.9"/>

  <!-- Hood dome shading -->
  <ellipse cx="350" cy="202" rx="130" ry="120" fill="#1a1030" opacity="0.55"/>

  <!-- Hood brim -->
  <path d="M 228,306 Q 350,338 472,306" fill="none" stroke="#a855f7" stroke-width="2.5" opacity="0.5"/>

  <!-- Face void -->
  <path d="M 296,148 C 286,148 268,164 266,194 C 264,228 275,270 296,285 L 404,285 C 425,270 436,228 434,194 C 432,164 414,148 404,148 Z"
        fill="#060410"/>

  <!-- ANGRY EYES - angled, "furrowed brow" feel -->
  <!-- Left eye - angled (inner corner lower = angry look) -->
  <path d="M 278,236 L 342,226 L 344,250 L 278,260 Z" fill="#ff3060" filter="url(#rageGlow)"/>
  <path d="M 282,240 L 338,232 L 339,246 L 282,254 Z" fill="white" opacity="0.6"/>
  <!-- Right eye - mirror angry angle -->
  <path d="M 358,226 L 422,236 L 422,260 L 358,250 Z" fill="#ff3060" filter="url(#rageGlow)"/>
  <path d="M 361,232 L 418,240 L 418,254 L 361,246 Z" fill="white" opacity="0.6"/>

  <!-- Angry brow marks above eyes -->
  <path d="M 272,218 L 296,208" fill="none" stroke="#ff3060" stroke-width="3" stroke-linecap="round" filter="url(#rageGlow)" opacity="0.9"/>
  <path d="M 350,208 L 374,218" fill="none" stroke="#ff3060" stroke-width="3" stroke-linecap="round" filter="url(#rageGlow)" opacity="0.9"/>

  <!-- Body SC mark -->
  <path d="M 318,418 L 350,396 L 382,418 L 370,452 L 350,468 L 330,452 Z"
        fill="none" stroke="#a855f7" stroke-width="2" opacity="0.4"/>
  <text x="350" y="438" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold"
        fill="#a855f7" opacity="0.45">SC</text>

  <!-- FEET -->
  <ellipse cx="298" cy="710" rx="50" ry="26" fill="#100820" stroke="url(#rageGrad)" stroke-width="2.5"/>
  <ellipse cx="402" cy="710" rx="50" ry="26" fill="#100820" stroke="url(#rageGrad)" stroke-width="2.5"/>

  <!-- ARMS - raised/aggressive posture -->
  <ellipse cx="148" cy="380" rx="36" ry="58" fill="#100820" stroke="#ff3060" stroke-width="2.5" transform="rotate(-30,148,380)"/>
  <ellipse cx="552" cy="380" rx="36" ry="58" fill="#100820" stroke="#a855f7" stroke-width="2.5" transform="rotate(30,552,380)"/>

  </g><!-- end rotate group -->

  <!-- RAGE LIGHTNING - bigger, more chaotic, multiple directions -->
  <!-- Left cluster -->
  <path d="M 95,300 L 120,336 L 102,336 L 132,382" fill="none" stroke="#ff3060" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#zap3)"/>
  <path d="M 80,355 L 108,394 L 88,394 L 118,440" fill="none" stroke="#ff4080" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#zap3)" opacity="0.85"/>
  <path d="M 100,405 L 124,440 L 106,440 L 130,480" fill="none" stroke="#ff3060" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#zap3)" opacity="0.7"/>
  <path d="M 72,440 L 96,468 L 80,468 L 104,500" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" filter="url(#zap3)" opacity="0.6"/>
  <circle cx="68" cy="315" r="5" fill="#ff3060" filter="url(#zap3)"/>
  <circle cx="58" cy="370" r="3.5" fill="#ff4080" opacity="0.8"/>
  <circle cx="72" cy="450" r="3" fill="#a855f7" opacity="0.7"/>

  <!-- Right cluster -->
  <path d="M 605,300 L 580,336 L 598,336 L 568,382" fill="none" stroke="#a855f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#zap3)"/>
  <path d="M 620,355 L 592,394 L 612,394 L 582,440" fill="none" stroke="#8040d0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#zap3)" opacity="0.85"/>
  <path d="M 600,405 L 576,440 L 594,440 L 570,480" fill="none" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#zap3)" opacity="0.7"/>
  <path d="M 628,440 L 604,468 L 620,468 L 596,500" fill="none" stroke="#ff3060" stroke-width="3" stroke-linecap="round" filter="url(#zap3)" opacity="0.6"/>
  <circle cx="632" cy="315" r="5" fill="#a855f7" filter="url(#zap3)"/>
  <circle cx="642" cy="370" r="3.5" fill="#8040d0" opacity="0.8"/>
  <circle cx="628" cy="450" r="3" fill="#ff3060" opacity="0.7"/>

  <!-- Speed lines coming from body (leaning forward effect) -->
  <line x1="560" y1="200" x2="630" y2="188" stroke="#a855f7" stroke-width="2" opacity="0.3"/>
  <line x1="558" y1="215" x2="640" y2="210" stroke="#a855f7" stroke-width="1.5" opacity="0.2"/>
  <line x1="555" y1="232" x2="635" y2="230" stroke="#a855f7" stroke-width="1" opacity="0.15"/>

  <!-- WORDMARK -->
  <text x="350" y="796" text-anchor="middle" font-family="monospace" font-size="52" font-weight="bold"
        fill="white" letter-spacing="4">SHADOWCYPHER</text>
  <text x="350" y="838" text-anchor="middle" font-family="monospace" font-size="13"
        fill="url(#rageGrad)" letter-spacing="8" opacity="0.8">GHOST RAGE</text>
</svg>
