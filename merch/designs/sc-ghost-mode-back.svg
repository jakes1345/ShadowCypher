<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <filter id="scanGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#08081a"/>

  <!-- Subtle grid overlay -->
  <g opacity="0.06" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="750" x2="1200" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/><line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/><line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
  </g>

  <!-- Scan lines (horizontal, subtle) -->
  <g opacity="0.08" filter="url(#scanGlow)">
    <rect x="0" y="220" width="1200" height="2" fill="#00d4ff"/>
    <rect x="0" y="340" width="1200" height="2" fill="#00d4ff"/>
    <rect x="0" y="460" width="1200" height="2" fill="#00d4ff"/>
    <rect x="0" y="580" width="1200" height="2" fill="#00d4ff"/>
  </g>

  <!-- ── CCTV CAMERAS (3 cameras pointing inward at empty center) ── -->

  <!-- LEFT CAMERA — pointing right toward center -->
  <g transform="translate(140, 380)">
    <!-- Pole -->
    <rect x="18" y="0" width="8" height="180" fill="#1e1e3a"/>
    <!-- Arm -->
    <rect x="18" y="20" width="60" height="7" fill="#1e1e3a"/>
    <!-- Camera body -->
    <rect x="60" y="8" width="55" height="30" rx="5" fill="#a855f7"/>
    <!-- Lens -->
    <circle cx="118" cy="23" r="10" fill="#0c0c20" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="118" cy="23" r="5" fill="#00d4ff" opacity="0.6"/>
    <!-- Status light -->
    <circle cx="65" cy="13" r="3" fill="#00d4ff"/>
    <!-- Scan beam toward center -->
    <path d="M 118 23 L 400 350 L 400 310 Z" fill="#00d4ff" opacity="0.04"/>
  </g>

  <!-- RIGHT CAMERA — pointing left toward center -->
  <g transform="translate(1060, 380) scale(-1,1)">
    <rect x="18" y="0" width="8" height="180" fill="#1e1e3a"/>
    <rect x="18" y="20" width="60" height="7" fill="#1e1e3a"/>
    <rect x="60" y="8" width="55" height="30" rx="5" fill="#a855f7"/>
    <circle cx="118" cy="23" r="10" fill="#0c0c20" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="118" cy="23" r="5" fill="#00d4ff" opacity="0.6"/>
    <circle cx="65" cy="13" r="3" fill="#00d4ff"/>
    <path d="M 118 23 L 400 350 L 400 310 Z" fill="#00d4ff" opacity="0.04"/>
  </g>

  <!-- TOP CAMERA — pointing down toward center -->
  <g transform="translate(600, 60) rotate(90) translate(-22,-22)">
    <rect x="18" y="0" width="8" height="80" fill="#1e1e3a"/>
    <rect x="18" y="20" width="50" height="7" fill="#1e1e3a"/>
    <rect x="52" y="8" width="50" height="28" rx="5" fill="#a855f7"/>
    <circle cx="105" cy="22" r="9" fill="#0c0c20" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="105" cy="22" r="4" fill="#00d4ff" opacity="0.6"/>
    <circle cx="57" cy="12" r="3" fill="#00d4ff"/>
  </g>

  <!-- ── CENTER: EMPTY DETECTION ZONE ── -->
  <!-- Targeting reticle — center of scene -->
  <g transform="translate(600, 430)">
    <!-- Outer ring, broken circle suggesting failed lock -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#00d4ff" stroke-width="2"
      stroke-dasharray="40 20" opacity="0.5"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#a855f7" stroke-width="1.5"
      stroke-dasharray="20 10" opacity="0.6"/>
    <!-- Crosshair lines -->
    <line x1="-110" y1="0" x2="-55" y2="0" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
    <line x1="55"  y1="0" x2="110" y2="0" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-110" x2="0" y2="-55" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="55"  x2="0" y2="110"  stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
    <!-- Nothing inside — intentionally empty -->
  </g>

  <!-- ── HUD ERROR TEXT ── -->
  <!-- Main error -->
  <text x="600" y="290" text-anchor="middle"
    font-family="'Courier New', monospace" font-size="13" letter-spacing="4"
    fill="#00d4ff" opacity="0.7" filter="url(#scanGlow)">
    ◈ SURVEILLANCE ACTIVE · ALL SECTORS MONITORED ◈
  </text>

  <!-- TARGET NOT FOUND — big, glitchy -->
  <text x="600" y="600" text-anchor="middle"
    font-family="'Arial Black', Impact, sans-serif" font-size="52" font-weight="900"
    letter-spacing="6" fill="#a855f7" filter="url(#textGlow)">
    TARGET NOT FOUND
  </text>
  <!-- Glitch offset copy -->
  <text x="603" y="600" text-anchor="middle"
    font-family="'Arial Black', Impact, sans-serif" font-size="52" font-weight="900"
    letter-spacing="6" fill="#00d4ff" opacity="0.25">
    TARGET NOT FOUND
  </text>

  <text x="600" y="650" text-anchor="middle"
    font-family="'Courier New', monospace" font-size="18" letter-spacing="8"
    fill="#00d4ff" opacity="0.9" filter="url(#scanGlow)">
    IDENTITY UNKNOWN · NO BIOMETRIC MATCH
  </text>

  <!-- Error code line -->
  <text x="600" y="690" text-anchor="middle"
    font-family="'Courier New', monospace" font-size="11" letter-spacing="3"
    fill="#a855f7" opacity="0.5">
    ERR_0x4E4F4E45 · SC-GHOST-PROTOCOL-ACTIVE · v2.0.0
  </text>

  <!-- ── BOTTOM WORDMARK ── -->
  <line x1="200" y1="790" x2="1000" y2="790" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <text x="600" y="840" text-anchor="middle"
    font-family="'Arial Black', sans-serif" font-size="22" font-weight="900"
    letter-spacing="10" fill="#00d4ff" opacity="0.6">
    SHADOWCYPHER
  </text>
  <text x="600" y="868" text-anchor="middle"
    font-family="'Courier New', monospace" font-size="11" letter-spacing="4"
    fill="#a855f7" opacity="0.5">
    HE NEVER SLEEPS SO YOU CAN
  </text>
</svg>
