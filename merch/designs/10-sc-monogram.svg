<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800">
  <defs>
    <linearGradient id="g10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow10">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft10">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer circle ring -->
  <circle cx="350" cy="340" r="240" fill="none" stroke="url(#g10)" stroke-width="4" filter="url(#soft10)"/>
  <circle cx="350" cy="340" r="225" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>
  <circle cx="350" cy="340" r="208" fill="none" stroke="url(#g10)" stroke-width="1.5" opacity="0.35"/>

  <!-- Tick marks on outer ring -->
  <line x1="350" y1="100" x2="350" y2="116" stroke="#00d4ff" stroke-width="2.5" opacity="0.7"/>
  <line x1="350" y1="564" x2="350" y2="580" stroke="#00d4ff" stroke-width="2.5" opacity="0.7"/>
  <line x1="110" y1="340" x2="126" y2="340" stroke="#a855f7" stroke-width="2.5" opacity="0.7"/>
  <line x1="574" y1="340" x2="590" y2="340" stroke="#a855f7" stroke-width="2.5" opacity="0.7"/>
  <!-- Diagonal ticks -->
  <line x1="180" y1="170" x2="191" y2="181" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <line x1="520" y1="170" x2="509" y2="181" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
  <line x1="180" y1="510" x2="191" y2="499" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
  <line x1="520" y1="510" x2="509" y2="499" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>

  <!-- SC monogram - massive -->
  <text x="350" y="420" text-anchor="middle" font-family="monospace" font-size="220" font-weight="bold"
        fill="url(#g10)" filter="url(#glow10)">SC</text>

  <!-- Inner detail rings -->
  <circle cx="350" cy="340" r="140" fill="none" stroke="white" stroke-width="1" opacity="0.08"/>
  <circle cx="350" cy="340" r="80" fill="none" stroke="url(#g10)" stroke-width="1" opacity="0.2"/>

  <!-- Circuit dots at cardinal points -->
  <circle cx="350" cy="100" r="6" fill="#00d4ff" opacity="0.9" filter="url(#soft10)"/>
  <circle cx="590" cy="340" r="6" fill="#a855f7" opacity="0.9" filter="url(#soft10)"/>
  <circle cx="350" cy="580" r="6" fill="#00d4ff" opacity="0.9" filter="url(#soft10)"/>
  <circle cx="110" cy="340" r="6" fill="#a855f7" opacity="0.9" filter="url(#soft10)"/>

  <!-- Bottom wordmark -->
  <text x="350" y="666" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold"
        fill="white" letter-spacing="10">SHADOWCYPHER</text>
  <line x1="110" y1="680" x2="590" y2="680" stroke="url(#g10)" stroke-width="1.5" opacity="0.4"/>
  <text x="350" y="706" text-anchor="middle" font-family="monospace" font-size="11"
        fill="url(#g10)" letter-spacing="10" opacity="0.65">ENTERPRISE · SECURITY · SOVEREIGN</text>

  <!-- Small year mark -->
  <text x="350" y="755" text-anchor="middle" font-family="monospace" font-size="10"
        fill="white" letter-spacing="6" opacity="0.28">EST. 2025</text>
</svg>
