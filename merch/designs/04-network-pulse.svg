<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000">
  <defs>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft4">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Network node positions: center + 8 outer + ring of 14 -->
  <!-- Connection lines from center -->
  <line x1="450" y1="430" x2="180" y2="200" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
  <line x1="450" y1="430" x2="450" y2="120" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  <line x1="450" y1="430" x2="720" y2="200" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
  <line x1="450" y1="430" x2="820" y2="430" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  <line x1="450" y1="430" x2="720" y2="660" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
  <line x1="450" y1="430" x2="450" y2="740" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  <line x1="450" y1="430" x2="180" y2="660" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
  <line x1="450" y1="430" x2="80" y2="430" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>

  <!-- Outer node connections -->
  <line x1="180" y1="200" x2="450" y2="120" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="450" y1="120" x2="720" y2="200" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="720" y1="200" x2="820" y2="430" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="820" y1="430" x2="720" y2="660" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="720" y1="660" x2="450" y2="740" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="450" y1="740" x2="180" y2="660" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="180" y1="660" x2="80" y2="430" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="80" y1="430" x2="180" y2="200" stroke="white" stroke-width="1" opacity="0.15"/>

  <!-- Extra cross-connections -->
  <line x1="180" y1="200" x2="720" y2="660" stroke="#00d4ff" stroke-width="1" opacity="0.12"/>
  <line x1="720" y1="200" x2="180" y2="660" stroke="#a855f7" stroke-width="1" opacity="0.12"/>
  <line x1="80" y1="430" x2="820" y2="430" stroke="white" stroke-width="1" opacity="0.1"/>
  <line x1="450" y1="120" x2="450" y2="740" stroke="url(#g4)" stroke-width="1" opacity="0.15"/>

  <!-- Outer secondary nodes (small) -->
  <circle cx="310" cy="150" r="3" fill="#00d4ff" opacity="0.5"/>
  <circle cx="590" cy="150" r="3" fill="#a855f7" opacity="0.5"/>
  <circle cx="770" cy="310" r="3" fill="#00d4ff" opacity="0.5"/>
  <circle cx="800" cy="560" r="3" fill="#a855f7" opacity="0.5"/>
  <circle cx="600" cy="710" r="3" fill="#00d4ff" opacity="0.5"/>
  <circle cx="310" cy="710" r="3" fill="#a855f7" opacity="0.5"/>
  <circle cx="100" cy="560" r="3" fill="#00d4ff" opacity="0.5"/>
  <circle cx="130" cy="310" r="3" fill="#a855f7" opacity="0.5"/>

  <!-- Main outer nodes -->
  <circle cx="180" cy="200" r="9" fill="none" stroke="#00d4ff" stroke-width="2" filter="url(#soft4)"/>
  <circle cx="180" cy="200" r="4" fill="#00d4ff" opacity="0.9"/>
  <circle cx="450" cy="120" r="9" fill="none" stroke="#a855f7" stroke-width="2" filter="url(#soft4)"/>
  <circle cx="450" cy="120" r="4" fill="#a855f7" opacity="0.9"/>
  <circle cx="720" cy="200" r="9" fill="none" stroke="#00d4ff" stroke-width="2" filter="url(#soft4)"/>
  <circle cx="720" cy="200" r="4" fill="#00d4ff" opacity="0.9"/>
  <circle cx="820" cy="430" r="9" fill="none" stroke="#a855f7" stroke-width="2" filter="url(#soft4)"/>
  <circle cx="820" cy="430" r="4" fill="#a855f7" opacity="0.9"/>
  <circle cx="720" cy="660" r="9" fill="none" stroke="#00d4ff" stroke-width="2" filter="url(#soft4)"/>
  <circle cx="720" cy="660" r="4" fill="#00d4ff" opacity="0.9"/>
  <circle cx="450" cy="740" r="9" fill="none" stroke="#a855f7" stroke-width="2" filter="url(#soft4)"/>
  <circle cx="450" cy="740" r="4" fill="#a855f7" opacity="0.9"/>
  <circle cx="180" cy="660" r="9" fill="none" stroke="#00d4ff" stroke-width="2" filter="url(#soft4)"/>
  <circle cx="180" cy="660" r="4" fill="#00d4ff" opacity="0.9"/>
  <circle cx="80" cy="430" r="9" fill="none" stroke="#a855f7" stroke-width="2" filter="url(#soft4)"/>
  <circle cx="80" cy="430" r="4" fill="#a855f7" opacity="0.9"/>

  <!-- CENTER NODE - hub -->
  <circle cx="450" cy="430" r="55" fill="none" stroke="url(#g4)" stroke-width="3" filter="url(#glow4)"/>
  <circle cx="450" cy="430" r="42" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <circle cx="450" cy="430" r="28" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <!-- SC in center -->
  <text x="450" y="445" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold"
        fill="white">SC</text>

  <!-- WORDMARK -->
  <text x="450" y="850" text-anchor="middle" font-family="monospace" font-size="56" font-weight="bold"
        fill="white" letter-spacing="4">SHADOWCYPHER</text>
  <text x="450" y="895" text-anchor="middle" font-family="monospace" font-size="14"
        fill="url(#g4)" letter-spacing="8" opacity="0.7">NETWORK INTELLIGENCE</text>
  <line x1="150" y1="915" x2="750" y2="915" stroke="url(#g4)" stroke-width="1.5" opacity="0.35"/>
</svg>
