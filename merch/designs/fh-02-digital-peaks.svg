<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900">
  <!-- FH-02: DIGITAL PEAKS - Aurora sky + circuit-board mountain range + ghost at summit.
       Freshoodz nature energy translated to cyber. -->
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020210"/>
      <stop offset="35%" stop-color="#050228"/>
      <stop offset="65%" stop-color="#08043a"/>
      <stop offset="100%" stop-color="#040220"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00d4ff" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#00ff41" stop-opacity="0.08"/>
      <stop offset="80%" stop-color="#a855f7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.14"/>
      <stop offset="75%" stop-color="#00ff41" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mtnBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a082a"/>
      <stop offset="100%" stop-color="#060420"/>
    </linearGradient>
    <linearGradient id="mtnMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e0a30"/>
      <stop offset="100%" stop-color="#080618"/>
    </linearGradient>
    <linearGradient id="mtnFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10083a"/>
      <stop offset="100%" stop-color="#08060c"/>
    </linearGradient>
    <linearGradient id="cg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="auroraBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glowE2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="eyeE2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigAura2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="lineGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- SKY -->
  <rect width="700" height="900" fill="url(#sky2)"/>

  <!-- AURORA BOREALIS layers -->
  <ellipse cx="220" cy="180" rx="380" ry="90" fill="url(#aurora1)" filter="url(#auroraBlur)" opacity="0.9"/>
  <ellipse cx="480" cy="220" rx="340" ry="70" fill="url(#aurora2)" filter="url(#auroraBlur)" opacity="0.8"/>
  <ellipse cx="350" cy="140" rx="280" ry="55" fill="#00ff41" opacity="0.04" filter="url(#auroraBlur)"/>
  <ellipse cx="180" cy="260" rx="200" ry="45" fill="#00d4ff" opacity="0.05" filter="url(#auroraBlur)"/>
  <ellipse cx="520" cy="280" rx="180" ry="40" fill="#a855f7" opacity="0.06" filter="url(#auroraBlur)"/>

  <!-- STARS -->
  <circle cx="35"  cy="22"  r="1"   fill="#fff" opacity="0.7"/>
  <circle cx="94"  cy="48"  r="1.3" fill="#00d4ff" opacity="0.6"/>
  <circle cx="160" cy="18"  r="0.8" fill="#fff" opacity="0.65"/>
  <circle cx="228" cy="62"  r="1.1" fill="#a855f7" opacity="0.6"/>
  <circle cx="305" cy="28"  r="1.4" fill="#fff" opacity="0.75"/>
  <circle cx="378" cy="55"  r="0.9" fill="#00d4ff" opacity="0.55"/>
  <circle cx="448" cy="24"  r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="514" cy="50"  r="1"   fill="#a855f7" opacity="0.6"/>
  <circle cx="580" cy="30"  r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="646" cy="56"  r="0.9" fill="#00d4ff" opacity="0.6"/>
  <circle cx="68"  cy="80"  r="0.8" fill="#fff" opacity="0.55"/>
  <circle cx="138" cy="95"  r="1"   fill="#a855f7" opacity="0.5"/>
  <circle cx="210" cy="84"  r="1.2" fill="#fff" opacity="0.65"/>
  <circle cx="280" cy="100" r="0.7" fill="#00d4ff" opacity="0.5"/>
  <circle cx="340" cy="78"  r="1.1" fill="#fff" opacity="0.6"/>
  <circle cx="410" cy="96"  r="0.9" fill="#a855f7" opacity="0.55"/>
  <circle cx="478" cy="82"  r="1.3" fill="#fff" opacity="0.7"/>
  <circle cx="542" cy="102" r="0.8" fill="#00d4ff" opacity="0.5"/>
  <circle cx="610" cy="88"  r="1"   fill="#fff" opacity="0.65"/>
  <circle cx="672" cy="105" r="1.2" fill="#a855f7" opacity="0.6"/>

  <!-- ═══ BACK MOUNTAIN RANGE (circuit-board topology lines on peaks) ═══ -->
  <!-- Main back peaks - dark silhouette -->
  <path d="M 0,520 L 60,380 L 110,440 L 165,340 L 220,420 L 275,290 L 330,380 L 350,260 L 370,380 L 425,290 L 480,420 L 535,340 L 590,440 L 640,380 L 700,520 L 700,900 L 0,900 Z"
        fill="url(#mtnBack)"/>

  <!-- Circuit topology LINES on back mountains (Freshoodz detail treatment) -->
  <!-- Horizontal contour lines at different elevations -->
  <path d="M 20,490 L 90,490 L 105,470 L 140,470 L 165,450 L 200,450 L 230,430 L 260,430 L 290,400 L 350,360 L 410,400 L 440,430 L 470,430 L 500,450 L 535,450 L 560,470 L 595,470 L 610,490 L 680,490"
        fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 3"/>
  <path d="M 0,510 L 70,510 L 100,488 L 148,488 L 178,465 L 210,465 L 248,442 L 278,442 L 305,415 L 350,375 L 395,415 L 422,442 L 452,442 L 490,465 L 522,465 L 552,488 L 600,488 L 630,510 L 700,510"
        fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.18" stroke-dasharray="4 3"/>
  <!-- Circuit node dots at junctions -->
  <circle cx="165" cy="450" r="2.5" fill="#00d4ff" opacity="0.3"/>
  <circle cx="260" cy="430" r="2.5" fill="#00d4ff" opacity="0.3"/>
  <circle cx="350" cy="360" r="3.5" fill="#00d4ff" opacity="0.5" filter="url(#lineGlow2)"/>
  <circle cx="440" cy="430" r="2.5" fill="#00d4ff" opacity="0.3"/>
  <circle cx="535" cy="450" r="2.5" fill="#00d4ff" opacity="0.3"/>
  <!-- Vertical circuit traces on peaks -->
  <line x1="165" y1="340" x2="165" y2="450" stroke="#a855f7" stroke-width="0.8" opacity="0.15" stroke-dasharray="3 2"/>
  <line x1="275" y1="290" x2="275" y2="442" stroke="#00d4ff" stroke-width="0.8" opacity="0.15" stroke-dasharray="3 2"/>
  <line x1="350" y1="260" x2="350" y2="375" stroke="#00d4ff" stroke-width="1.2" opacity="0.25" filter="url(#lineGlow2)"/>
  <line x1="425" y1="290" x2="425" y2="442" stroke="#00d4ff" stroke-width="0.8" opacity="0.15" stroke-dasharray="3 2"/>
  <line x1="535" y1="340" x2="535" y2="450" stroke="#a855f7" stroke-width="0.8" opacity="0.15" stroke-dasharray="3 2"/>

  <!-- ═══ MID MOUNTAIN RANGE ═══ -->
  <path d="M 0,620 L 80,500 L 140,560 L 200,480 L 280,555 L 320,490 L 350,460 L 380,490 L 420,555 L 500,480 L 560,560 L 620,500 L 700,620 L 700,900 L 0,900 Z"
        fill="url(#mtnMid)"/>

  <!-- Circuit lines on mid range -->
  <path d="M 0,580 L 80,565 L 120,545 L 170,545 L 220,530 L 280,530 L 320,510 L 350,492 L 380,510 L 420,530 L 480,530 L 530,545 L 580,545 L 620,565 L 700,580"
        fill="none" stroke="#00d4ff" stroke-width="0.9" opacity="0.22"/>
  <path d="M 0,600 L 90,582 L 140,562 L 195,562 L 248,545 L 296,545 L 330,525 L 350,508 L 370,525 L 404,545 L 452,545 L 505,562 L 560,562 L 610,582 L 700,600"
        fill="none" stroke="#a855f7" stroke-width="0.9" opacity="0.18"/>
  <!-- Node dots mid range -->
  <circle cx="200" cy="480" r="3" fill="#a855f7" opacity="0.35" filter="url(#lineGlow2)"/>
  <circle cx="320" cy="490" r="3" fill="#00d4ff" opacity="0.4"/>
  <circle cx="350" cy="460" r="4" fill="#00d4ff" opacity="0.55" filter="url(#lineGlow2)"/>
  <circle cx="380" cy="490" r="3" fill="#00d4ff" opacity="0.4"/>
  <circle cx="500" cy="480" r="3" fill="#a855f7" opacity="0.35" filter="url(#lineGlow2)"/>
  <!-- Vertical traces mid -->
  <line x1="200" y1="480" x2="200" y2="545" stroke="#a855f7" stroke-width="1" opacity="0.18" stroke-dasharray="3 2"/>
  <line x1="350" y1="460" x2="350" y2="508" stroke="#00d4ff" stroke-width="1.5" opacity="0.3" filter="url(#lineGlow2)"/>
  <line x1="500" y1="480" x2="500" y2="545" stroke="#a855f7" stroke-width="1" opacity="0.18" stroke-dasharray="3 2"/>

  <!-- ═══ FOREGROUND MOUNTAIN / PEAK (ghost stands here) ═══ -->
  <path d="M 0,760 L 145,600 L 215,660 L 280,610 L 320,630 L 350,548 L 380,630 L 420,610 L 485,660 L 555,600 L 700,760 L 700,900 L 0,900 Z"
        fill="url(#mtnFront)"/>

  <!-- Circuit lines on fg mountain (brightest/most detailed) -->
  <path d="M 100,700 L 145,670 L 175,648 L 215,648 L 250,625 L 290,625 L 318,610 L 350,582 L 382,610 L 410,625 L 450,625 L 485,648 L 525,648 L 555,670 L 600,700"
        fill="none" stroke="#00d4ff" stroke-width="1.1" opacity="0.28" filter="url(#lineGlow2)"/>
  <path d="M 60,730 L 145,700 L 200,672 L 240,660 L 282,645 L 318,630 L 350,604 L 382,630 L 418,645 L 460,660 L 500,672 L 555,700 L 640,730"
        fill="none" stroke="#a855f7" stroke-width="1" opacity="0.22"/>
  <path d="M 30,755 L 145,725 L 215,700 L 268,685 L 310,668 L 340,652 L 350,636 L 360,652 L 390,668 L 432,685 L 485,700 L 555,725 L 670,755"
        fill="none" stroke="#00d4ff" stroke-width="0.9" opacity="0.18"/>
  <!-- Node dots fg (more prominent) -->
  <circle cx="280" cy="610" r="3.5" fill="#a855f7" opacity="0.45" filter="url(#lineGlow2)"/>
  <circle cx="320" cy="630" r="3"   fill="#00d4ff" opacity="0.4"/>
  <circle cx="350" cy="548" r="5"   fill="#00d4ff" opacity="0.7" filter="url(#lineGlow2)"/>
  <circle cx="380" cy="630" r="3"   fill="#00d4ff" opacity="0.4"/>
  <circle cx="420" cy="610" r="3.5" fill="#a855f7" opacity="0.45" filter="url(#lineGlow2)"/>
  <!-- Summit glow at the peak (where ghost stands) -->
  <ellipse cx="350" cy="548" rx="55" ry="22" fill="#00d4ff" opacity="0.08" filter="url(#bigAura2)"/>

  <!-- GHOST CHARACTER - standing at the summit peak -->
  <!-- Ghost aura -->
  <ellipse cx="350" cy="390" rx="105" ry="140" fill="#00d4ff" opacity="0.04" filter="url(#bigAura2)"/>

  <!-- Ghost body (scaled slightly smaller for scene) -->
  <path d="M 350,222 C 412,220 456,256 461,304 C 466,348 456,378 443,393 C 463,404 478,430 478,462 C 478,504 466,540 452,570 C 440,597 427,616 424,638 C 421,655 415,668 402,675 C 390,681 378,684 368,681 C 361,687 352,690 350,690 C 348,690 339,687 332,681 C 322,684 310,681 298,675 C 285,668 279,655 276,638 C 273,616 260,597 248,570 C 234,540 222,504 222,462 C 222,430 237,404 257,393 C 244,378 234,348 239,304 C 244,256 288,220 350,222 Z"
        fill="#0a0a1c"/>
  <!-- Ghost outline glow -->
  <path d="M 350,222 C 412,220 456,256 461,304 C 466,348 456,378 443,393 C 463,404 478,430 478,462 C 478,504 466,540 452,570 C 440,597 427,616 424,638 C 421,655 415,668 402,675 C 390,681 378,684 368,681 C 361,687 352,690 350,690 C 348,690 339,687 332,681 C 322,684 310,681 298,675 C 285,668 279,655 276,638 C 273,616 260,597 248,570 C 234,540 222,504 222,462 C 222,430 237,404 257,393 C 244,378 234,348 239,304 C 244,256 288,220 350,222 Z"
        fill="none" stroke="url(#cg2)" stroke-width="2.5" filter="url(#glowE2)" opacity="0.85"/>

  <!-- Hood dome -->
  <ellipse cx="350" cy="305" rx="106" ry="98" fill="#10102a" opacity="0.5"/>
  <!-- Hood point -->
  <path d="M 318,222 C 330,198 370,198 382,222 L 370,244 C 362,234 338,234 330,244 Z"
        fill="#121230" stroke="url(#cg2)" stroke-width="1.8"/>

  <!-- Face void -->
  <path d="M 284,255 C 276,255 262,268 260,293 C 258,323 268,358 288,370 L 412,370 C 432,358 442,323 440,293 C 438,268 424,255 416,255 Z"
        fill="#040408"/>

  <!-- EYES -->
  <rect x="274" y="308" width="96" height="32" rx="6" fill="#00d4ff" filter="url(#eyeE2)"/>
  <rect x="281" y="314" width="82" height="13" rx="3" fill="white" opacity="0.6"/>
  <rect x="330" y="308" width="96" height="32" rx="6" fill="#00d4ff" filter="url(#eyeE2)"/>
  <rect x="337" y="314" width="82" height="13" rx="3" fill="white" opacity="0.6"/>

  <!-- Arms -->
  <ellipse cx="208" cy="452" rx="26" ry="42" fill="#0a0a1c" stroke="#00d4ff" stroke-width="1.5" opacity="0.7" transform="rotate(-8,208,452)"/>
  <ellipse cx="492" cy="452" rx="26" ry="42" fill="#0a0a1c" stroke="#a855f7" stroke-width="1.5" opacity="0.7" transform="rotate(8,492,452)"/>

  <!-- ZAP bolts -->
  <path d="M 158,344 L 178,373 L 165,373 L 187,408" fill="none" stroke="#00d4ff" stroke-width="4" stroke-linecap="round" filter="url(#eyeE2)"/>
  <path d="M 542,344 L 522,373 L 535,373 L 513,408" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" filter="url(#eyeE2)"/>

  <!-- Ghost feet on summit -->
  <ellipse cx="320" cy="534" rx="40" ry="16" fill="#0c0c22" stroke="#a855f7" stroke-width="1.5" opacity="0.75"/>
  <ellipse cx="380" cy="534" rx="40" ry="16" fill="#0c0c22" stroke="#a855f7" stroke-width="1.5" opacity="0.75"/>

  <!-- WORDMARK -->
  <text x="350" y="838" text-anchor="middle" font-family="monospace" font-size="48" font-weight="bold"
        fill="white" letter-spacing="5" opacity="0.95">SHADOWCYPHER</text>
  <text x="350" y="875" text-anchor="middle" font-family="monospace" font-size="12"
        fill="url(#cg2)" letter-spacing="10" opacity="0.6">DIGITAL PEAKS</text>
</svg>
