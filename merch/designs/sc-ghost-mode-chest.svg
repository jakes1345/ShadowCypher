<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <!-- Eye glow: soft outer bloom + hard inner light -->
    <filter id="eyeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"  result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle hood edge rim light -->
    <filter id="rimLight" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#a855f7" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="#0a0a1a"/>

  <!-- ── CORNER SURVEILLANCE BRACKETS ── -->
  <!-- bracket arm thickness: 10px, arm length: 70px -->
  <!-- Top-left -->
  <rect x="80"  y="80"  width="70" height="10" fill="#00d4ff"/>
  <rect x="80"  y="80"  width="10" height="70" fill="#00d4ff"/>
  <!-- Top-right -->
  <rect x="650" y="80"  width="70" height="10" fill="#00d4ff"/>
  <rect x="710" y="80"  width="10" height="70" fill="#00d4ff"/>
  <!-- Bottom-left -->
  <rect x="80"  y="610" width="70" height="10" fill="#00d4ff"/>
  <rect x="80"  y="550" width="10" height="70" fill="#00d4ff"/>
  <!-- Bottom-right -->
  <rect x="650" y="610" width="70" height="10" fill="#00d4ff"/>
  <rect x="710" y="550" width="10" height="70" fill="#00d4ff"/>

  <!-- ── HOOD SHAPE (purple) ── -->
  <!-- Large outer hood: peaked top, wide draping sides, open face -->
  <path d="
    M 400 60
    C 340 60, 160 140, 120 260
    C 90  350, 100 460, 130 530
    L 200 560
    C 210 480, 230 420, 260 390
    C 290 360, 330 350, 360 355
    L 360 370
    C 320 375, 295 395, 275 430
    C 260 460, 255 490, 255 520
    L 545 520
    C 545 490, 540 460, 525 430
    C 505 395, 480 375, 440 370
    L 440 355
    C 470 350, 510 360, 540 390
    C 570 420, 590 480, 600 560
    L 670 530
    C 700 460, 710 350, 680 260
    C 640 140, 460 60, 400 60
    Z
  " fill="#7c3aed"/>

  <!-- Hood inner shadow layer (darker center gives depth) -->
  <path d="
    M 400 90
    C 355 90, 200 160, 170 270
    C 148 355, 158 445, 185 510
    L 220 530
    C 228 468, 248 415, 278 388
    C 300 368, 335 358, 365 360
    L 365 370
    C 336 374, 308 390, 290 418
    C 274 443, 268 475, 268 508
    L 532 508
    C 532 475, 526 443, 510 418
    C 492 390, 464 374, 435 370
    L 435 360
    C 465 358, 500 368, 522 388
    C 552 415, 572 468, 580 530
    L 615 510
    C 642 445, 652 355, 630 270
    C 600 160, 445 90, 400 90
    Z
  " fill="#6d28d9"/>

  <!-- Face void — pure shadow, no identity -->
  <ellipse cx="400" cy="430" rx="138" ry="120" fill="#050510"/>

  <!-- ── GLOWING EYES ── -->
  <!-- Left eye: angular almond, tilted inward -->
  <g filter="url(#eyeGlow)">
    <path d="M 308 412 L 355 400 L 360 418 L 355 432 L 308 420 Z" fill="#00d4ff"/>
  </g>
  <!-- Right eye: mirror -->
  <g filter="url(#eyeGlow)">
    <path d="M 492 412 L 445 400 L 440 418 L 445 432 L 492 420 Z" fill="#00d4ff"/>
  </g>
  <!-- Eye inner bright core -->
  <path d="M 315 413 L 350 404 L 354 418 L 350 428 L 315 419 Z" fill="#e0f9ff" opacity="0.7"/>
  <path d="M 485 413 L 450 404 L 446 418 L 450 428 L 485 419 Z" fill="#e0f9ff" opacity="0.7"/>

  <!-- ── HOOD DRAWSTRINGS (detail) ── -->
  <line x1="370" y1="508" x2="355" y2="560" stroke="#5b21b6" stroke-width="4" stroke-linecap="round"/>
  <line x1="430" y1="508" x2="445" y2="560" stroke="#5b21b6" stroke-width="4" stroke-linecap="round"/>

  <!-- ── GHOST MODE TEXT ── -->
  <text
    x="400" y="710"
    text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="72"
    font-weight="900"
    letter-spacing="8"
    fill="#00d4ff"
  >GHOST MODE</text>

  <!-- Thin rule under text -->
  <line x1="120" y1="730" x2="680" y2="730" stroke="#00d4ff" stroke-width="2" opacity="0.4"/>

  <!-- SC mark — small, bottom center -->
  <text
    x="400" y="790"
    text-anchor="middle"
    font-family="'Arial Black', sans-serif"
    font-size="18"
    font-weight="700"
    letter-spacing="6"
    fill="#a855f7"
    opacity="0.8"
  >SHADOWCYPHER</text>
</svg>
