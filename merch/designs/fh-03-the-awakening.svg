<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900">
  <!-- FH-03: THE AWAKENING - Ghost bursting up through a cracked data portal.
       Dark energy explosion, shattered ground, beam of light, cinematic. Freshoodz drama. -->
  <defs>
    <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020206"/>
      <stop offset="50%" stop-color="#040212"/>
      <stop offset="100%" stop-color="#080328"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00d4ff" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#00d4ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a081e"/>
      <stop offset="100%" stop-color="#040210"/>
    </linearGradient>
    <linearGradient id="crackGlow3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ghostG3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e0e28"/><stop offset="100%" stop-color="#06060e"/>
    </linearGradient>
    <filter id="bigBeam" x="-40%" y="-20%" width="180%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="crackGlowF" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ghostG3F" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="eyeG3" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigAura3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="shardBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="zapBlur3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="700" height="900" fill="url(#sky3)"/>

  <!-- STARS -->
  <circle cx="55"  cy="30"  r="1"   fill="#fff" opacity="0.6"/>
  <circle cx="128" cy="55"  r="1.2" fill="#00d4ff" opacity="0.5"/>
  <circle cx="200" cy="24"  r="0.8" fill="#fff" opacity="0.7"/>
  <circle cx="270" cy="48"  r="1.1" fill="#a855f7" opacity="0.55"/>
  <circle cx="344" cy="30"  r="1.4" fill="#fff" opacity="0.75"/>
  <circle cx="418" cy="52"  r="0.9" fill="#00d4ff" opacity="0.5"/>
  <circle cx="490" cy="28"  r="1.3" fill="#fff" opacity="0.65"/>
  <circle cx="560" cy="50"  r="1"   fill="#a855f7" opacity="0.55"/>
  <circle cx="628" cy="32"  r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="80"  cy="82"  r="0.9" fill="#00d4ff" opacity="0.45"/>
  <circle cx="155" cy="96"  r="1"   fill="#fff" opacity="0.6"/>
  <circle cx="230" cy="74"  r="1.1" fill="#a855f7" opacity="0.5"/>
  <circle cx="305" cy="90"  r="0.8" fill="#fff" opacity="0.55"/>
  <circle cx="380" cy="72"  r="1.3" fill="#00d4ff" opacity="0.5"/>
  <circle cx="455" cy="92"  r="0.9" fill="#fff" opacity="0.6"/>
  <circle cx="528" cy="76"  r="1.1" fill="#a855f7" opacity="0.55"/>
  <circle cx="598" cy="94"  r="1.2" fill="#fff" opacity="0.65"/>
  <circle cx="664" cy="78"  r="0.8" fill="#00d4ff" opacity="0.5"/>

  <!-- MAIN LIGHT BEAM shooting up from portal - the Freshoodz "light ray" moment -->
  <!-- Outer soft beam -->
  <polygon points="290,900 410,900 390,300 310,300" fill="url(#beamGrad)" filter="url(#bigBeam)" opacity="0.7"/>
  <!-- Inner brighter beam -->
  <polygon points="326,900 374,900 360,380 340,380" fill="#00d4ff" opacity="0.06" filter="url(#bigBeam)"/>
  <!-- Core beam line -->
  <line x1="350" y1="900" x2="350" y2="320" stroke="#00d4ff" stroke-width="3" opacity="0.15" filter="url(#bigBeam)"/>

  <!-- Side light rays (Freshoodz drama - rays exploding outward from source) -->
  <!-- Left rays -->
  <line x1="280" y1="640" x2="60"  y2="520" stroke="#00d4ff" stroke-width="1.5" opacity="0.12" filter="url(#shardBlur)"/>
  <line x1="285" y1="650" x2="20"  y2="600" stroke="#a855f7" stroke-width="1"   opacity="0.1"  filter="url(#shardBlur)"/>
  <line x1="278" y1="628" x2="80"  y2="440" stroke="#00d4ff" stroke-width="1.2" opacity="0.1"  filter="url(#shardBlur)"/>
  <line x1="290" y1="662" x2="40"  y2="700" stroke="#a855f7" stroke-width="1"   opacity="0.12" filter="url(#shardBlur)"/>
  <line x1="276" y1="640" x2="100" y2="350" stroke="#00d4ff" stroke-width="0.8" opacity="0.08"/>
  <!-- Right rays -->
  <line x1="420" y1="640" x2="640" y2="520" stroke="#a855f7" stroke-width="1.5" opacity="0.12" filter="url(#shardBlur)"/>
  <line x1="415" y1="650" x2="680" y2="600" stroke="#00d4ff" stroke-width="1"   opacity="0.1"  filter="url(#shardBlur)"/>
  <line x1="422" y1="628" x2="620" y2="440" stroke="#a855f7" stroke-width="1.2" opacity="0.1"  filter="url(#shardBlur)"/>
  <line x1="410" y1="662" x2="660" y2="700" stroke="#00d4ff" stroke-width="1"   opacity="0.12" filter="url(#shardBlur)"/>
  <line x1="424" y1="640" x2="600" y2="350" stroke="#a855f7" stroke-width="0.8" opacity="0.08"/>

  <!-- GROUND - cracked / shattered tiles (top-down perspective) -->
  <rect x="0" y="618" width="700" height="282" fill="url(#groundGrad)"/>

  <!-- Ground grid pattern -->
  <line x1="0"   y1="650" x2="700" y2="650" stroke="#a855f7" stroke-width="0.5" opacity="0.15"/>
  <line x1="0"   y1="680" x2="700" y2="680" stroke="#a855f7" stroke-width="0.5" opacity="0.12"/>
  <line x1="0"   y1="710" x2="700" y2="710" stroke="#a855f7" stroke-width="0.5" opacity="0.1"/>
  <line x1="0"   y1="740" x2="700" y2="740" stroke="#a855f7" stroke-width="0.5" opacity="0.08"/>
  <line x1="0"   y1="770" x2="700" y2="770" stroke="#a855f7" stroke-width="0.5" opacity="0.06"/>
  <line x1="0"   y1="800" x2="700" y2="800" stroke="#a855f7" stroke-width="0.5" opacity="0.05"/>
  <line x1="100" y1="618" x2="100" y2="900" stroke="#00d4ff" stroke-width="0.5" opacity="0.1"/>
  <line x1="200" y1="618" x2="200" y2="900" stroke="#00d4ff" stroke-width="0.5" opacity="0.1"/>
  <line x1="300" y1="618" x2="300" y2="900" stroke="#00d4ff" stroke-width="0.5" opacity="0.1"/>
  <line x1="400" y1="618" x2="400" y2="900" stroke="#00d4ff" stroke-width="0.5" opacity="0.1"/>
  <line x1="500" y1="618" x2="500" y2="900" stroke="#00d4ff" stroke-width="0.5" opacity="0.1"/>
  <line x1="600" y1="618" x2="600" y2="900" stroke="#00d4ff" stroke-width="0.5" opacity="0.1"/>

  <!-- PORTAL CRACK in ground where ghost emerged -->
  <!-- Glowing ellipse portal -->
  <ellipse cx="350" cy="632" rx="140" ry="35" fill="#00d4ff" opacity="0.15" filter="url(#bigAura3)"/>
  <ellipse cx="350" cy="632" rx="100" ry="24" fill="#00d4ff" opacity="0.25" filter="url(#crackGlowF)"/>
  <ellipse cx="350" cy="632" rx="70"  ry="16" fill="#00d4ff" opacity="0.4"  filter="url(#crackGlowF)"/>
  <ellipse cx="350" cy="632" rx="40"  ry="9"  fill="white"  opacity="0.3"/>

  <!-- Crack lines radiating from portal -->
  <path d="M 350,632 L 270,618" fill="none" stroke="url(#crackGlow3)" stroke-width="2" filter="url(#crackGlowF)" opacity="0.7"/>
  <path d="M 350,632 L 220,648" fill="none" stroke="url(#crackGlow3)" stroke-width="1.5" filter="url(#crackGlowF)" opacity="0.5"/>
  <path d="M 350,632 L 180,620" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  <path d="M 350,632 L 430,618" fill="none" stroke="url(#crackGlow3)" stroke-width="2" filter="url(#crackGlowF)" opacity="0.7"/>
  <path d="M 350,632 L 480,648" fill="none" stroke="url(#crackGlow3)" stroke-width="1.5" filter="url(#crackGlowF)" opacity="0.5"/>
  <path d="M 350,632 L 520,622" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
  <path d="M 350,632 L 310,680" fill="none" stroke="url(#crackGlow3)" stroke-width="1.5" filter="url(#crackGlowF)" opacity="0.5"/>
  <path d="M 350,632 L 390,680" fill="none" stroke="url(#crackGlow3)" stroke-width="1.5" filter="url(#crackGlowF)" opacity="0.5"/>
  <path d="M 350,632 L 240,670" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.35"/>
  <path d="M 350,632 L 460,670" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.35"/>
  <!-- Sub-cracks branching -->
  <path d="M 285,624 L 250,615" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>
  <path d="M 285,624 L 265,640" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>
  <path d="M 415,624 L 450,615" fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.3"/>
  <path d="M 415,624 L 435,640" fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.3"/>

  <!-- ENERGY SHARDS / debris floating around portal -->
  <!-- These are angular fragments of the broken ground -->
  <polygon points="240,600 258,590 265,608 246,615" fill="#0c0a28" stroke="#00d4ff" stroke-width="1.2" filter="url(#crackGlowF)" opacity="0.8"/>
  <polygon points="180,595 200,582 208,602 185,612" fill="#0a081e" stroke="#a855f7" stroke-width="1" opacity="0.7"/>
  <polygon points="440,590 460,582 465,602 444,610" fill="#0c0a28" stroke="#a855f7" stroke-width="1.2" filter="url(#crackGlowF)" opacity="0.8"/>
  <polygon points="500,596 518,584 526,606 506,614" fill="#0a081e" stroke="#00d4ff" stroke-width="1" opacity="0.7"/>
  <polygon points="148,610 162,598 170,618 154,626" fill="#0c0a28" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
  <polygon points="535,608 550,596 558,618 542,626" fill="#0c0a28" stroke="#a855f7" stroke-width="1" opacity="0.6"/>

  <!-- Small floating particles -->
  <circle cx="195" cy="580" r="4" fill="#00d4ff" opacity="0.5" filter="url(#zapBlur3)"/>
  <circle cx="158" cy="562" r="3" fill="#a855f7" opacity="0.45" filter="url(#zapBlur3)"/>
  <circle cx="118" cy="548" r="2.5" fill="#00d4ff" opacity="0.4"/>
  <circle cx="508" cy="576" r="4" fill="#a855f7" opacity="0.5" filter="url(#zapBlur3)"/>
  <circle cx="544" cy="558" r="3" fill="#00d4ff" opacity="0.45" filter="url(#zapBlur3)"/>
  <circle cx="582" cy="542" r="2.5" fill="#a855f7" opacity="0.4"/>
  <circle cx="230" cy="555" r="3.5" fill="#00ff41" opacity="0.4" filter="url(#zapBlur3)"/>
  <circle cx="470" cy="555" r="3.5" fill="#00ff41" opacity="0.4" filter="url(#zapBlur3)"/>
  <circle cx="284" cy="540" r="2"   fill="#00d4ff" opacity="0.45"/>
  <circle cx="416" cy="540" r="2"   fill="#a855f7" opacity="0.45"/>

  <!-- GHOST CHARACTER - emerging upward, very dramatic, larger -->
  <!-- Massive ghost aura/halo -->
  <ellipse cx="350" cy="370" rx="170" ry="200" fill="#00d4ff" opacity="0.05" filter="url(#bigAura3)"/>
  <ellipse cx="350" cy="400" rx="120" ry="150" fill="#a855f7" opacity="0.05" filter="url(#bigAura3)"/>

  <!-- Ghost body - LARGE, heroic -->
  <path d="M 350,108 C 438,106 500,152 507,222 C 514,284 500,330 480,350 C 508,365 530,402 530,445 C 530,500 514,550 496,590 C 480,628 462,652 458,682 C 455,705 447,722 428,732 C 412,740 395,745 382,740 C 374,749 362,754 350,754 C 338,754 326,749 318,740 C 305,745 288,740 272,732 C 253,722 245,705 242,682 C 238,652 220,628 204,590 C 186,550 170,500 170,445 C 170,402 192,365 220,350 C 200,330 186,284 193,222 C 200,152 262,106 350,108 Z"
        fill="url(#ghostG3)"/>

  <!-- Ghost glow outline -->
  <path d="M 350,108 C 438,106 500,152 507,222 C 514,284 500,330 480,350 C 508,365 530,402 530,445 C 530,500 514,550 496,590 C 480,628 462,652 458,682 C 455,705 447,722 428,732 C 412,740 395,745 382,740 C 374,749 362,754 350,754 C 338,754 326,749 318,740 C 305,745 288,740 272,732 C 253,722 245,705 242,682 C 238,652 220,628 204,590 C 186,550 170,500 170,445 C 170,402 192,365 220,350 C 200,330 186,284 193,222 C 200,152 262,106 350,108 Z"
        fill="none" stroke="url(#crackGlow3)" stroke-width="3" filter="url(#ghostG3F)" opacity="0.9"/>

  <!-- Hood dome -->
  <ellipse cx="350" cy="228" rx="138" ry="126" fill="#12122e" opacity="0.55"/>

  <!-- Hood point - sharp and dramatic -->
  <path d="M 312,108 C 326,78 374,78 388,108 L 374,134 C 365,120 335,120 326,134 Z"
        fill="#141436" stroke="url(#crackGlow3)" stroke-width="2.5" filter="url(#ghostG3F)"/>

  <!-- Face void -->
  <path d="M 268,172 C 258,172 240,190 238,224 C 236,264 250,316 274,332 L 426,332 C 450,316 464,264 462,224 C 460,190 442,172 432,172 Z"
        fill="#030308"/>

  <!-- Visor line (dramatic) -->
  <path d="M 244,252 L 268,238 L 350,230 L 432,238 L 456,252"
        fill="none" stroke="#a855f7" stroke-width="2" opacity="0.45"/>

  <!-- EYES - HUGE, DOMINANT. The awakening = fully activated -->
  <rect x="252" y="260" width="120" height="44" rx="8" fill="#00d4ff" filter="url(#eyeG3)"/>
  <rect x="261" y="268" width="102" height="19" rx="5" fill="white" opacity="0.65"/>
  <rect x="258" y="262" width="110" height="11" rx="4" fill="white" opacity="0.2"/>

  <rect x="328" y="260" width="120" height="44" rx="8" fill="#00d4ff" filter="url(#eyeG3)"/>
  <rect x="337" y="268" width="102" height="19" rx="5" fill="white" opacity="0.65"/>
  <rect x="334" y="262" width="110" height="11" rx="4" fill="white" opacity="0.2"/>

  <!-- SC chest badge (faint, doesn't fight eyes) -->
  <path d="M 322,430 L 350,410 L 378,430 L 367,462 L 350,476 L 333,462 Z"
        fill="none" stroke="url(#crackGlow3)" stroke-width="1.8" opacity="0.35"/>
  <text x="350" y="449" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold"
        fill="url(#crackGlow3)" opacity="0.38">SC</text>

  <!-- Arms - raised dramatically (emergence) -->
  <ellipse cx="150" cy="395" rx="32" ry="58" fill="#0c0c22" stroke="#00d4ff" stroke-width="2" opacity="0.8" transform="rotate(-22,150,395)" filter="url(#zapBlur3)"/>
  <ellipse cx="550" cy="395" rx="32" ry="58" fill="#0c0c22" stroke="#a855f7" stroke-width="2" opacity="0.8" transform="rotate(22,550,395)" filter="url(#zapBlur3)"/>

  <!-- MASSIVE ZAP LIGHTNING from the awakening -->
  <!-- Left cluster -->
  <path d="M 95,305 L 124,350 L 105,350 L 138,405" fill="none" stroke="#00d4ff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#eyeG3)"/>
  <path d="M 75,355 L 105,402 L 84,402 L 118,458" fill="none" stroke="#00d4ff" stroke-width="4.5" stroke-linecap="round" filter="url(#zapBlur3)" opacity="0.85"/>
  <path d="M 56,415 L 84,454 L 66,454 L 96,498" fill="none" stroke="#00d4ff" stroke-width="3.5" stroke-linecap="round" filter="url(#zapBlur3)" opacity="0.7"/>
  <!-- Right cluster -->
  <path d="M 605,305 L 576,350 L 595,350 L 562,405" fill="none" stroke="#a855f7" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#eyeG3)"/>
  <path d="M 625,355 L 595,402 L 616,402 L 582,458" fill="none" stroke="#a855f7" stroke-width="4.5" stroke-linecap="round" filter="url(#zapBlur3)" opacity="0.85"/>
  <path d="M 644,415 L 616,454 L 634,454 L 604,498" fill="none" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" filter="url(#zapBlur3)" opacity="0.7"/>

  <!-- Energy particles erupting -->
  <circle cx="120" cy="288" r="6" fill="#00d4ff" opacity="0.65" filter="url(#eyeG3)"/>
  <circle cx="88"  cy="265" r="4" fill="#00ff41" opacity="0.55" filter="url(#zapBlur3)"/>
  <circle cx="145" cy="262" r="3" fill="#00d4ff" opacity="0.5"/>
  <circle cx="580" cy="288" r="6" fill="#a855f7" opacity="0.65" filter="url(#eyeG3)"/>
  <circle cx="612" cy="265" r="4" fill="#00ff41" opacity="0.55" filter="url(#zapBlur3)"/>
  <circle cx="555" cy="262" r="3" fill="#a855f7" opacity="0.5"/>
  <circle cx="350" cy="120" r="5" fill="#00d4ff" opacity="0.55" filter="url(#eyeG3)"/>
  <circle cx="310" cy="108" r="3" fill="#a855f7" opacity="0.5"/>
  <circle cx="390" cy="108" r="3" fill="#a855f7" opacity="0.5"/>

  <!-- WORDMARK at bottom -->
  <text x="350" y="838" text-anchor="middle" font-family="monospace" font-size="48" font-weight="bold"
        fill="white" letter-spacing="5" opacity="0.95">SHADOWCYPHER</text>
  <text x="350" y="875" text-anchor="middle" font-family="monospace" font-size="12"
        fill="url(#crackGlow3)" letter-spacing="10" opacity="0.65">THE AWAKENING</text>
</svg>
