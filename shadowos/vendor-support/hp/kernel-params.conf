# HP EliteBook/ProBook Kernel Parameters
# Optimized for enterprise HP hardware and business workloads
# Last Updated: 2026-07-06

[cpu]
# HP systems: Intel Core/Xeon
cpu_governor=schedutil
cpu_max_freq=3800000
cpu_min_freq=800000
cpu_freq_step=100000
intel_pstate_mode=passive

[io]
# HP SSD configurations
io_scheduler=mq-deadline
disk_readahead=256

[memory]
# Memory management
vm_swappiness=10
vm_dirty_ratio=15
vm_dirty_background_ratio=5
vm_compact_memory=1

[power]
# Power management for HP Elitebook
battery_charge_start=20
battery_charge_stop=80
idle_state=max
pci_power_save=1
usb_autosuspend=1

[thermal]
# HP thermal management
fan_control_mode=0
passive_thermal_trip=85
critical_temp=100

[security]
selinux_mode=enforcing
apparmor_enabled=1
yama_ptrace_scope=2
kernel_ptr_restrict=2
kernel_dmesg_restrict=1
kernel_sysrq=0

[network]
net_ipv4_tcp_syncookies=1
net_ipv4_tcp_timestamps=0
net_ipv4_conf_all_accept_redirects=0
net_ipv4_conf_all_send_redirects=0
net_ipv4_conf_all_log_martians=1

[display]
display_dpms_enabled=1
display_blank_timeout=300

[hp_specific]
# HP Sure Start secure boot
hp_surestart_compatible=1
# HP QuickDrop (not used, disable)
hp_quickdrop_enabled=0
