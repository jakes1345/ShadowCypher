# ASUS ProBook/VivoBook/ROG Kernel Parameters
# Optimized for ASUS-specific hardware and gaming/professional workloads
# Last Updated: 2026-07-06

[cpu]
# ASUS systems: Intel Core/Xeon or AMD Ryzen
cpu_governor=schedutil
cpu_max_freq=4000000
cpu_min_freq=800000
cpu_freq_step=100000
intel_pstate_mode=passive

[io]
# ASUS SSD configurations
io_scheduler=mq-deadline
disk_readahead=256

[memory]
# Memory management
vm_swappiness=10
vm_dirty_ratio=15
vm_dirty_background_ratio=5
vm_compact_memory=1

[power]
# Power management tuning
battery_charge_start=20
battery_charge_stop=80
idle_state=max
pci_power_save=1
usb_autosuspend=1

[thermal]
# ASUS thermal management (critical for gaming laptops)
fan_control_mode=0
passive_thermal_trip=80
critical_temp=100

[security]
selinux_mode=enforcing
apparmor_enabled=1
yama_ptrace_scope=2
kernel_ptr_restrict=2
kernel_dmesg_restrict=1
kernel_sysrq=0

[network]
net_ipv4_tcp_syncookies=1
net_ipv4_tcp_timestamps=0
net_ipv4_conf_all_accept_redirects=0
net_ipv4_conf_all_send_redirects=0
net_ipv6_conf_all_use_tempaddr=2

[display]
display_dpms_enabled=1
display_blank_timeout=300

[asus_specific]
# ASUS ROG/Gaming laptop specific tuning
# Allow higher power limits for gaming
turbo_power_limit=150  # Watts
# Multi-color LED support
led_multi_color=1
# GPU switching (optimus)
gpu_switching=dynamic
