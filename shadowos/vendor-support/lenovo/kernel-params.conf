# Lenovo ThinkPad/ThinkStation Kernel Parameters
# Optimized for security, stability, and battery life
# Last Updated: 2026-07-06

[cpu]
# CPU scaling configuration
# schedutil provides dynamic frequency scaling based on kernel scheduler
cpu_governor=schedutil
# ThinkPad typical max turbo frequency (3.6-4.0 GHz on modern platforms)
cpu_max_freq=3800000
# Minimum frequency for power saving (0.8-1.0 GHz)
cpu_min_freq=800000
# CPU frequency step: 100 MHz increments
cpu_freq_step=100000
# Intel P-State mode (active on modern Intel CPUs)
intel_pstate_mode=passive
# Allow frequency scaling on all CPUs
cpu_freq_scaling_all=1

[io]
# I/O scheduler configuration
# mq-deadline: Good for SSD with low latency
io_scheduler=mq-deadline
# Disk readahead: 256 KB (balance between performance and memory)
disk_readahead=256

[memory]
# Memory management tuning
# Lower swappiness favors keeping data in RAM
vm_swappiness=15
# Dirty page writeback threshold (%)
vm_dirty_ratio=15
vm_dirty_background_ratio=5
# Filesystem cache drop interval
vm_drop_caches=0
# Memory compaction: 0=disabled, 1=proactive, 2=deferred
vm_compact_memory=1

[power]
# Power management for ThinkPads
# Battery charge thresholds (ThinkPad battery management)
battery_charge_start=20
battery_charge_stop=80
# CPU idle states: allow deep sleep states
idle_state=max
# PCI power management
pci_power_save=1
# USB autosuspend: allow USB power saving
usb_autosuspend=1

[thermal]
# Thermal management tuning
# Fan speed control: 0=BIOS, 1=OS control
fan_control_mode=0
# Passive thermal zone: conservative temperature target
passive_thermal_trip=85
# Critical shutdown temperature (prevents hardware damage)
critical_temp=100

[security]
# Security-focused kernel parameters
# SELinux mode: enforcing, permissive
selinux_mode=enforcing
# AppArmor: enable when SELinux not used
apparmor_enabled=1
# SMACK: SimpleMAC when SELinux conflicts
smack_enabled=0
# Yama ptrace scope: restrict process tracing (1=ptrace only own/children)
yama_ptrace_scope=2
# kptr_restrict: restrict kernel pointer exposure in /proc
kernel_ptr_restrict=2
# dmesg_restrict: restrict access to kernel logs
kernel_dmesg_restrict=1
# Disable SysRq for production systems (security concern)
kernel_sysrq=0

[network]
# Network security parameters
# TCP SYN cookies: protect against SYN flood attacks
net_ipv4_tcp_syncookies=1
# TCP timestamps: privacy vs connection quality tradeoff
net_ipv4_tcp_timestamps=0
# Disable ICMP redirects (security)
net_ipv4_conf_all_accept_redirects=0
# Send redirects (disabled for security)
net_ipv4_conf_all_send_redirects=0
# Log martians (suspicious packets)
net_ipv4_conf_all_log_martians=1
# IPv6 privacy extensions
net_ipv6_conf_all_use_tempaddr=2

[display]
# Display power management
# DPMS (Display Power Management Signaling): enable screen blanking
display_dpms_enabled=1
# Screen blank timeout: 300 seconds (5 minutes)
display_blank_timeout=300

[audit]
# Audit logging configuration
# Enable audit subsystem
audit_enabled=1
# Audit backlog limit
audit_backlog_limit=8192
# Audit rate limit per second
audit_rate_limit=0

[filesystem]
# Filesystem security
# File access control lists (ACL)
fs_acl_enabled=1
# Extended attributes for security labels
fs_xattr_security=1
# File capabilities
fs_capabilities_enabled=1

[virtualization]
# Virtualization support (KVM on ThinkStation)
# Nested virtualization: disabled for security
kvm_nested_virt=0
# Unrestricted guest mode: allow nested paging
kvm_unrestricted_guest=1
