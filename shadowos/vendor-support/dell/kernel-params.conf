# Dell Latitude/XPS/PowerEdge Kernel Parameters
# Optimized for enterprise-class hardware and reliability
# Last Updated: 2026-07-06

[cpu]
# Dell systems use Intel Xeon or Core processors
cpu_governor=schedutil
cpu_max_freq=3800000
cpu_min_freq=800000
cpu_freq_step=100000
intel_pstate_mode=passive

[io]
# Enterprise SSD configurations
io_scheduler=mq-deadline
disk_readahead=256

[memory]
# Memory management for Dell workstations
vm_swappiness=10
vm_dirty_ratio=10
vm_dirty_background_ratio=3
vm_compact_memory=1

[power]
# Dell Latitude battery management
battery_charge_start=20
battery_charge_stop=80
idle_state=max
pci_power_save=1
usb_autosuspend=1

[thermal]
# Dell thermal management (sensitive to throttling)
fan_control_mode=0
passive_thermal_trip=85
critical_temp=100

[security]
selinux_mode=enforcing
apparmor_enabled=1
yama_ptrace_scope=2
kernel_ptr_restrict=2
kernel_dmesg_restrict=1
kernel_sysrq=0

[network]
net_ipv4_tcp_syncookies=1
net_ipv4_tcp_timestamps=0
net_ipv4_conf_all_accept_redirects=0
net_ipv4_conf_all_send_redirects=0
net_ipv4_conf_all_log_martians=1
net_ipv6_conf_all_use_tempaddr=2

[display]
display_dpms_enabled=1
display_blank_timeout=300

[audit]
audit_enabled=1
audit_backlog_limit=8192
audit_rate_limit=0

[filesystem]
fs_acl_enabled=1
fs_xattr_security=1
fs_capabilities_enabled=1

[virtualization]
kvm_nested_virt=0
kvm_unrestricted_guest=1

[dell_specific]
# Dell-specific power management
# iDRAC (integrated Dell Remote Access Controller) compatibility
idrac_power_management=1
# Dell PERC RAID controller tuning (PowerEdge)
raid_write_cache=writeback
