# Legacy BIOS Boot Configuration
# Traditional BIOS boot settings for older systems
# Compatible with systems using Master Boot Record (MBR) or GPT with BIOS mode

# Boot loader
LOADER=grub2
FIRMWARE_INTERFACE=bios
BOOT_MODE=legacy

# GRUB installation location
GRUB_INSTALL_PATH=/boot/grub
GRUB_MODULES_PATH=/usr/lib/grub/i386-pc
GRUB_CONFIG=/boot/grub/grub.cfg

# Boot partition (optional, can be part of root)
BOOT_PARTITION=/dev/sda1
BOOT_MOUNT_POINT=/boot
BOOT_FSTYPE=ext4
BOOT_MOUNT_OPTIONS=defaults,noatime

# MBR and bootloader settings
MBR_LOCATION=/dev/sda
INSTALL_TO_MBR=yes
INSTALL_GRUB_LEGACY_FALLBACK=yes

# BIOS boot partition (for GPT systems)
BIOS_BOOT_PARTITION_SIZE=1M
BIOS_BOOT_PARTITION_TYPE=ef02

# Kernel image locations
KERNEL_IMAGE=/boot/vmlinuz
INITRAMFS_IMAGE=/boot/initramfs.img

# Boot menu configuration
TIMEOUT=10
DEFAULT_ENTRY=0
HIDDEN_MENU=0
