# UEFI Boot Configuration
# Unified Extensible Firmware Interface (UEFI) boot settings for modern systems
# Compatible with systems built after 2010

# Boot loader
LOADER=systemd-boot
FIRMWARE_INTERFACE=uefi
BOOT_MODE=uefi

# EFI System Partition (ESP) mounting
ESP_MOUNT_POINT=/boot/efi
ESP_FSTYPE=vfat
ESP_MOUNT_OPTIONS=defaults,noatime

# Bootloader configuration
SYSTEMD_BOOT_ENTRIES=/boot/efi/loader/entries
SYSTEMD_BOOT_DEFAULT=shadowos.conf

# UEFI variables and secure boot preparation
UEFI_VARS_ENABLED=yes
SECURE_BOOT_CAPABLE=yes

# Kernel image locations
KERNEL_IMAGE_EFI=/boot/efi/EFI/shadowos/vmlinuz.efi
INITRAMFS_IMAGE=/boot/initramfs.img

# Platform-specific boot options
TIMEOUT=10
CONSOLE_MODE=max
GRAPHICS_MODE=auto
