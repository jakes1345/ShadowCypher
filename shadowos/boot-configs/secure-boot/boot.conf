# Secure Boot Configuration
# UEFI Secure Boot settings for verified kernel and bootloader execution

# Boot mode with Secure Boot
FIRMWARE_INTERFACE=uefi
BOOT_MODE=uefi
SECURE_BOOT_ENABLED=yes

# Bootloader configuration
LOADER=systemd-boot
SYSTEMD_BOOT_ENTRIES=/boot/efi/loader/entries
SYSTEMD_BOOT_DEFAULT=shadowos.conf

# Signing configuration
SECURE_BOOT_MODE=custom
MOK_SUBJECT_CN=ShadowOS Local Boot
MOK_ISSUER=ShadowCypher Security
MOK_VALIDITY_DAYS=3650

# Key locations
MOK_KEY_PATH=/etc/secureboot/shadowos.key
MOK_CERT_PATH=/etc/secureboot/shadowos.crt
MOK_PEM_PATH=/etc/secureboot/shadowos.pem

# EFI variables for Secure Boot
SECURE_BOOT_DB=/sys/firmware/efi/efivars/PK
SECURE_BOOT_KEK=/sys/firmware/efi/efivars/KEK
SECURE_BOOT_DBAUTH=/sys/firmware/efi/efivars/db

# Kernel signing
SIGN_KERNEL=yes
SIGN_BOOTLOADER=yes
SIGN_INITRAMFS=yes

# Verification settings
VERIFY_SIGNATURES=yes
REQUIRE_SIGNED_KERNEL=yes
REQUIRE_SIGNED_BOOTLOADER=yes

# EFI System Partition settings
ESP_MOUNT_POINT=/boot/efi
ESP_FSTYPE=vfat
SIGNED_KERNEL_IMAGE=/boot/efi/EFI/shadowos/vmlinuz.efi.signed
SIGNED_INITRAMFS=/boot/efi/EFI/shadowos/initramfs.img.signed
