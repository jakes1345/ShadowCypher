# TPM 2.0 Boot Configuration
# Trusted Platform Module integration for measured boot and attestation

# Boot mode
FIRMWARE_INTERFACE=uefi
BOOT_MODE=uefi
TPM_MODE=tpm20

# TPM Device Configuration
TPM_DEVICE=/dev/tpm0
TPM_DEVICE_TYPE=crb
TPM_COMMAND_INTERFACE=fifo

# Measured Boot Configuration
MEASURED_BOOT_ENABLED=yes
TPM_EVENTLOG_PATH=/sys/kernel/debug/tpm0/eventlog
TPM_EVENTLOG_FORMAT=tcg

# PCR (Platform Configuration Register) Configuration
# PCR indices for measured boot:
PCR_FIRMWARE=0         # BIOS/Firmware configuration
PCR_CONFIG=1           # BIOS/Firmware configuration options
PCR_BOOTLOADER=2       # Bootloader
PCR_BOOT_CONFIG=3      # Boot configuration
PCR_GPT=5              # GPT partition table
PCR_KERNEL=9           # Kernel (IMA extended PCR)
PCR_KERNEL_CMDLINE=10  # Kernel command line

# TPM-based Key Storage
TPM_KEY_STORAGE=yes
TPM_KEY_SEAL_PCR=9,10  # Seal keys to kernel and cmdline measurements

# Attestation Configuration
ATTESTATION_ENABLED=yes
ATTESTATION_SERVER=shadowcypher-attestation.local
ATTESTATION_PORT=9090

# IMA and EVM Configuration
IMA_ENABLED=yes
IMA_POLICY=tcb
EVM_ENABLED=yes
EVM_ALGORITHM=sha256

# TPM NV (Non-Volatile) Storage
TPM_NV_ENABLED=yes
TPM_NV_INDICES=0x1000001,0x1000002

# TPM Logging
TPM_LOG_ENABLED=yes
TPM_LOG_FILE=/var/log/tpm/tpm-event.log
TPM_AUDIT_ENABLED=yes
