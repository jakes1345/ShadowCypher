# Calamares packages module.
# Note: unpackfs already copies everything from the live ISO, so ALL ISO
# packages are present on the installed system before this module runs.
# This module's job is to:
#   - Install packages NOT on the ISO (AUR/Chaotic extras by profile)
#   - Run the autologin-removal pre-script so SDDM requires a password
#
# Profile-specific package sets are in netinstall.yaml.

backend: pacman

operations:
  - install:
      pre-script: |
        # Remove live-session autologin — installed system must use password
        sed -i '/^User=shadow$/d; /^Session=hyprland\.desktop$/d' \
            /etc/sddm.conf.d/shadowos.conf 2>/dev/null || true
        # Refresh package databases
        pacman -Sy --noconfirm 2>/dev/null || true
      packages: []

  - remove:
      packages: []
