# Calamares packages module — install profile selection.
# Users pick one of three profiles in the netinstall step:
#   • shadowos-minimal   ~ 2 GB installed
#   • shadowos-security  ~ 5 GB installed (default)
#   • shadowos-everything ~ 10 GB installed (current default ISO)

backend: pacman

operations:
  - install:
      pre-script: |
        # Drop the autologin lines so the installed system requires a password
        sed -i '/^User=shadow$/d; /^Session=hyprland\.desktop$/d' /etc/sddm.conf.d/shadowos.conf || true
      packages:
        # base shadowos always installed regardless of profile
        - shadowos-meta

# The profile-specific package sets live in:
# /etc/calamares/modules/netinstall.yaml
