# ShadowOS install profile picker.
# Shown in the Calamares "netinstall" step so the user can add optional
# packages during installation. The base OS (everything on the live ISO)
# is already installed via unpackfs — these are additive extras only.
#
# All packages must exist in:
#   Arch [core/extra/multilib] · BlackArch · Chaotic-AUR

- name: "Minimal extras"
  description: "A few quality-of-life additions not on the minimal ISO path."
  selected: false
  packages: []

