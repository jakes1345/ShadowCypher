---
# ShadowOS pre-bootloader setup — runs in the installed system chroot
# immediately before grubcfg + bootloader modules.
#
# Responsibilities:
#   1. Copy ShadowOS GRUB theme into /boot/grub/themes/
#   2. Ensure GRUB_THEME is set in /etc/default/grub (belt + suspenders;
#      the file ships from unpackfs but grubcfg may rewrite it)
#   3. Enable the shadowos-firstboot one-shot service
#   4. Stamp /etc/shadowos/live-iso removal so firstboot service runs

timeout: 120
dontChroot: false

script:
  # 1. Install GRUB theme
  - "mkdir -p /boot/grub/themes/shadowos"
  - "cp -r /usr/share/grub/themes/shadowos/. /boot/grub/themes/shadowos/"

  # 2. Wire theme into /etc/default/grub (add if missing, replace if stub)
  - >-
    grep -q '^GRUB_THEME=' /etc/default/grub
    && sed -i 's|^GRUB_THEME=.*|GRUB_THEME="/boot/grub/themes/shadowos/theme.txt"|' /etc/default/grub
    || echo 'GRUB_THEME="/boot/grub/themes/shadowos/theme.txt"' >> /etc/default/grub

  # 3. Remove live-iso stamp so firstboot and mode services behave correctly
  - "-rm -f /etc/shadowos/live-iso"

  # 4. Enable firstboot service (runs once on first real boot, installs AUR extras)
  - "systemctl enable shadowos-firstboot.service"

  # 5. Ensure NetworkManager starts on installed system
  - "systemctl enable NetworkManager.service"

  # 6. Set zsh as default shell for the new user (archinstall handles users,
  #    but calamares users module may default to bash)
  - "-chsh -s /bin/zsh shadow 2>/dev/null || true"
