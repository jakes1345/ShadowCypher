---
# Replace live-ISO mkinitcpio hooks with installed-system hooks BEFORE
# Calamares runs the initcpio module (which calls mkinitcpio -P).
#
# The live ISO ships:
#   HOOKS=(base udev microcode modconf kms block keyboard keymap consolefont archiso)
#
# The "archiso" hook only exists in the live environment. On the installed system
# mkinitcpio -P would fail with "ERROR: Hook 'archiso' cannot be found".
# Plymouth is added here so the installed system gets the boot splash.

timeout: 30
dontChroot: false

script:
  - >-
    sed -i
    's/^HOOKS=.*/HOOKS=(base udev autodetect microcode modconf kms plymouth keyboard keymap consolefont block filesystems fsck)/'
    /etc/mkinitcpio.conf
