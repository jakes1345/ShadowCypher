---
# Replace live-ISO mkinitcpio hooks with installed-system hooks BEFORE
# Calamares runs the initcpio module (which calls mkinitcpio -P).
#
# The live ISO ships:
#   HOOKS=(base udev microcode modconf kms block keyboard keymap consolefont archiso)
#
# The "archiso" hook only exists in the live environment. On the installed system
# mkinitcpio -P would fail with "ERROR: Hook 'archiso' cannot be found".
# Plymouth is added here so the installed system gets the boot splash.
#
# When the root filesystem sits on LUKS ("Encrypt system" on the partition
# page), the "encrypt" hook goes between block and filesystems; without it the
# initramfs can't open the cryptdevice= that grubcfg puts on the kernel command
# line, and the installed system never finds its root. lsblk -s walks from the
# root's source down through its parents, so "crypt" shows up whether the root
# is directly on dm-crypt or below btrfs subvolumes.

timeout: 30
dontChroot: false

script:
  - >-
    if lsblk -s -no TYPE "$(findmnt -no SOURCE / | sed 's/\[.*//')" 2>/dev/null | grep -qx crypt;
    then H='base udev autodetect microcode modconf kms plymouth keyboard keymap consolefont block encrypt filesystems fsck';
    else H='base udev autodetect microcode modconf kms plymouth keyboard keymap consolefont block filesystems fsck';
    fi;
    sed -i "s/^HOOKS=.*/HOOKS=($H)/" /etc/mkinitcpio.conf
