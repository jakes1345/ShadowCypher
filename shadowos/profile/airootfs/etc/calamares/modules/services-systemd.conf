---
# Services to enable/disable on the installed system.
# These run in the installed chroot after unpackfs.

services:
    - name: NetworkManager
      enabled: true
    - name: sddm
      enabled: true
    - name: ufw
      enabled: true
    - name: apparmor
      enabled: true
    - name: dnscrypt-proxy
      enabled: true
    - name: fail2ban
      enabled: true
    - name: bluetooth
      enabled: true
    - name: shadowos-firstboot
      enabled: true
    - name: shadowos-mac-randomize
      enabled: true
    - name: shadowos-live-login-fix
      enabled: false

targets:
    - name: "graphical"
      enabled: true
