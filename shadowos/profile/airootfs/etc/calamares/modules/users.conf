---
# Calamares users module — ShadowOS
# Controls default group membership, sudo access, and password policy for
# the user created during installation.

defaultGroups:
    - name: users
      id: 100
      type: system
      state: create
    - wheel
    - audio
    - video
    - input
    - network
    - storage
    - optical
    - power
    - rfkill
    - uucp
    - wireshark

# Users in the wheel group get passworded sudo via /etc/sudoers.d/wheel
sudoersGroup: wheel

# Don't set a root password — sudo-only model
setRootPassword: false

# Require password confirmation on the install screen
askForPasswordConfirmation: true

passwordRequirements:
    nonempty: true
    minLength: 8
    maxLength: -1

userShell: /bin/bash

# SDDM autologin is handled by /etc/sddm.conf.d/shadowos.conf after install;
# don't set it here so the user's chosen password is always required at boot.
doAutologin: false
