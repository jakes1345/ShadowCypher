# ShadowOS — Hyprland 0.45+ config
# Influences: Omarchy (polish/keybinds), Qubes (trust borders), Tails (amnesia mode),
#             Parrot (AnonSurf), SteamOS (gamescope session)

monitor = , preferred, auto, 1

# === Autostart ===
exec-once = bash -c 'swaybg -i /usr/share/backgrounds/shadowos/wallpaper.png -m fill 2>/dev/null || hyprpaper'
exec-once = sleep 1 && (waybar || (sleep 2 && waybar -c /etc/shadowos/desktop/waybar/config.fallback.jsonc))
exec-once = mako
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = foot --server
# Zoxide database initialization (omarchy-style smart navigation)
exec-once = zoxide init zsh > /dev/null 2>&1 || true
# Start atuin daemon for shell history
exec-once = atuin daemon 2>/dev/null || true
# First-run welcome wizard (stamp: ~/.config/shadowos/welcome.stamp — no-op after first run)
exec-once = sleep 2 && /usr/local/bin/shadowos-welcome
# ShadowCypher is opt-in: SUPER+S or the Waybar icon — not a login takeover

# === Env ===
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland,x11
env = SHADOWOS_VERSION,0.3
# omarchy-style: consistent terminal env
env = TERM,foot
env = COLORTERM,truecolor
# Proton / Steam environment (SteamOS-inspired)
env = STEAM_RUNTIME,1
env = DXVK_ASYNC,1
env = PROTON_NO_ESYNC,0
env = PROTON_NO_FSYNC,0

# === Input ===
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

# === Look & feel ===
general {
    gaps_in = 5
    gaps_out = 52, 12, 12, 12
    border_size = 2
    col.active_border   = rgba(00E0A4FF) rgba(00B988FF) 45deg
    col.inactive_border = rgba(11161DAA)
    layout = dwindle
    resize_on_border = true
    no_focus_fallback = false
}

decoration {
    rounding = 12

    blur {
        enabled = true
        size = 6
        passes = 2
        ignore_opacity = true
        vibrancy = 0.1
        vibrancy_darkness = 0
        special = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 2
        color = rgba(00000066)
        color_inactive = rgba(00000033)
    }

    dim_inactive = true
    dim_strength = 0.05
    active_opacity   = 1.0
    inactive_opacity = 0.95
}

# omarchy-inspired: smooth, purposeful animations (not flashy)
animations {
    enabled = true

    # Easings — feel like native macOS motion
    bezier = easeOut,   0.0,  0.0,  0.2,  1.0
    bezier = easeIn,    0.4,  0.0,  1.0,  1.0
    bezier = easeInOut, 0.4,  0.0,  0.2,  1.0
    bezier = spring,    0.2,  0.85, 0.32, 1.1

    animation = windows,       1, 4,  spring,    popin 85%
    animation = windowsOut,    1, 3,  easeIn,    popin 90%
    animation = windowsMove,   1, 3,  easeInOut
    animation = border,        1, 8,  easeInOut
    animation = borderangle,   1, 50, easeOut,   loop
    animation = fade,          1, 5,  easeInOut
    animation = fadeDim,       1, 5,  easeInOut
    animation = workspaces,    1, 4,  easeOut,   slidevert
    animation = specialWorkspace, 1, 4, spring,  slidevert
}

dwindle {
    preserve_split = true
    smart_split = false
    force_split = 2
}

master {
    new_status = master
    mfact = 0.55
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x0D1B2A
    enable_swallow = true
    swallow_regex = ^(foot|footclient)$
    focus_on_activate = true
}

# === Keybinds ===
$mod = SUPER
# Terminal: prefer ghostty (omarchy's default GPU terminal) → foot fallback
$term = bash -c 'command -v ghostty >/dev/null 2>&1 && exec ghostty || exec foot'

bind = $mod, Return, exec, $term
bind = $mod, F1, exec, /usr/local/bin/shadowos-tour
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exec, hyprctl dispatch exit
bind = $mod, E, exec, thunar
bind = $mod, D, exec, wofi --show drun
bind = $mod, SPACE, exec, /usr/local/bin/shadow-ai-overlay
bind = $mod, B, exec, librewolf
bind = $mod, T, exec, /usr/local/bin/shadow-mode toggle-tor
bind = $mod, M, exec, /usr/local/bin/shadow-mode picker
bind = $mod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod, L, exec, hyprlock
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod, F, fullscreen
bind = $mod SHIFT, SPACE, togglefloating
bind = $mod, P, pseudo

# === Apps — quick launchers for the shipped suite ===
bind = $mod, G, exec, steam
bind = $mod SHIFT, G, exec, /usr/local/bin/shadow-gamescope        # SteamOS Big Picture
bind = $mod, C, exec, code
bind = $mod SHIFT, C, exec, foot -e nvim
bind = $mod, N, exec, foot -e btop
bind = $mod, I, exec, /usr/local/bin/shadow-settings
bind = $mod, S, exec, env SHADOWCYPHER_MANUAL=1 /usr/local/bin/shadowcypher-autostart --manual
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod, X, exec, foot -e shadow-mode picker
# File manager — yazi (omarchy-style TUI file manager) or thunar as GUI fallback
bind = $mod, E, exec, foot -e yazi
bind = $mod SHIFT, E, exec, thunar

# === Security / anonymity (Parrot AnonSurf + Tails amnesia) ===
bind = $mod, A, exec, pkexec shadow-anonsurf start           # Parrot AnonSurf
bind = $mod SHIFT, A, exec, pkexec shadow-anonsurf stop      # Stop AnonSurf
bind = $mod ALT, A, exec, foot -e shadow-anonsurf check      # Leak check

# Amnesia mode (Tails-inspired: ephemeral home + transparent Tor)
bind = $mod SHIFT, T, exec, pkexec /etc/shadowos/modes/amnesia/apply.sh

# === Emergency wipe (Tails panic button) ===
bind = $mod CTRL SHIFT, W, exec, pkexec shadow-panic-wipe

# === Qubes VM compartmentalization ===
bind = $mod, Q, exec, foot -e shadow-qube list               # list VMs
bind = $mod SHIFT, Q, exec, pkexec shadow-qube disposable    # one-shot disposable VM

# === Shell history (omarchy-style: atuin replaces ctrl+r) ===
bind = $mod, R, exec, foot -e atuin search --interactive

# === Quick app switching (omarchy-inspired) ===
bind = $mod, Tab, cyclenext
bind = $mod SHIFT, Tab, cyclenext, prev
# Overview of all windows (hyprland overview plugin)
bind = $mod, grave, overview:toggle

# === Scratchpad (omarchy-style floating terminal) ===
bind = $mod ALT, Return, togglespecialworkspace, scratch
bind = $mod ALT SHIFT, Return, movetoworkspace, special:scratch
exec-once = foot --title="scratch" --app-id="scratch"

# === Workspace naming (Qubes-inspired per-trust workspaces) ===
# WS 1=normal  2=work  3=personal  4=untrusted  5=vault  6=pentest  7=gaming
workspace = 1, name:normal,   monitor:, default:true
workspace = 2, name:work,     monitor:
workspace = 3, name:personal, monitor:
workspace = 4, name:untrusted,monitor:
workspace = 5, name:vault,    monitor:
workspace = 6, name:pentest,  monitor:
workspace = 7, name:gaming,   monitor:
workspace = 8, name:media,    monitor:

# === Window rules (omarchy-style: float utilities, tile everything else) ===

# Float small utility windows
windowrulev2 = float,  class:^(pavucontrol|nm-connection-editor|blueman-manager|seahorse|lxappearance|nwg-look)$
windowrulev2 = size  600 400, class:^(pavucontrol)$
windowrulev2 = center 1,      class:^(pavucontrol|nm-connection-editor)$
windowrulev2 = float,  class:^(org.gnome.Nautilus|thunar)$,     title:^(File Operation)$
windowrulev2 = float,  title:^(Picture-in-Picture)$
windowrulev2 = pin,    title:^(Picture-in-Picture)$
windowrulev2 = float,  class:^(imv|eog|loupe)$
windowrulev2 = float,  class:^(scratch)$
windowrulev2 = size  900 600, class:^(scratch)$
windowrulev2 = center 1,      class:^(scratch)$
# Virt-viewer (Qubes VMs) — always float so border color is visible
windowrulev2 = float,  class:^(virt-viewer|remote-viewer)$
windowrulev2 = size  1280 800, class:^(virt-viewer|remote-viewer)$

# === Qubes-style trust borders (dynamic — also set by shadow-qube per VM) ===
# vault VMs (red border, offline)
windowrulev2 = bordercolor rgba(FF2222FF) rgba(FF0000AA) 45deg, title:^(vault-.*)
windowrulev2 = bordersize 4, title:^(vault-.*)
# untrusted VMs (red border)
windowrulev2 = bordercolor rgba(FF2222FF) rgba(FF0000AA) 45deg, title:^(untrusted-.*)
windowrulev2 = bordersize 4, title:^(untrusted-.*)
# disposable VMs (grey border)
windowrulev2 = bordercolor rgba(888888FF) rgba(666666AA) 45deg, title:^(disp-.*)
windowrulev2 = bordersize 4, title:^(disp-.*)
# work VMs (yellow border)
windowrulev2 = bordercolor rgba(FFDD00FF) rgba(FFAA00AA) 45deg, title:^(work-.*)
windowrulev2 = bordersize 4, title:^(work-.*)
# personal VMs (orange border)
windowrulev2 = bordercolor rgba(FF8800FF) rgba(FF6600AA) 45deg, title:^(personal-.*)
windowrulev2 = bordersize 4, title:^(personal-.*)

# Workspace rules — send known apps to their trust-level workspace
windowrulev2 = workspace 7, class:^(steam|gamescope)$
windowrulev2 = workspace 6, class:^(wireshark|metasploit|burpsuite|zaproxy)$
windowrulev2 = workspace 3, class:^(librewolf|mullvad-browser)$

# Opacity rules (omarchy-style: terminal slightly transparent)
windowrulev2 = opacity 0.95 0.85, class:^(foot|footclient)$

# Idle inhibit for media and VMs
windowrulev2 = idleinhibit focus, class:^(mpv|vlc|gamescope|steam)$
windowrulev2 = idleinhibit always, class:^(virt-viewer|remote-viewer)$

# === Source per-VM qube border rules (written by shadow-qube) ===
source = ~/.config/hypr/qube-borders.conf

# === Focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# Move window
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, j, movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-



# === Layout switching ===
bind = $mod ALT, D, exec, hyprctl keyword general:layout dwindle
bind = $mod ALT, M, exec, hyprctl keyword general:layout master
bind = $mod ALT, U, layoutmsg, swapwithmaster master

# === BIOS/UEFI reboot ===
bind = $mod SHIFT, F12, exec, pkexec shadow-bios

# === Mode switching ===
bind = $mod, F10, exec, pkexec shadow-mode gaming          # gaming mode
bind = $mod SHIFT, F10, exec, pkexec shadow-mode normal    # normal mode
bind = $mod, F9, exec, pkexec shadow-gamescope             # SteamOS Big Picture
bind = $mod SHIFT, F9, exec, pkill gamescope               # exit Big Picture
bind = $mod, F8, exec, pkexec /etc/shadowos/modes/qubes/apply.sh   # Qubes mode
bind = $mod, F7, exec, pkexec /etc/shadowos/modes/amnesia/apply.sh # Amnesia mode

# === Resize (omarchy-style: SUPER+ALT+hjkl) ===
binde = $mod ALT, h, resizeactive, -40 0
binde = $mod ALT, l, resizeactive, 40 0
binde = $mod ALT, k, resizeactive, 0 -40
binde = $mod ALT, j, resizeactive, 0 40

# === Hardware-specific tweaks (real hardware: re-enables blur/shadows/animations) ===
# Generated by shadowos-session-start on each login — do not edit manually
source = ~/.config/hypr/hardware-adjustments.conf
