# ShadowOS — Hyprland config
# Canonical copy: /etc/shadowos/desktop/hyprland.conf (re-deployed on every login by
# shadowos-session-start). Put personal tweaks in ~/.config/hypr/user.conf instead.

monitor = , preferred, auto, 1

# === Programs ===
$terminal = shadow-term
$launcher = wofi --show drun
$browser  = librewolf || firefox
$files    = shadow-term -e yazi

# === Autostart ===
exec-once = hyprpaper
exec-once = waybar || (sleep 2 && waybar -c /etc/shadowos/desktop/waybar/config.fallback.jsonc)
exec-once = mako
exec-once = hypridle
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# First-run welcome (stamps ~/.config/shadowos/welcome.stamp — no-op afterwards)
exec-once = sleep 2 && /usr/local/bin/shadowos-welcome
# ShadowCypher is opt-in: SUPER+S or the Waybar icon — never a login takeover

# === Env ===
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland,x11
env = SHADOWOS_VERSION,0.3

# === Input ===
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

# === Look & feel ===
# Border colour follows the active mode — see mode.conf (sourced below).
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border   = rgba(00E0A4FF) rgba(00B988FF) 45deg
    col.inactive_border = rgba(161B22AA)
    layout = dwindle
    resize_on_border = true
}

# Blur/shadow off by default (VM-safe); hardware-adjustments.conf re-enables on bare metal.
decoration {
    rounding = 10
    blur {
        enabled = false
        size = 8
        passes = 3
        ignore_opacity = true
    }
    shadow {
        enabled = false
        range = 24
        render_power = 3
        color = rgba(00000099)
    }
    active_opacity   = 1.0
    inactive_opacity = 0.97
}

animations {
    enabled = true
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = overshoot, 0.05, 0.9, 0.1, 1.05
    animation = windows,    1, 5, overshoot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = border,     1, 10, default
    animation = fade,       1, 6, default
    animation = workspaces, 1, 5, overshoot, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
    mfact = 0.55
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x0D1117
    focus_on_activate = true
}

# === Window rules ===
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol|pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(swappy)$
windowrulev2 = float, title:^(shadow-update.*)$
windowrulev2 = suppressevent maximize, class:.*

# === Keybinds ===
$mod = SUPER

# Apps
bind = $mod, Return, exec, $terminal
bind = $mod, T,      exec, $terminal
bind = $mod, D,      exec, $launcher
bind = $mod, B,      exec, $browser
bind = $mod, E,      exec, $files
bind = $mod, C,      exec, shadow-term -e nvim
bind = $mod, N,      exec, shadow-term -e btop
bind = $mod, SPACE,  exec, /usr/local/bin/shadow-ai-overlay
bind = $mod, I,      exec, /usr/local/bin/shadow-settings
bind = $mod, S,      exec, env SHADOWCYPHER_MANUAL=1 /usr/local/bin/shadowcypher-autostart --manual
bind = $mod, F1,     exec, /usr/local/bin/shadowos-tour

# Clipboard history
bind = $mod, V, exec, cliphist list | wofi --dmenu --prompt clipboard | cliphist decode | wl-copy

# ShadowOS modes (normal · privacy · ghost)
bind = $mod, M,       exec, /usr/local/bin/shadow-mode picker
bind = $mod SHIFT, M, exec, pkexec /usr/local/bin/shadow-mode normal
bind = $mod SHIFT, T, exec, pkexec /usr/local/bin/shadow-mode toggle-tor

# Screenshots: region → annotate · full screen → clipboard
bind = ,       Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT,  Print, exec, grim - | wl-copy && notify-send "Screenshot" "Full screen copied to clipboard"

# Session
bind = $mod, ESCAPE,  exec, /usr/local/bin/shadow-power-menu
bind = $mod CTRL, L,  exec, loginctl lock-session
bind = $mod SHIFT, E, exit
bind = $mod SHIFT, F12, exec, pkexec shadow-bios

# Windows
bind = $mod, Q,           killactive
bind = $mod, F,           fullscreen, 0
bind = $mod SHIFT, F,     fullscreen, 1
bind = $mod SHIFT, SPACE, togglefloating
bind = $mod, P,           pseudo
bind = $mod, J,           togglesplit

# Focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Move window
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Resize
binde = $mod ALT, left,  resizeactive, -40 0
binde = $mod ALT, right, resizeactive, 40 0
binde = $mod ALT, up,    resizeactive, 0 -40
binde = $mod ALT, down,  resizeactive, 0 40

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, TAB,       workspace, e+1
bind = $mod SHIFT, TAB, workspace, e-1
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Scratchpad
bind = $mod, grave,       togglespecialworkspace, scratch
bind = $mod SHIFT, grave, movetoworkspace, special:scratch

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media / hardware keys
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous

# === Per-machine + per-mode overrides (sourced last so they win) ===
# Generated by shadowos-session-start on each login (VM vs bare-metal effects)
source = ~/.config/hypr/hardware-adjustments.conf
# Written by shadowos-theme-apply on mode switch (border accent per mode)
source = ~/.config/hypr/mode.conf
# Personal overrides — never touched by ShadowOS
source = ~/.config/hypr/user.conf
