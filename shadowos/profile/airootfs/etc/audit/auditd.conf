# ShadowOS Audit Daemon Configuration

log_file = /var/log/audit/audit.log
log_format = RAW
log_group = audit
priority_boost = 4
flush = INCREMENTAL
freq = 50
num_logs = 5
disp_qos = lossy
dispatcher = /sbin/audispd
name_format = NONE
name = shadowos
max_log_file = 30
max_log_file_action = ROTATE
space_left = 75
space_left_action = SYSLOG
admin_space_left = 50
admin_space_left_action = SUSPEND
disk_full_action = SUSPEND
disk_error_action = SUSPEND
session = try
