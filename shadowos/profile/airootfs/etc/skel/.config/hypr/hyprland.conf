# ShadowOS — Hyprland 0.45+ config
# Modern Wayland: rounded corners, blur, animations, ShadowCypher integration.

monitor = , preferred, auto, 1

# === Autostart ===
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = gammastep-indicator
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = foot --server
# First-run welcome wizard (no-op once ~/.config/shadowos/welcome.done exists)
exec-once = /usr/local/bin/shadowos-welcome --autostart
# ShadowCypher is opt-in: SUPER+S or the Waybar icon — not a login takeover

# === Env ===
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland,x11
env = SHADOWOS_VERSION,0.3

# === Input ===
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

# === Look & feel ===
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border   = rgba(00E0A4FF) rgba(00B988FF) 45deg
    col.inactive_border = rgba(11161DAA)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.18
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000099)
    }

    dim_inactive = true
    dim_strength = 0.10
    active_opacity   = 1.0
    inactive_opacity = 0.96
}

animations {
    enabled = true
    bezier  = smoothOut, 0.36, 0, 0.66, -0.56
    bezier  = smoothIn,  0.25, 1, 0.5, 1
    bezier  = overshoot, 0.05, 0.9, 0.1, 1.1
    animation = windows,     1, 5, overshoot, slide
    animation = windowsOut,  1, 4, smoothOut, slide
    animation = border,      1, 10, default
    animation = fade,        1, 7, default
    animation = workspaces,  1, 6, overshoot, slide
}

dwindle {
    preserve_split = true
    smart_split = false
    force_split = 2
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x05080C
    enable_swallow = true
    swallow_regex = ^(foot|footclient)$
    focus_on_activate = true
}

# === Keybinds ===
$mod = SUPER

bind = $mod, Return, exec, foot
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exec, hyprctl dispatch exit
bind = $mod, E, exec, thunar
bind = $mod, D, exec, wofi --show drun
bind = $mod, SPACE, exec, /usr/local/bin/shadow-ai-overlay
bind = $mod, B, exec, librewolf
bind = $mod, T, exec, /usr/local/bin/shadow-mode toggle-tor
bind = $mod, M, exec, /usr/local/bin/shadow-mode picker
bind = $mod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod, L, exec, hyprlock
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod, F, fullscreen
bind = $mod SHIFT, SPACE, togglefloating
bind = $mod, P, pseudo,

# === Apps — quick launchers for the shipped suite ===
bind = $mod, G, exec, steam
bind = $mod SHIFT, G, exec, /usr/local/bin/shadow-play
bind = $mod, C, exec, code                        # VSCode
bind = $mod SHIFT, C, exec, foot -e nvim          # Quick editor
bind = $mod, N, exec, foot -e btop                # System monitor
bind = $mod, I, exec, /usr/local/bin/shadow-settings
bind = $mod, S, exec, env SHADOWCYPHER_MANUAL=1 /usr/local/bin/shadowcypher-autostart --manual
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -  # Screenshot region (alias)
bind = $mod, X, exec, foot -e shadow-mode picker  # Inline mode picker

# === Window rules for the new apps ===
# v0.45+ syntax: use explicit 'on' for toggles, 'match:class' instead of bare 'class:'
windowrule = float on,            match:class MangoHud
windowrule = opacity 0.97 0.92,   match:class code
windowrule = opacity 0.97 0.92,   match:class VSCodium
windowrule = immediate on,        match:class steam_app_
windowrule = idle_inhibit always, match:class gamescope

# Focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# Move window
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, j, movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Window rules — v0.45+ syntax
windowrule = float on,           match:class pavucontrol
windowrule = float on,           match:class nm-connection-editor
windowrule = float on,           match:title Open File
windowrule = float on,           match:class calamares
windowrule = opacity 0.94 0.88,  match:class foot

# ShadowCypher — float at 75% of screen, centered, not fullscreen
# app_id is org.shadowcypher.ShadowCypher on Wayland; also match legacy class
windowrule = float on,           match:class org.shadowcypher.ShadowCypher
windowrule = size 1380 860,      match:class org.shadowcypher.ShadowCypher
windowrule = center,             match:class org.shadowcypher.ShadowCypher
windowrule = opacity 0.97 0.93,  match:class org.shadowcypher.ShadowCypher
# X11/fallback match
windowrule = float on,           match:class ShadowCypher
windowrule = size 1380 860,      match:class ShadowCypher
windowrule = center,             match:class ShadowCypher
windowrule = opacity 0.97 0.93,  match:class ShadowCypher

# === Gaming mode keybind ===
bind = $mod, F10, exec, pkexec shadow-mode gaming
bind = $mod SHIFT, F10, exec, pkexec shadow-mode normal
