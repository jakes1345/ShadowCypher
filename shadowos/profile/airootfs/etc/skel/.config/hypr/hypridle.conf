general {
    # --grace: for two seconds after locking, any key or mouse movement unlocks again.
    lock_cmd = pidof hyprlock || hyprlock --grace 2
    before_sleep_cmd = loginctl lock-session $XDG_SESSION_ID
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session $XDG_SESSION_ID
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
