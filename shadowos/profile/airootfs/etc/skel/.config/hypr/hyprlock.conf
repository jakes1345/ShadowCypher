general {
    grace = 2
    hide_cursor = true
}

background {
    monitor =
    path = /usr/share/backgrounds/shadowos/shadowos-01-hex-teal-1920x1080.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    contrast = 1.0
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.4
    outer_color = rgb(00E0A4)
    inner_color = rgba(11161DCC)
    font_color  = rgb(E6EDF3)
    fade_on_empty = true
    placeholder_text = <span foreground="##6B7785">password</span>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = ShadowOS
    color = rgba(E6EDF3FF)
    font_size = 56
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color = rgba(E6EDF3CC)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = privacy is a posture
    color = rgba(6B7785AA)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -160
    halign = center
    valign = center
}
