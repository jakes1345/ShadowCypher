# ShadowOS MangoHud — toggled with right-shift + F12
# Minimal HUD: FPS, frame time, GPU/CPU usage, temps, VRAM, RAM

position=top-left
no_display=0
toggle_hud=Shift_R+F12
toggle_logging=Shift_R+F11

# Performance
fps
frametime=0
frame_count=0
frame_timing=1

# CPU
cpu_stats
cpu_temp
cpu_power
cpu_color=00E0A4

# GPU
gpu_stats
gpu_temp
gpu_power
gpu_color=00E0A4

# Memory
vram
ram

# Engine/version line
engine_version
gpu_name
vulkan_driver

# Style — ShadowOS palette
background_alpha=0.55
font_size=20
text_color=E6EDF3
background_color=11161D
border_color=00E0A4
