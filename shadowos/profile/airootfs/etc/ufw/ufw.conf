# /etc/ufw/ufw.conf
ENABLED=yes
LOGLEVEL=medium
LOGFILE=/var/log/ufw.log
LIMIT=5/m
LIMIT_BURST=7
IPV6=yes
DEFAULT_INPUT_POLICY=DROP
DEFAULT_OUTPUT_POLICY=ACCEPT
DEFAULT_FORWARD_POLICY=DROP
DEFAULT_APPLICATION_POLICY=SKIP
MANAGE_BUILTINS=no
IPT_SYSCTL=/etc/ufw/sysctl.conf
IPT_MODULES=
SUBNETS=
RUNTIME=yes
