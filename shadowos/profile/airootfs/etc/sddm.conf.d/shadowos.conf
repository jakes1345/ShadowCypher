[Theme]
Current=shadowos
CursorTheme=Adwaita
Font=JetBrainsMono Nerd Font

[Wayland]
SessionDir=/usr/share/wayland-sessions

[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Autologin]
# Auto-login for the live ISO so the desktop appears without typing.
# Installed systems should remove these via the installer (password required).
User=shadow
Session=hyprland.desktop
Relogin=false
