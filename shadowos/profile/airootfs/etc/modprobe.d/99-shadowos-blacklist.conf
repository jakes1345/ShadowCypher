# ShadowOS Kernel Module Blacklist

# Disable uncommon network protocols
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc

# Disable USB storage (on non-USB systems)
# Uncomment if not using USB drives for data
# blacklist usb_storage

# Disable uncommon filesystems
blacklist cramfs
blacklist freevxfs
blacklist jffs2
blacklist hfs
blacklist hfsplus
blacklist udf

# Disable debug kernel modules
blacklist kgdboc
blacklist kgdbts

# Disable uncommon video drivers (on server)
# Uncomment for headless deployments
# blacklist nouveau
# blacklist nvidia
