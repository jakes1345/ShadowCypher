# ShadowOS Kernel Module Hardening

# Disable ICMP redirect
options ipv4 conf/all/send_redirects=0
options ipv4 conf/default/send_redirects=0

# Disable source packet routing
options ipv4 conf/all/send_redirects=0
options ipv4 conf/default/send_redirects=0

# Disable IP forwarding
options ipv4 ip_forward=0

# Require module signing
install dccp true  # Prevent loading if not explicitly requested
