## ShadowOS dnscrypt-proxy configuration
## Privacy-first encrypted DNS — no logs, no filters, no telemetry.
## Docs: https://github.com/DNSCrypt/dnscrypt-proxy/wiki/Configuration

listen_addresses = ['127.0.0.1:53']

max_clients = 250
ipv4_servers = true
ipv6_servers = false
dnscrypt_servers = true
doh_servers = true
odoh_servers = false

# Require: no logging, no filtering, DNSSEC
require_dnssec = true
require_nolog = true
require_nofilter = true

# Trusted server list
server_names = [
    'cloudflare',
    'cloudflare-ipv6',
    'quad9-dnscrypt-ip4-filter-pri',
    'nextdns',
    'adguard-dns',
    'mullvad-doh',
]

disabled_server_names = []

# Never fall back to insecure DNS even if all encrypted servers are unreachable
ignore_system_dns = true

# Minimum TTL for cached responses (seconds)
cache_min_ttl = 600
# Maximum TTL (seconds)
cache_max_ttl = 86400
cache_neg_min_ttl = 60
cache_neg_max_ttl = 600
cache_size = 4096

# Timeouts
timeout = 5000
keepalive = 30

# Use HTTPS for DoH (recommended for privacy)
http3 = false
http_proxy = ''

# Log settings — we want no persistent query logs
log_level = 2
log_file = ''
use_syslog = false

# Reload server list periodically
sources = [
    { name = "public-resolvers",
      urls = ["https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md",
              "https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md"],
      cache_file = "/var/cache/dnscrypt-proxy/public-resolvers.md",
      minisign_key = "RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3",
      refresh_delay = 72,
      prefix = "" },
]

[query_log]
    file = ''

[nx_log]
    file = ''

[blacklist]
    blacklist_file = ''
    log_file = ''

[ip_blacklist]
    blacklist_file = ''
    log_file = ''

[schedules]

[routes]

[captive_portals]
    map_file = ''

[local_doh]
    listen_addresses = []

[anonymized_dns]
    routes = []
    skip_incompatible = false

[dns64]
    prefix = ''
