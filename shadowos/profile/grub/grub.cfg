# ShadowOS GRUB config - overrides upstream archiso releng config.
# Patched: uses archisolabel= (faster + works with future-dated UUIDs)
# and adds rootdelay=10 as a belt-and-suspenders against udev races.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output console
fi

insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

set default=shadowos-verbose
set timeout=5
set timeout_style=menu

# ── ShadowOS theme ──────────────────────────────────────────────────────────
# When the live ISO boots, GRUB looks for the theme inside the ISO's GRUB dir.
# After install-to-disk, customize_airootfs.sh copies the theme into
# /boot/grub/themes/shadowos/ via the postinst.
if [ -f "${prefix}/themes/shadowos/theme.txt" ]; then
    insmod gfxterm
    insmod gfxmenu
    insmod png
    set gfxmode="auto"
    terminal_output gfxterm
    loadfont "${prefix}/fonts/unicode.pf2"
    set theme="${prefix}/themes/shadowos/theme.txt"
    export theme
fi

menuentry "ShadowOS (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'shadowos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% rootdelay=10 cow_spacesize=2G lsm=landlock,lockdown,yama,integrity,apparmor,bpf quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 systemd.show_status=auto console=tty0 console=ttyS0,115200 systemd.journald.forward_to_console=ttyS0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
}

menuentry "ShadowOS (%ARCH%, ${archiso_platform}) - stock kernel (fallback)" --class arch --class gnu-linux --class gnu --class os --id 'shadowos-stock' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% rootdelay=10 cow_spacesize=2G quiet splash loglevel=3 console=tty0 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "ShadowOS (%ARCH%, ${archiso_platform}) - verbose + diag" --class arch --class gnu-linux --class gnu --class os --id 'shadowos-verbose' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% rootdelay=10 cow_spacesize=2G console=tty0 console=ttyS0,115200 systemd.journald.forward_to_console=ttyS0 systemd.log_level=debug
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "ShadowOS (%ARCH%, ${archiso_platform}) with speech" --hotkey s --class arch --class gnu-linux --class gnu --class os --id 'shadowos-a11y' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% rootdelay=10 accessibility=on
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    fi
    menuentry 'Reboot to firmware' --class efi {
        fwsetup
    }
fi

menuentry 'System reboot' --class reboot --class system {
    echo 'System rebooting...'
    reboot
}

menuentry 'System shutdown' --class shutdown --class system {
    echo 'System shutting down...'
    halt
}
