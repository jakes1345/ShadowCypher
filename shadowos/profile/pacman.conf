#
# ShadowOS pacman.conf — extends arch's releng with multilib + BlackArch
# Used by mkarchiso during build AND copied into the live system.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8
Color
ILoveCandy

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# multilib needed for Steam, wine, lib32-* libraries
[multilib]
Include = /etc/pacman.d/mirrorlist

# BlackArch — pentest tools not in official Arch repos
[blackarch]
SigLevel = PackageRequired
Server = https://mirror.cyberbits.eu/blackarch/$repo/os/$arch
Server = https://ftp.halifax.rwth-aachen.de/blackarch/$repo/os/$arch
Server = https://mirror.cherishhost.com/blackarch/$repo/os/$arch
Server = https://www.blackarch.org/blackarch/$repo/os/$arch

# Chaotic-AUR — pre-built AUR packages.
# Provides librewolf, mullvad-browser, heroic-games-launcher, bottles,
# protonup-qt, bibata-cursor-theme, catppuccin-gtk-theme-mocha, swww, etc.
# Keyring + mirrorlist installed in customize_airootfs.sh from chaotic-aur.
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
