#
# ShadowOS pacman.conf — extends arch's releng with multilib + BlackArch
# Used by mkarchiso during build AND copied into the live system.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8
Color
ILoveCandy

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# multilib needed for Steam, wine, lib32-* libraries
[multilib]
Include = /etc/pacman.d/mirrorlist

# BlackArch — pentest tools not in official Arch repos
# (rustscan, ffuf, feroxbuster, subfinder, httpx, nuclei, evil-winrm, etc.)
# Repo + signing key are bootstrapped in customize_airootfs.sh
[blackarch]
SigLevel = PackageRequired
Server = https://www.blackarch.org/blackarch/$repo/os/$arch
