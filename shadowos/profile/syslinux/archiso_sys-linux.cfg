LABEL arch
TEXT HELP
Boot ShadowOS (linux-hardened kernel - AppArmor + LSM stack enabled).
ENDTEXT
MENU LABEL ShadowOS (x86_64, BIOS) - hardened
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-hardened
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% rootdelay=10 cow_spacesize=2G lsm=landlock,lockdown,yama,integrity,apparmor,bpf quiet splash console=tty0 console=ttyS0,115200 systemd.journald.forward_to_console=ttyS0

LABEL archstock
TEXT HELP
Boot ShadowOS on the stock (non-hardened) kernel as a fallback.
ENDTEXT
MENU LABEL ShadowOS (x86_64, BIOS) - stock fallback
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% rootdelay=10 cow_spacesize=2G console=tty0 console=ttyS0,115200

LABEL archspeech
TEXT HELP
Boot ShadowOS with speakup screen reader (accessibility).
ENDTEXT
MENU LABEL ShadowOS (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-hardened
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% rootdelay=10 accessibility=on
