LABEL arch
TEXT HELP
Boot ShadowOS on BIOS.
ENDTEXT
MENU LABEL ShadowOS (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% rootdelay=10 cow_spacesize=1G console=tty0 console=ttyS0,115200 systemd.journald.forward_to_console=ttyS0

LABEL archspeech
TEXT HELP
Boot ShadowOS on BIOS with speakup screen reader.
ENDTEXT
MENU LABEL ShadowOS (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% rootdelay=10 accessibility=on
