<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=/?ref=fallback">
    <title>Redirecting…</title>
    <script>
        // /r/<code> attribution: capture the code from the path, persist it,
        // then push the user to the landing page. The dashboard claims the
        // code on first authenticated request (POST /v1/referrals/claim).
        (function() {
            const m = window.location.pathname.match(/^\/r\/([a-z0-9]{4,16})\/?$/i);
            if (m && m[1]) {
                const code = m[1].toLowerCase();
                try {
                    localStorage.setItem('sc_referral_code', code);
                    localStorage.setItem('sc_referral_seen_at', new Date().toISOString());
                } catch (e) {}
                document.cookie = `sc_ref=${code}; path=/; max-age=2592000; samesite=lax`;
            }
            window.location.replace('/?ref=' + encodeURIComponent((m && m[1]) || ''));
        })();
    </script>
</head>
<body style="background:#020202;color:#aaa;font-family:sans-serif;padding:40px;text-align:center;">
    Redirecting…
</body>
</html>
