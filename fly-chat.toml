# fly.toml app configuration file generated for shadowcypher-chat on 2026-07-06T22:30:19-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'shadowcypher-chat'
primary_region = 'sjc'

[build]
  dockerfile = './Dockerfile.simple'

[env]
  ENVIRONMENT = 'production'

[[services]]
  protocol = ''
  internal_port = 8000
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.http_checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/docs'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
