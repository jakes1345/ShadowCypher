# ShadowOS DNS blocklist config for dnscrypt-proxy
# Drop these into /etc/dnscrypt-proxy/dnscrypt-proxy.toml under [blocked_names]
#
# Sources combined into one allowlist+blocklist:
#   - hagezi-pro-plus (aggressive but clean — recommended)
#   - oisd-big (community-curated, broad)
#   - stevenblack-unified (classic, hosts-style)
#
# Update via `shadow-update --blocklists` (script reloads dnscrypt).

[blocked_names]
blocked_names_file = '/etc/dnscrypt-proxy/blocked-names.txt'

# Generated at first-boot from these sources:
#   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.plus-onlydomains.txt
#   https://big.oisd.nl/domainswild
#   https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/fakenews-gambling-porn/hosts
