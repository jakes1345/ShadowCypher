# ShadowOS SSH server hardening for an installed system.
#
# Not active from here. `shadowos-harden apply ssh` writes these settings to
# /etc/ssh/sshd_config.d/50-shadowos.conf, leaving out the ones that would
# lock the admin who runs it out of the machine.
#
# Ciphers, MACs and key exchange are left to OpenSSH: its defaults are current,
# and a fixed list here would drop the post-quantum key exchange it now
# prefers the day it is added.

# Keys only
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no

# Fewer and shorter chances per connection
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# Nothing a login does not need
X11Forwarding no
PermitUserEnvironment no
HostbasedAuthentication no
IgnoreRhosts yes

# Record the key a login used
LogLevel VERBOSE
