# ShadowCypher Sovereign IRC — Powered by Ergo
# Private. Encrypted. No backdoors.

network:
    name: ShadowCypher

server:
    name: sovereign.shadowcypher.net

    listeners:
        # Plaintext on localhost only
        "127.0.0.1:6667":
        "[::1]:6667":

        # TLS on all interfaces
        ":6697":
            tls:
                cert: fullchain.pem
                key: privkey.pem
            min-tls-version: 1.2

        # WebSocket for GTK UI and web clients
        "127.0.0.1:8097":
            websocket: true

        # WebSocket with TLS
        ":8098":
            websocket: true
            tls:
                cert: fullchain.pem
                key: privkey.pem

    unix-bind-mode: 0777

    sts:
        enabled: false

    websockets:
        allowed-origins: []

    casemapping: "ascii"
    enforce-utf8: true
    lookup-hostnames: false
    forward-confirm-hostnames: true
    check-ident: false
    coerce-ident: '~u'

    motd: ircd.motd
    motd-formatting: true

    relaymsg:
        enabled: true
        separators: "/"
        available-to-chanops: true

    proxy-allowed-from:
        - localhost

    ip-cloaking:
        enabled: true
        enabled-for-always-on: true
        netname: "shadow"
        cidr-len-ipv4: 32
        cidr-len-ipv6: 64
        num-bits: 64

    max-sendq: 512K
    compatibility:
        force-trailing: true
        send-unprefixed-sasl: true
        allow-truncation: false

    ip-limits:
        count: false
        throttle: false

    ip-check-script:
        enabled: false

accounts:
    authentication-enabled: true

    registration:
        enabled: true
        allow-before-connect: true
        throttling:
            enabled: true
            duration: 10m
            max-attempts: 30
        bcrypt-cost: 4
        email-verification:
            enabled: false

    login-throttling:
        enabled: true
        duration: 1m
        max-attempts: 10

    skip-server-password: true
    login-via-pass-command: true

    require-sasl:
        enabled: false

    nick-reservation:
        enabled: true
        additional-nick-limit: 2
        method: strict
        allow-custom-enforcement: false
        guest-nickname-format: "Guest-*"
        force-guest-format: false
        force-nick-equals-account: false
        forbid-anonymous-nick-changes: false

    multiclient:
        enabled: true
        allowed-by-default: true
        always-on: opt-in
        auto-away: opt-in

    bouncer:
        allowed-by-default: true

    vhosts:
        enabled: true
        max-length: 64
        valid-regexp: '^[a-z0-9.\-]+$'

    default-user-modes: "+i"

channels:
    default-modes: "+ntC"

    max-channels-per-client: 100

    operator-only-creation: false

    registration:
        enabled: true
        operator-only: false
        max-channels-per-account: 25

    listing:
        deny-snooping: false

    invite-expiration: 24h

opers:
    jack:
        class: "server-admin"
        whois-line: "is the ShadowCypher administrator"
        password: "$2a$04$jHMcMTYamfiYEpZ3J.58B..nuiHkoN3mW4XNvopENQ.5pZ5zAldaK"
        # password is: shadowcypher2026

oper-classes:
    "chat-moderator":
        title: Chat Moderator
        capabilities:
            - "kill"
            - "ban"
            - "nofakelag"
            - "roleplay"
            - "relaymsg"

    "server-admin":
        title: Server Admin
        extends: "chat-moderator"
        capabilities:
            - "rehash"
            - "accreg"
            - "sajoin"
            - "samode"
            - "vhosts"
            - "chanreg"
            - "history"
            - "defcon"
            - "massmessage"

logging:
    -
        method: stderr
        type: "* -userinput -useroutput"
        level: info

    -
        method: file
        filename: irc.log
        type: "* -userinput -useroutput"
        level: info

debug:
    recover-from-errors: true

lock-file: "ircd.lock"

datastore:
    path: ircd.db
    autoupgrade: true

languages:
    enabled: true
    default: en
    path: languages/

limits:
    nicklen: 32
    identlen: 20
    channellen: 64
    awaylen: 390
    kicklen: 390
    topiclen: 390
    monitor-entries: 100
    whowas-entries: 100
    chan-list-modes: 60
    registration-messages: 1024
    multiline:
        max-bytes: 4096
        max-lines: 100

fakelag:
    enabled: false

roleplay:
    enabled: true
    add-suffix: true
    require-chanops: false
    require-oper: false

extjwt:
    expiration: 45s

history:
    enabled: true
    channel-length: 2048
    client-length: 256
    autoresize-window: 3d
    autoreplay-on-join: 100
    chathistory-maxmessages: 1000

    retention:
        allow-individual-delete: false
        enable-account-indexing: false

    persistent:
        enabled: false

    tagmsg-storage:
        default: false
        whitelist:
            - "+draft/react"
            - "+react"
